  {id:'tierx', ic:'🔟', ko:'종목 마스터', en:'Category Master', dko:'한 종목 티어 X 달성', den:'Reached Tier X in a category', test:st=>{const b=st.best||{};return Object.keys(b).some(k=>categoryTier(k,b[k])>=10);}},
  {id:'sec_leejun', ic:'👑', ko:'이준', en:'Yi Jun', dko:'숨겨진 비밀을 발견했어요', den:'You found a hidden secret', secret:true, test:st=>!!(st.ach&&st.ach.sec_leejun)},
];
function achTitle(a){ return EN()?a.en:a.ko; }
function achDesc(a){ return EN()?a.den:a.dko; }
function checkAchievements(){
  const u=curUser(); if(!u) return []; u.stats=u.stats||{}; const st=u.stats; const have=(st.ach=st.ach||{});
  const fresh=[];
  ACHIEVEMENTS.forEach(a=>{ if(!have[a.id] && a.test(st)){ have[a.id]=Date.now(); fresh.push(a); } });
  if(fresh.length){ accSave(); renderProfile(); const a=fresh[0]; celebrate(true, a.ic+' '+achTitle(a)); }
  return fresh;
}
// share card — a self-contained canvas image of the player's stats & badges
function buildShareCanvas(){
  const u=curUser(); if(!u) return null; const st=u.stats||{};
  const W=640,H=800, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const dark=THEME.mode!=='light';
  const bg=dark?'#0b0b0d':'#eef1f6', card=dark?'#16181d':'#ffffff', ink=dark?'#f3f5f8':'#161a20', mut=dark?'#9ba2af':'#59616e', line=dark?'#2b2e36':'#d5dbe4';
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,dark?'#1a1d24':'#ffffff'); g.addColorStop(1,bg); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle=ink; x.textAlign='left';
  x.font='800 30px system-ui,sans-serif'; x.fillText('🌐 '+(EN()?'Georama':'지오라마'),40,64);
  x.fillStyle=mut; x.font='600 15px system-ui,sans-serif'; x.fillText(EN()?'Geography game progress':'지리 게임 학습 기록',40,90);
  // name pill
  x.fillStyle=ink; x.font='800 26px system-ui,sans-serif'; x.fillText(esc?u.name:u.name,40,140);
  // stat cards
  const stats=[
    [EN()?'Games':'플레이', String(st.games||0)],
    [EN()?'Points':'누적 점수', String(st.points||0)],
    [EN()?'Mastered':'숙달', statMastered(st)+' / '+TOTAL_SOV],
    [EN()?'Daily streak':'데일리 연속', (st.dailyStreak||0)+(EN()?'':'일')],
  ];
  const cols=2, cw=(W-40*2-20)/cols, ch=92;
  stats.forEach((s,i)=>{ const cx=40+(i%cols)*(cw+20), cy=170+Math.floor(i/cols)*(ch+16);
    x.fillStyle=card; roundRect(x,cx,cy,cw,ch,14); x.fill(); x.strokeStyle=line; x.lineWidth=1; x.stroke();
    x.fillStyle=mut; x.font='700 13px system-ui,sans-serif'; x.fillText(s[0],cx+18,cy+30);
    x.fillStyle=ink; x.font='800 30px system-ui,sans-serif'; x.fillText(s[1],cx+18,cy+68); });
  // achievements
  const ach=Object.keys(st.ach||{}); const list=ACHIEVEMENTS.filter(a=>st.ach&&st.ach[a.id]);
  x.fillStyle=ink; x.font='800 18px system-ui,sans-serif'; x.fillText((EN()?'Badges':'뱃지')+' · '+list.length+'/'+ACHIEVEMENTS.length,40,410);
  const per=6, bs=78;
  ACHIEVEMENTS.forEach((a,i)=>{ const bx=40+(i%per)*bs, by=430+Math.floor(i/per)*bs; const owned=st.ach&&st.ach[a.id];
    x.globalAlpha=owned?1:0.25; x.font='40px system-ui,sans-serif'; x.textAlign='center'; x.fillText(a.ic,bx+bs/2-6,by+42); x.globalAlpha=1; x.textAlign='left'; });
  // footer
  x.fillStyle=mut; x.font='600 13px system-ui,sans-serif'; x.textAlign='center';
  x.fillText((EN()?'Play at ':'')+'darkerapple.github.io/mapgame',W/2,H-34);
  return c;
}
function roundRect(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }

function renderProfile(){
  const u=curUser();
  if(u){ migrateXP(u); }   // backfill XP from existing tiers/ELO once
  el.profilebtnT.textContent=u?u.name:LT('로그인','Log in');
  el.profilebtn.setAttribute('aria-label',u?(LT('프로필: ','Profile: ')+u.name):LT('로그인 또는 회원가입','Log in or sign up'));
  if(typeof applyCosmetics==='function') applyCosmetics();
  if(el.rankBanner && typeof renderRankBanner==='function') renderRankBanner();
  if(!u){ el.profilecard.classList.add('hidden'); el.profilecard.innerHTML=''; return; }
  const st=u.stats||{games:0,best:{},points:0};
  const bests=Object.keys(st.best||{}).map(k=>({k,v:st.best[k]})).sort((a,b)=>b.v-a.v).slice(0,4);
  let bh=''; bests.forEach(b=>{ const meta=MODE_LABEL[b.k], nm=meta?(EN()?(meta.te||meta.t):meta.t):b.k;
    bh+='<div class="pc-stat"><div class="n">'+b.v+'</div><div class="l">'+esc(nm)+'</div></div>'; });
  el.profilecard.classList.remove('hidden');
  el.profilecard.innerHTML='<div class="pc-head">'
    +'<div class="pc-avatar">'+esc(u.name.charAt(0).toUpperCase())+'</div>'
    +'<div><div class="pc-name">'+esc(u.name)+'</div><div class="pc-sub">'+LT('플레이 ','Games ')+(st.games||0)+' · '+LT('누적 점수 ','Total points ')+(st.points||0)
      +(st.elo!=null?(' · '+(function(t){return t.ic+' '+LT(t.ko,t.en)+' '+Math.round(st.elo);})(rankTierOf(st.elo))+(shinyCount()?(' · ✨'+shinyCount()):'')):'')+'</div></div>'
    +'<button class="btn pc-logout" id="pc-logout"><span data-icon="logout"></span> <span>'+LT('로그아웃','Log out')+'</span></button>'
    +'</div>'
    +(bh?('<div class="pc-stats">'+bh+'</div>'):('<div class="pc-sub" style="margin-top:11px">'+LT('게임을 하면 최고 기록이 여기에 쌓여요.','Play a game and your best scores show up here.')+'</div>'))
    +progressionHTML(st)
    +achievementsHTML(st)
    +'<div class="pc-actions"><button class="btn pc-share" id="pc-share">🎉 '+LT('공유 카드 만들기','Make a share card')+'</button></div>';
  const lg=el.profilecard.querySelector('#pc-logout');
  lg.querySelector('[data-icon]').insertAdjacentHTML('afterbegin',ICONS.logout);
  lg.onclick=()=>{ doLogout(); renderProfile(); };
  const sh=el.profilecard.querySelector('#pc-share'); if(sh) sh.onclick=openShare;
}
function progressionHTML(st){
  const xp=st.xp||0, lv=levelForXp(xp), cur=xpForLevel(lv), nxt=xpForLevel(lv+1);
  const pct=Math.max(0,Math.min(100,Math.round((xp-cur)/(nxt-cur)*100)));
  const best=st.best||{};
  const tiers=Object.keys(best).map(k=>({k,t:categoryTier(k,best[k])})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t).slice(0,10);
  let th=''; tiers.forEach(x=>{ const meta=MODE_LABEL[x.k], nm=meta?(EN()?(meta.te||meta.t):meta.t):x.k;
    th+='<span class="pc-tier'+(x.t>=10?' max':'')+'">'+esc(nm)+' <b>'+TIER_ROMAN[x.t]+'</b></span>'; });
  return '<div class="pc-lv"><div class="pc-lvhead">'+LT('레벨','Level')+' <b>'+lv+'</b> · '+xp+' XP · '+LT('다음까지 ','next in ')+(nxt-xp)+'</div><div class="pc-lvbar"><i style="width:'+pct+'%"></i></div></div>'
    +(tiers.length?('<div class="pc-sec">'+LT('종목 등급','Game tiers')+'</div><div class="pc-tiers">'+th+'</div>'):'');
}
function achievementsHTML(st){
  const owned=ACHIEVEMENTS.filter(a=>a.test(st));
  let badges=''; ACHIEVEMENTS.forEach(a=>{ const on=a.test(st);
    if(a.secret && !on){ badges+='<span class="ach-badge off" title="'+LT('숨겨진 업적','Hidden achievement')+'" aria-label="'+LT('숨겨진 업적','hidden achievement')+'">❓</span>'; return; }
    badges+='<span class="ach-badge'+(on?'':' off')+'" title="'+esc(achTitle(a)+' — '+achDesc(a))+'" aria-label="'+esc(achTitle(a)+(on?'':LT(' (미획득)',' (locked)')))+'">'+a.ic+'</span>'; });
  return '<div class="pc-ach"><div class="pc-ach-h">'+LT('뱃지','Badges')+' · '+owned.length+'/'+ACHIEVEMENTS.length+'</div><div class="pc-ach-grid">'+badges+'</div></div>';
}
el.profilebtn.onclick=openAuth;
el.authClose.onclick=closeAuth;
el.auth.addEventListener('click',e=>{ if(e.target===el.auth) closeAuth(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&el.auth.classList.contains('show')) closeAuth(); });

buildHome();
showHome();
applyLang();
renderProfile();
if(SUPA_ON){ sbBootstrap(); document.addEventListener('visibilitychange',()=>{ if(document.hidden) sbSaveStatsNow(); }); window.addEventListener('pagehide',()=>{ sbSaveStatsNow(); }); }
</script>
