<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Georama · 지오라마 — 지도로 배우는 지리 게임</title>
<meta name="description" content="나라 이름이나 약자를 입력하면 세계 지도에서 해당 나라가 하이라이트됩니다. 학습 카드, 타이머, 여러 게임 모드 포함.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%23159a5a%22%2F%3E%3Ccircle%20cx%3D%2214.5%22%20cy%3D%2216.5%22%20r%3D%228.5%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M6%2016.5h17M14.5%208c2.7%202.9%202.7%2014.1%200%2017M14.5%208c-2.7%202.9-2.7%2014.1%200%2017%22%20fill%3D%22none%22%20stroke%3D%22%23159a5a%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M23%203.5c-2.2%200-4%201.8-4%204%200%203%204%206.2%204%206.2s4-3.2%204-6.2c0-2.2-1.8-4-4-4z%22%20fill%3D%22%23ffd54a%22%20stroke%3D%22%230c6b3c%22%20stroke-width%3D%221.1%22%2F%3E%3Ccircle%20cx%3D%2223%22%20cy%3D%227.5%22%20r%3D%221.7%22%20fill%3D%22%230c6b3c%22%2F%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --ocean1:#141519; --ocean2:#0a0a0c;
  --surface:#141519; --surface2:#1c1e24; --surface3:#24262d;
  --border:#2b2e36; --border2:#3a3e48;
  --land:#3a3d45; --land-stroke:#5a5f6a; --hover:#565b66;
  --found:#34c777; --found-stroke:#9defc0;
  --target:#ffd54a;
  --text:#f3f5f8; --muted:#9ba2af; --faint:#6a707b;
  --accent:#ffffff; --accent-ink:#0b0b0d;
  --ok:#3fd06b; --ok-dim:rgba(63,208,107,.16); --bad:#ff5a5a; --bad-dim:rgba(255,90,90,.15);
  --p1:#4ea1ff; --p1-dim:rgba(78,161,255,.16); --p2:#ff8a4c; --p2-dim:rgba(255,138,76,.16);
  --fever:#ff5a8a;
  --shadow:0 16px 48px rgba(0,0,0,.6);
  --font:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Segoe UI,Roboto,sans-serif;
}
/* ---------- light theme ---------- */
html[data-theme="light"]{
  --bg:#eef1f6; --ocean1:#dde4ee; --ocean2:#eaeef4; --ocean3:#cdd6e3;
  --home-grad1:#ffffff; --home-grad2:#f2f5fa; --card-grad:#e9edf4;
  --surface:#ffffff; --surface2:#eef1f6; --surface3:#e2e7f0;
  --border:#d5dbe4; --border2:#c1c9d5;
  --land:#c6cdd9; --land-stroke:#98a1b2; --hover:#7f8a9c;
  --found:#1a9e57; --found-stroke:#0b6f3c;
  --target:#dca100;
  --text:#161a20; --muted:#59616e; --faint:#8992a1;
  --accent:#171b22; --accent-ink:#ffffff;
  --p1:#2f7fe0; --p2:#e0722a;
  --shadow:0 16px 48px rgba(30,40,60,.18);
}
/* ---------- colorblind-safe accents (Okabe–Ito) ---------- */
html[data-cb="1"]{
  --found:#009e73; --found-stroke:#7fe8c8;
  --target:#e69f00;
  --p1:#0072b2; --p1-dim:rgba(0,114,178,.18); --p2:#d55e00; --p2-dim:rgba(213,94,0,.18);
  --fever:#cc79a7;
}
html[data-cb="1"][data-theme="light"]{ --found-stroke:#0b6f4c; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font-family:var(--font); font-size:14px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.ic{width:1.05em;height:1.05em;flex:0 0 auto;display:inline-block;vertical-align:-.16em}
#app{display:flex;flex-direction:column;height:100%}
.hidden{display:none!important}

/* ---------- header (two rows) ---------- */
header{background:var(--surface);position:relative;z-index:30;border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:10px;padding:7px 14px}
.bar-top{border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:-.01em}
.brand{cursor:pointer}
.brand .ic{width:19px;height:19px;opacity:.92}
.modetitle{color:var(--muted);font-size:13.5px;font-weight:700;margin-left:2px}
.modetitle:before{content:'/';margin-right:8px;color:var(--faint)}
.modetitle:empty{display:none}
.modes{display:flex;gap:4px;flex-wrap:wrap;margin-left:6px}
.mode{
  background:transparent;border:1px solid transparent;color:var(--muted);
  padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;
  transition:color .16s,background .16s,transform .12s;white-space:nowrap;
}
.mode:hover{color:var(--text);background:var(--surface2)}
.mode:active{transform:translateY(1px)}
.mode.active{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tools-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{
  display:flex;align-items:baseline;gap:7px;background:var(--surface2);border:1px solid var(--border);
  padding:6px 13px;border-radius:10px;font-variant-numeric:tabular-nums;
}
.chip .lbl{font-size:11px;color:var(--muted)}
.chip .val{font-size:15px;font-weight:700;letter-spacing:.01em;transition:color .2s}
#timer.low .val{animation:lowPulse 1s ease-in-out infinite}
@keyframes lowPulse{0%,100%{opacity:1}50%{opacity:.35}}
select#region{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;padding:7px 11px;border-radius:10px;cursor:pointer;max-width:46vw;
}
select#region:focus{outline:none;border-color:var(--border2)}
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:8px 13px;border-radius:10px;cursor:pointer;font:inherit;font-size:13px;
  transition:background .16s,border-color .16s,transform .12s;
}
.btn:hover{background:var(--surface3);border-color:var(--border2)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.solid:hover{filter:brightness(.94)}
.btn.on{background:color-mix(in srgb,var(--found) 22%,var(--surface2));border-color:var(--found)}
#themebtn,#cbbtn{padding:8px 11px}

/* ---------- prompt + input ---------- */
#promptbar{
  padding:10px 16px 2px;font-size:13.5px;color:var(--muted);text-align:center;
  min-height:24px;animation:fadeSlide .3s ease;
}
#vsbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px 2px;font-size:13px}
#vsbar .vsp{font-weight:800;padding:4px 12px;border-radius:999px;border:1.5px solid var(--border2);
  color:var(--muted);background:var(--surface2);transition:.18s;min-width:64px;text-align:center}
#vsbar .vsp.p1{color:var(--p1)} #vsbar .vsp.p2{color:var(--p2)}
#vsbar .vsp.p1.on{background:var(--p1-dim);border-color:var(--p1);box-shadow:0 0 0 2px var(--p1-dim)}
#vsbar .vsp.p2.on{background:var(--p2-dim);border-color:var(--p2);box-shadow:0 0 0 2px var(--p2-dim)}
#vsbar .vsturn{color:var(--text);font-weight:700;font-size:12.5px}
#scoreval .p1cur{color:var(--p1)} #scoreval .p2cur{color:var(--p2)}
#promptbar b{color:var(--text);font-weight:700}
#promptbar .flag{display:block;font-size:34px;line-height:1;margin:0 0 5px;animation:cardIn .3s ease}
#promptbar .flag-xl{font-size:clamp(72px,16vw,132px);margin:2px 0 6px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
#promptbar .cname{font-size:16px;color:var(--text);font-weight:700}
#promptbar .lm-hint{display:block;color:var(--text);font-size:14.5px;font-weight:600;max-width:640px;margin:3px auto 0;line-height:1.5}
#promptbar .sil-svg{display:block;width:clamp(150px,30vw,260px);height:clamp(110px,22vh,190px);margin:2px auto 4px;color:var(--accent);filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
#promptbar .cap-q{display:block;font-size:clamp(22px,5vw,34px);font-weight:800;color:var(--target);margin-bottom:2px}
#promptbar .fun-badge{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);background:var(--target);border-radius:999px;padding:3px 11px;margin-bottom:6px}
#promptbar .fun-q{display:block;font-size:clamp(19px,4.4vw,28px);font-weight:800;color:var(--text);line-height:1.25}
#promptbar .fun-note{font-size:12.5px;color:var(--muted);margin-top:4px}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(5px) scale(.94)}to{opacity:1;transform:none}}
#inputrow{display:flex;gap:8px;padding:8px 16px 4px;max-width:680px;margin:0 auto;width:100%;justify-content:center}
#q{
  flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);
  font:inherit;font-size:16px;padding:12px 15px;outline:none;transition:border-color .16s,box-shadow .16s;
}
#q::placeholder{color:var(--faint)}
#q:focus{border-color:#666d7a;box-shadow:0 0 0 3px rgba(255,255,255,.07)}
#q.shake{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#inputrow .btn{padding:0 16px;font-size:14px}
#go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#go:hover{filter:brightness(.94)}
.step{min-width:74px}
#feedback{
  text-align:center;min-height:24px;padding:5px 16px 9px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
#feedback .ic{width:18px;height:18px;stroke-width:2.6}
#feedback.bump{animation:bump .32s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bump{0%{opacity:0;transform:scale(.8) translateY(3px)}60%{transform:scale(1.06)}100%{opacity:1;transform:none}}
#feedback.ok{color:var(--ok)}
#feedback.no{color:var(--bad)}
#feedback.info{color:var(--muted);font-weight:500;font-size:13.5px}
/* big satisfying "correct" burst */
#burst{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:24;pointer-events:none;
  display:none;flex-direction:column;align-items:center;gap:8px}
#burst.show{display:flex;animation:burstPop .9s cubic-bezier(.2,.9,.3,1.3) forwards}
#burst .bic{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--ok);color:#04160a;box-shadow:0 0 0 10px rgba(63,208,107,.18),0 18px 50px rgba(0,0,0,.5)}
#burst.bad .bic{background:var(--bad);color:#fff;box-shadow:0 0 0 10px rgba(255,90,90,.18),0 18px 50px rgba(0,0,0,.5)}
#burst .bic svg{width:52px;height:52px;stroke-width:3.4}
#burst .btxt{font-size:22px;font-weight:800;color:var(--text);text-shadow:0 2px 14px rgba(0,0,0,.6)}
@keyframes burstPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}45%{transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}

/* ---------- stage: map + study list panel ---------- */
#stage{display:flex;flex:1;min-height:0}
#studypanel{flex:0 0 340px;width:340px;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--border)}
.sp-title{font-size:13.5px;font-weight:700}
.sp-toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.sp-toggle input{accent-color:#fff;width:16px;height:16px;cursor:pointer;margin:0}
#sp-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:9px;display:flex;flex-direction:column;gap:6px}
#sp-list::-webkit-scrollbar{width:10px}
#sp-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid var(--surface)}
#sp-actions{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
#sp-actions .btn{flex:1;justify-content:center}
.sp-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:var(--text);
  background:var(--surface2);border:1px solid transparent;border-radius:11px;padding:10px 12px;cursor:pointer;
  font:inherit;transition:background .14s,border-color .14s,transform .1s}
.sp-item:hover{background:var(--surface3)}
.sp-item:active{transform:scale(.99)}
.sp-item.active{border-color:var(--accent);background:#22262e}
.sp-flag{font-size:22px;line-height:1;width:28px;text-align:center;flex:0 0 auto}
.sp-name{font-size:14.5px;font-weight:700}
.sp-meta{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
#sp-list.hide .sp-name,#sp-list.hide .sp-meta{opacity:0}
#sp-list.hide .sp-item.active .sp-name{opacity:1}
/* place mode: draggable label chips */
.sp-item.chip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.sp-item.chip:active{cursor:grabbing}
.sp-item.chip.dragging{opacity:.35}
.sp-item.chip.shake{animation:shake .34s}
#dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-150%);
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;
  padding:8px 13px;border-radius:11px;box-shadow:var(--shadow);white-space:nowrap;
  display:flex;align-items:center;gap:7px}
#map .dragover{stroke:#fff!important;stroke-width:1.1!important;filter:drop-shadow(0 0 6px rgba(255,255,255,.95))}
/* hint list (revealed clues) */
.sp-hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);
  border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.45;animation:cardIn .25s ease}
.sp-hint .hn{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--surface3);color:var(--muted);
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sp-hint b{color:var(--text);font-weight:700}
.sp-hint.fever{border-color:var(--fever);background:linear-gradient(180deg,rgba(255,90,138,.14),rgba(255,90,138,.05))}
.sp-hint.fever .hn{background:var(--fever);color:#fff}
/* 스무고개 clue-shop buttons */
.clue-buy{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:11px 13px;
  cursor:pointer;font:inherit;color:var(--text);transition:.13s;text-align:left}
.clue-buy:hover{background:var(--surface3);border-color:var(--muted)}
.clue-buy:active{transform:scale(.99)}
.clue-buy .cl-t{font-weight:700;font-size:13.5px}
.clue-buy .cl-c{flex:0 0 auto;font-weight:800;font-size:12px;color:var(--bad);background:var(--bad-dim);
  padding:3px 9px;border-radius:999px}
.sp-potential{font-variant-numeric:tabular-nums;color:var(--target);font-weight:800}
#feverbtn{border-color:rgba(255,90,138,.55)}
#feverbtn .fv{filter:saturate(1.2)}
#micbtn.rec{border-color:var(--bad);background:var(--bad-dim);animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,90,.5)}50%{box-shadow:0 0 0 6px rgba(255,90,90,0)}}
/* rank list rows */
.sp-item .sp-rank{flex:0 0 auto;width:26px;text-align:right;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.sp-item .sp-val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
select#metric{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;padding:7px 11px;border-radius:10px;cursor:pointer;max-width:40vw}
select#metric:focus{outline:none;border-color:var(--border2)}

/* ---------- map ---------- */
#mapwrap{position:relative;flex:1;min-height:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,var(--ocean1),var(--ocean2) 72%,var(--ocean3,#060608) 100%);}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.grabbing{cursor:grabbing}
#map path,#map circle{
  fill:var(--land);stroke:var(--land-stroke);stroke-width:.18;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;transition:fill .28s ease,stroke .2s ease;
}
#map path:hover,#map circle:hover{fill:var(--hover)}
#map circle{stroke-width:.4;fill:#4a4e58}
#map .sset{fill:#797e89;stroke:#9aa0ab}
#map circle.sset{fill:#797e89}
#map .found{fill:var(--found);stroke:#eafff3;stroke-width:.45}
#map circle.found{fill:var(--found)}
/* 1v1: color each captured country by the player who got it right */
#map .found.p1cap{fill:var(--p1)!important;stroke:#dbeaff}
#map .found.p2cap{fill:var(--p2)!important;stroke:#ffe4d3}
#map circle.found.p1cap{fill:var(--p1)!important}
#map circle.found.p2cap{fill:var(--p2)!important}
/* target = a brightly-lit, warm-gold country, not just an outline */
#map .target{fill:var(--target)!important;stroke:#fff8e1;stroke-width:1.3;animation:pulseTarget 1.15s ease-in-out infinite}
#map circle.target{fill:var(--target)!important}
@keyframes pulseTarget{0%,100%{filter:drop-shadow(0 0 2px rgba(255,213,74,.7))}50%{filter:drop-shadow(0 0 12px rgba(255,213,74,1))}}
.pop{transform-box:fill-box;transform-origin:center;animation:popIn .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popIn{0%{transform:scale(.3);opacity:.2;filter:drop-shadow(0 0 12px rgba(255,255,255,.95))}
  55%{transform:scale(1.2);filter:drop-shadow(0 0 10px rgba(255,255,255,.9))}100%{transform:scale(1);filter:none}}
#map .wrong{stroke:#fff!important;stroke-width:1!important;animation:wrongPulse .5s}
@keyframes wrongPulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}}
#map text.clabel{fill:#0b0b0d;paint-order:stroke;stroke:rgba(255,255,255,.92);
  font-weight:700;pointer-events:none;dominant-baseline:middle;font-family:inherit;letter-spacing:-.04em}
#map text.clabel.cur{fill:#000;stroke:#fff}

#tooltip{
  position:absolute;pointer-events:none;background:rgba(10,11,14,.96);border:1px solid var(--border2);
  color:var(--text);padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600;
  transform:translate(-50%,-145%);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:8}
#mapctrl{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:6}
#mapctrl .btn{width:38px;height:38px;padding:0;border-radius:10px;background:rgba(20,21,25,.86);backdrop-filter:blur(6px)}
#mapctrl .btn .ic{width:18px;height:18px}
#legend{
  position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:13px;flex-wrap:wrap;
  background:rgba(20,21,25,.86);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:10px;
  padding:7px 12px;font-size:11.5px;color:var(--muted);z-index:6}
#legend .sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
#legend .sw.tgt{background:transparent;border:2px solid var(--target);width:10px;height:10px}

footer{
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted);text-align:center;
  border-top:1px solid var(--border);background:var(--surface)}
footer kbd{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:10.5px;font-family:ui-monospace,monospace}

/* ---------- result overlay ---------- */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
  background:rgba(6,6,8,.72);backdrop-filter:blur(4px);animation:fade .25s ease}
#overlay.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:26px 30px;
  text-align:center;max-width:min(420px,92vw);box-shadow:var(--shadow);animation:cardPop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardPop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.card h2{font-size:17px;margin-bottom:3px;font-weight:700}
.card .big{font-size:42px;font-weight:800;margin:10px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card p{color:var(--muted);font-size:13px;margin-bottom:16px}
/* end-screen extras: tier bar + miss list */
#ov-extra{text-align:left}
#ov-extra:empty{display:none}
.ov-tier{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:12px}
.ov-tier-h{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.tb-segs{display:flex;gap:3px;margin-bottom:7px}
.tb-seg{flex:1;text-align:center;font-size:10px;font-weight:800;color:var(--faint);background:var(--surface3);border-radius:4px;padding:3px 0;border:1px solid transparent}
.tb-seg.on{color:var(--accent-ink);background:var(--target);border-color:var(--target)}
.tb-seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.tb-bar{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden}
.tb-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--target));border-radius:99px}
.tb-lab{font-size:12px;color:var(--muted);margin-top:6px}
.ov-misses{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:4px}
.ov-misses-h{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.ov-miss-wrap{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow-y:auto}
.ov-miss{font-size:12.5px;font-weight:600;background:var(--surface3);border:1px solid var(--border2);border-radius:99px;padding:3px 9px}
/* tier / rank cutscene */
#cutscene{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 42%, rgba(34,22,54,.88), rgba(6,6,10,.96))}
#cutscene.show{display:flex;animation:fade .3s ease}
.cs-rays{position:absolute;width:170vmax;height:170vmax;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.10) 0 8deg,transparent 8deg 16deg);animation:csSpin 9s linear infinite}
@keyframes csSpin{to{transform:rotate(360deg)}}
.cs-core{position:relative;text-align:center;padding:0 20px;animation:csPop .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes csPop{from{opacity:0;transform:scale(.55) translateY(18px)}to{opacity:1;transform:none}}
.cs-badge{font-size:92px;line-height:1;filter:drop-shadow(0 6px 22px rgba(255,200,80,.5));animation:csBadge 1s ease}
@keyframes csBadge{0%{transform:scale(.2) rotate(-22deg);opacity:0}55%{transform:scale(1.16) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.cs-medal{display:flex;align-items:center;justify-content:center;width:118px;height:118px;border-radius:50%;margin:0 auto;font-size:50px;font-weight:900;
  color:#3a2a06;background:radial-gradient(circle at 40% 34%,#ffe89a,#f5c542 60%,#b8860b);border:4px solid #fff3c4;box-shadow:0 8px 30px rgba(245,197,66,.5)}
.cs-head{margin-top:12px;font-size:14px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--target);text-indent:.34em}
.cs-name{font-size:29px;font-weight:900;color:#fff;margin-top:4px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.cs-note{font-size:13.5px;color:rgba(255,255,255,.82);margin-top:6px}
.cs-conf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:csFall linear forwards}
@keyframes csFall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(560deg)}}
.card .btn{padding:11px 24px;font-size:14px}
#durrow{display:flex;gap:5px;flex-wrap:wrap}
#durrow button{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;
  padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer;transition:all .14s}
#durrow button:hover{color:var(--text)}
#durrow button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* ---------- bigger flags in study list ---------- */
#studypanel.study .sp-flag{font-size:30px;width:40px}
#studypanel.study .sp-item{padding:11px 13px;gap:13px}
#studypanel.study .sp-name{font-size:15.5px}

/* ---------- home screen (modern app-launcher grid) ---------- */
#home{position:fixed;inset:0;z-index:40;overflow-y:auto;display:none;
  background:radial-gradient(130% 90% at 50% -20%,var(--home-grad1,#181b22) 0%,var(--home-grad2,#101216) 42%,var(--bg) 100%)}
#home.show{display:block}
.home-inner{position:relative;max-width:1120px;margin:0 auto;padding:40px 24px calc(56px + env(safe-area-inset-bottom))}
.home-title{display:flex;align-items:center;gap:12px;font-size:clamp(26px,4.4vw,34px);font-weight:800;letter-spacing:-.03em}
.home-title .ic{width:clamp(28px,5vw,36px);height:clamp(28px,5vw,36px);color:var(--muted)}
.home-sub{color:var(--muted);font-size:15px;margin:8px 0 30px}
.home-sec{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--muted);
  letter-spacing:.02em;margin:30px 2px 14px}
.home-sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border) 0%,transparent 100%)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.gcard{display:flex;align-items:center;gap:15px;text-align:left;padding:17px 18px;border-radius:16px;
  background:linear-gradient(180deg,var(--surface) 0%,var(--card-grad,#111318) 100%);border:1px solid var(--border);
  cursor:pointer;color:var(--text);font:inherit;position:relative;overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.8,.3,1.2),border-color .16s,box-shadow .2s}
.gcard::before{content:"";position:absolute;inset:0;border-radius:16px;padding:1px;pointer-events:none;opacity:0;
  background:linear-gradient(140deg,var(--gc,#4ea1ff),transparent 55%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:opacity .2s}
.gcard:hover{transform:translateY(-3px);border-color:transparent;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.gcard:hover::before{opacity:.9}
.gcard:active{transform:translateY(-1px)}
/* ranked banner + hub */
.rank-banner{display:flex;align-items:center;gap:15px;width:100%;margin:0 0 24px;padding:16px 20px;border-radius:16px;cursor:pointer;
  background:linear-gradient(120deg,color-mix(in srgb,#ff8a4c 22%,var(--surface)),var(--surface));border:1px solid var(--border2);color:var(--text);font:inherit;text-align:left;transition:.15s}
.rank-banner:hover{transform:translateY(-2px);border-color:#ff8a4c;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.rank-banner .rb-ic{font-size:32px;flex:0 0 auto}
.rank-banner .rb-main{flex:1;min-width:0}
.rank-banner .rb-t{font-size:17px;font-weight:800}
.rank-banner .rb-s{font-size:13px;color:var(--muted);margin-top:2px}
.rank-banner .rb-go{flex:0 0 auto;font-weight:800;color:#ff8a4c}
#rankhub{position:fixed;inset:0;z-index:42;overflow-y:auto;display:none;background:radial-gradient(130% 90% at 50% -20%,var(--home-grad1,#181b22) 0,var(--bg) 60%)}
#rankhub.show{display:block}
.rh-inner{max-width:820px;margin:0 auto;padding:30px 22px calc(50px + env(safe-area-inset-bottom))}
.rh-back{margin-bottom:16px}
.rh-hero{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:20px 22px;margin-bottom:6px}
.rh-badge{font-size:52px;line-height:1}
.rh-hero h2{font-size:25px;font-weight:800}
.rh-elo{color:var(--muted);font-weight:700;font-size:14px;margin-top:3px}
.rh-bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:10px;max-width:340px}
.rh-bar i{display:block;height:100%;background:#ff8a4c}
.rh-sec{margin:20px 0 9px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rh-row{display:flex;flex-wrap:wrap;gap:8px}
.rh-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:999px;padding:9px 15px;font:inherit;font-weight:700;font-size:13.5px;color:var(--text);cursor:pointer;transition:.13s}
.rh-chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rh-chip.lock{opacity:.45;cursor:not-allowed}
.rh-play{width:100%;margin-top:18px;justify-content:center;font-size:16px;padding:14px}
.rh-note{color:var(--faint);font-size:12px;margin-top:16px;line-height:1.6}
.rh-shiny{display:flex;flex-wrap:wrap;gap:5px;max-height:130px;overflow-y:auto;margin-top:4px}
.rh-shiny span{font-size:23px}
.rh-theme{font-size:21px;line-height:1;background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:6px 9px;cursor:pointer;transition:.13s}
.rh-theme.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--surface2))}
.rh-theme:hover{border-color:var(--accent)}
.gicon{flex:0 0 auto;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--gc,#4ea1ff) 16%,transparent);color:var(--gc,#4ea1ff);
  border:1px solid color-mix(in srgb,var(--gc,#4ea1ff) 30%,transparent);transition:transform .16s}
.gicon .ic{width:25px;height:25px}
.gcard:hover .gicon{transform:scale(1.07)}
.gtext{min-width:0;display:block}
.gcard .ctitle{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.gcard .cdesc{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
@media(max-width:540px){ .home-grid{grid-template-columns:1fr;gap:11px} .gcard{padding:15px 16px} }
#homebtn .ic{width:16px;height:16px}
/* fallback where color-mix isn't supported */
@supports not (background:color-mix(in srgb,#000,#fff)){ .gicon{background:var(--surface3);border-color:var(--border2)} }

/* home top bar (profile + language) */
.home-title{margin:0}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
.home-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);font:inherit;font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.14s}
.home-chip:hover{background:var(--surface3);border-color:var(--muted)}
.home-chip.on{background:color-mix(in srgb,var(--found) 22%,var(--surface2));border-color:var(--found)}
.home-chip .ic{width:16px;height:16px}
/* profile / stats card */
#profilecard{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:16px 18px;margin:4px 0 10px}
.pc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pc-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.pc-name{font-size:18px;font-weight:800}
.pc-sub{color:var(--muted);font-size:12.5px}
.pc-logout{margin-left:auto}
.pc-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}
.pc-stat{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;min-width:76px}
.pc-stat .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.pc-stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.pc-lv{margin-top:15px}
.pc-lvhead{font-size:13px;font-weight:700;color:var(--muted)}
.pc-lvhead b{color:var(--text);font-size:15px}
.pc-lvbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.pc-lvbar i{display:block;height:100%;background:var(--found)}
.pc-sec{margin-top:15px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pc-tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pc-tier{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
.pc-tier b{color:var(--target)}
.pc-tier.max{border-color:var(--target);background:color-mix(in srgb,var(--target) 15%,var(--surface2))}
.pc-ach{margin-top:15px}
.pc-ach-h{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.pc-ach-grid{display:flex;flex-wrap:wrap;gap:7px}
.ach-badge{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:21px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:default}
.ach-badge.off{filter:grayscale(1);opacity:.32}
.pc-actions{margin-top:15px}
.pc-share{width:100%;justify-content:center;font-weight:700}
.share-img{display:block;width:100%;max-width:340px;margin:6px auto 12px;border-radius:14px;border:1px solid var(--border2)}
/* auth modal */
#auth,#settings,#admin{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(6,6,8,.74);backdrop-filter:blur(5px)}
#auth.show,#settings.show,#admin.show{display:flex;animation:fade .2s ease}
.adm-block{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.adm-h{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.adm-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.adm-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:7px 11px;font:inherit;font-weight:700;font-size:12.5px;color:var(--text);cursor:pointer}
.adm-btn:hover{border-color:var(--accent);color:var(--accent)}
.adm-btn.danger:hover{border-color:#ff5a5a;color:#ff7a7a}
.adm-in{width:74px;background:var(--surface3);border:1px solid var(--border2);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;color:var(--text)}
.adm-sel{background:var(--surface3);border:1px solid var(--border2);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;color:var(--text)}
.adm-note{font-size:11.5px;color:var(--muted);margin-top:2px}
.adm-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:2px 6px;vertical-align:2px}
.set-card{width:min(440px,94vw);max-height:88vh;overflow-y:auto}
.set-block{margin-top:16px}
.set-h{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.set-seg{display:flex;gap:6px;background:var(--surface2);border-radius:12px;padding:4px}
.set-seg.wrap{flex-wrap:wrap;background:none;padding:0}
.set-chip{flex:1;background:none;border:1px solid transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13.5px;
  padding:9px 10px;border-radius:9px;cursor:pointer;transition:.13s;white-space:nowrap}
.set-seg.wrap .set-chip{flex:0 0 auto;background:var(--surface2);border:1px solid var(--border2)}
.set-chip:hover{color:var(--text)}
.set-chip.on{background:var(--accent);color:var(--accent-ink)}
.set-seg.wrap .set-chip.on{background:color-mix(in srgb,var(--found) 22%,var(--surface2));border-color:var(--found);color:var(--text)}
.set-seg.wrap .set-chip.off{opacity:.5;text-decoration:line-through}
.set-seg.wrap .set-chip.lock{opacity:.5;cursor:not-allowed;letter-spacing:.02em}
.set-desc{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.auth-card{position:relative;background:var(--surface);border:1px solid var(--border2);border-radius:18px;
  padding:26px 26px 20px;width:min(400px,94vw);box-shadow:var(--shadow);animation:cardPop .3s cubic-bezier(.2,.9,.3,1.2)}
.auth-x{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;
  width:34px;height:34px;border-radius:9px;line-height:1}
.auth-x:hover{background:var(--surface2);color:var(--text)}
.auth-title{font-size:20px;font-weight:800;margin-bottom:2px}
.auth-tabs{display:flex;gap:6px;background:var(--surface2);border-radius:12px;padding:4px;margin:15px 0 16px}
.auth-tab{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:9px;border-radius:9px;cursor:pointer}
.auth-tab.on{background:var(--accent);color:var(--accent-ink)}
.auth-field{display:block;margin-bottom:12px}
.auth-verify{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.auth-verify .auth-field{flex:1;margin-bottom:0}
.auth-verify .auth-mini{white-space:nowrap}
.auth-field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.auth-field input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font:inherit;font-size:15px;padding:11px 13px;border-radius:11px}
.auth-field input:focus{outline:none;border-color:var(--accent)}
.auth-msg{font-size:13px;min-height:18px;margin:2px 0 10px;font-weight:700}
.auth-msg.err{color:var(--bad)} .auth-msg.ok{color:var(--ok)}
.auth-submit{width:100%;padding:12px;font-size:15px}
.auth-note{color:var(--faint);font-size:11.5px;margin-top:13px;text-align:center;line-height:1.5}
.auth-users{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 10px;font-size:11.5px;color:var(--muted)}
.auth-userchip{background:var(--surface2);border:1px solid var(--border2);border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;font-weight:700;color:var(--text);cursor:pointer}
.auth-userchip:hover{border-color:var(--accent)}
.auth-sub2{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 12px;text-align:center}
.auth-xfer{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.auth-mini{flex:1;min-width:120px;padding:10px 12px;font-size:13px;justify-content:center}
.auth-link{background:none;border:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:12px;width:100%;text-align:center;padding:6px}
.auth-link:hover{color:var(--text)}
.auth-code{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:11px 12px;border-radius:11px;resize:vertical;word-break:break-all}
.auth-code:focus{outline:none;border-color:var(--accent)}
.auth-signedin{text-align:center}
.auth-signedin .pc-avatar{margin:4px auto 10px;width:56px;height:56px;font-size:24px}
/* keyboard focus visibility */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.gcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- pre-game setup screen ---------- */
#setup{position:fixed;inset:0;z-index:41;display:none;align-items:center;justify-content:center;padding:20px;
  overflow-y:auto;background:radial-gradient(120% 80% at 50% -10%,#16181d,var(--bg) 70%)}
#setup.show{display:flex}
.setup-card{width:min(560px,100%);background:var(--surface);border:1px solid var(--border2);border-radius:20px;
  padding:22px 24px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);position:relative;
  animation:cardPop .3s cubic-bezier(.2,.9,.3,1.2);max-height:92vh;overflow-y:auto}
.setup-back{position:absolute;top:16px;right:16px}
.setup-hd{display:flex;align-items:center;gap:14px;margin:2px 0 18px}
.setup-ic{flex:0 0 auto;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--gc,#4ea1ff) 16%,transparent);color:var(--gc,#4ea1ff);
  border:1px solid color-mix(in srgb,var(--gc,#4ea1ff) 30%,transparent)}
.setup-ic .ic{width:30px;height:30px}
@supports not (background:color-mix(in srgb,#000,#fff)){ .setup-ic{background:var(--surface3);border-color:var(--border2)} }
.setup-ic svg{width:100%;height:100%;display:block}
.setup-title{font-size:21px;font-weight:800;letter-spacing:-.01em}
.setup-desc{font-size:13px;color:var(--muted);margin-top:3px;max-width:380px}
.su-row{margin:14px 0}
.su-label{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.su-row select{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  font:inherit;font-size:15px;padding:11px 12px;border-radius:11px;cursor:pointer}
.su-row select:focus{outline:none;border-color:#666d7a}
.su-chips{display:flex;flex-wrap:wrap;gap:8px}
.su-chip{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:10px;
  padding:9px 14px;font:inherit;font-size:13.5px;cursor:pointer;transition:all .14s}
.su-chip:hover{color:var(--text)}
.su-chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.setup-start{width:100%;padding:14px;font-size:16px;margin-top:20px;border-radius:13px}

/* ---------- war trivia (kahoot-style) ---------- */
#trivia{position:absolute;inset:0;z-index:7;background:var(--bg);display:none;flex-direction:column;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));align-items:center;justify-content:center;gap:16px}
#trivia.show{display:flex}
.tv-head{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:700}
.tv-bar{width:min(680px,92vw);height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.tv-bar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.tv-q{max-width:760px;text-align:center;font-size:clamp(19px,3.4vw,26px);font-weight:800;letter-spacing:-.01em;line-height:1.4}
.tv-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(760px,94vw)}
.tv-opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:18px 18px;cursor:pointer;font:inherit;font-size:16px;font-weight:700;color:var(--text);
  text-align:left;transition:background .14s,border-color .14s,transform .1s}
.tv-opt:hover{background:var(--surface2)}
.tv-opt:active{transform:scale(.99)}
.tv-opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--surface3);color:var(--muted);
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tv-opt.correct{border-color:var(--ok);background:var(--ok-dim);box-shadow:0 0 0 2px var(--ok) inset,0 0 18px rgba(63,208,107,.35)}
.tv-opt.correct .k{background:var(--ok);color:#04160a}
.tv-opt.wrong{border-color:var(--bad);background:var(--bad-dim);box-shadow:0 0 0 2px var(--bad) inset}
.tv-opt.wrong .k{background:var(--bad);color:#fff}
.tv-opts.locked .tv-opt{cursor:default}
.tv-opt kbd{margin-left:auto;font:11px ui-monospace,monospace;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.tv-fact{max-width:680px;text-align:center;color:var(--muted);font-size:13.5px;min-height:20px}
select#warsel{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;padding:7px 11px;border-radius:10px;cursor:pointer;max-width:52vw}
select#warsel:focus{outline:none;border-color:var(--border2)}
@media(max-width:560px){ .tv-opts{grid-template-columns:1fr} }

/* ---- compare (bigger?) game ---- */
#compare{position:absolute;inset:0;z-index:7;background:var(--bg);display:none;flex-direction:column;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));align-items:center;justify-content:center;gap:18px}
#compare.show{display:flex}
.cmp-q{text-align:center;font-size:clamp(17px,3vw,23px);font-weight:800;letter-spacing:-.01em}
.cmp-q b{color:var(--target)}
.cmp-cards{display:flex;align-items:center;gap:16px;width:min(760px,96vw)}
.cmp-card{flex:1;min-width:0;background:var(--surface);border:2px solid var(--border2);border-radius:18px;
  padding:24px 14px;cursor:pointer;font:inherit;color:var(--text);text-align:center;transition:transform .1s,border-color .14s,background .14s}
.cmp-card:hover{background:var(--surface2);border-color:var(--muted)}
.cmp-card:active{transform:scale(.98)}
.cmp-card .cf{font-size:clamp(40px,9vw,64px);line-height:1;margin-bottom:8px}
.cmp-card .cn{font-size:clamp(16px,2.6vw,21px);font-weight:800}
.cmp-card .cval{margin-top:8px;font-size:14px;color:var(--muted);min-height:18px;font-weight:700}
.cmp-card.win{border-color:var(--ok);background:var(--ok-dim);box-shadow:0 0 0 2px var(--ok) inset,0 0 20px rgba(63,208,107,.32)}
.cmp-card.lose{border-color:var(--bad);background:var(--bad-dim)}
.cmp-card.win .cval{color:var(--ok)} .cmp-card.lose .cval{color:var(--bad)}
.cmp-vs{flex:0 0 auto;font-weight:900;color:var(--faint);font-size:16px}
.cmp-fact{text-align:center;color:var(--muted);font-size:14px;min-height:20px;font-weight:700}
@media(max-width:520px){ .cmp-cards{gap:8px} .cmp-card{padding:18px 8px} }

/* ---- shared mini-game panel (odd-one-out / ladder / estimate) ---- */
#minigame{position:absolute;inset:0;z-index:7;background:var(--bg);display:none;flex-direction:column;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));align-items:center;justify-content:center;gap:18px}
#minigame.show{display:flex}
.mg-q{text-align:center;font-size:clamp(17px,3vw,23px);font-weight:800;letter-spacing:-.01em;max-width:760px;line-height:1.4}
.mg-q b{color:var(--target)}
.mg-body{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(760px,96vw)}
.mg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.mg-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--border2);
  border-radius:16px;padding:20px 12px;cursor:pointer;font:inherit;color:var(--text);transition:background .14s,border-color .14s,transform .1s}
.mg-card:hover{background:var(--surface2);border-color:var(--muted)}
.mg-card:active{transform:scale(.98)}
.mg-card .mf{font-size:clamp(34px,7vw,52px);line-height:1}
.mg-card .mn{font-size:clamp(15px,2.4vw,19px);font-weight:800;text-align:center}
.mg-card .mv{font-size:13px;color:var(--muted);font-weight:700;min-height:16px}
.mg-card.win{border-color:var(--ok);background:var(--ok-dim);box-shadow:0 0 0 2px var(--ok) inset}
.mg-card.lose{border-color:var(--bad);background:var(--bad-dim)}
.mg-card.dim{opacity:.5}
.mg-ladder{display:flex;align-items:stretch;gap:14px;width:100%;justify-content:center}
.mg-ladder .mg-card{flex:1;min-width:0;max-width:300px;cursor:default}
/* ladder cards are display-only — the ▲/▼ buttons are the controls */
.mg-ladder .mg-card:hover{background:var(--surface);border-color:var(--border2)}
.mg-ladder .mg-card.win:hover{border-color:var(--ok);background:var(--ok-dim)}
.mg-ladder .mg-card.lose:hover{border-color:var(--bad);background:var(--bad-dim)}
.mg-ladder .mg-card:active{transform:none}
.mg-tag{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mg-card.nxt .mg-tag{color:var(--target)}
.mg-rel{font-weight:900} .mg-rel.up{color:var(--ok)} .mg-rel.down{color:var(--bad)}
.mg-arrow{display:flex;align-items:center;font-weight:900;color:var(--faint);font-size:15px}
.mg-btns{display:flex;gap:12px;width:100%;max-width:420px}
.mg-btns button{flex:1;background:var(--surface);border:2px solid var(--border2);border-radius:14px;padding:16px 10px;
  cursor:pointer;font:inherit;font-size:16px;font-weight:800;color:var(--text);transition:.12s}
.mg-btns button:hover{background:var(--surface2);border-color:var(--muted)}
.mg-btns button:active{transform:scale(.98)}
.mg-est{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;align-items:stretch}
.mg-est input{background:var(--surface2);border:2px solid var(--border2);border-radius:12px;padding:14px 14px;
  font:inherit;font-size:20px;font-weight:800;color:var(--text);text-align:center;width:100%}
.mg-est input:focus{outline:none;border-color:var(--accent)}
.mg-est .mg-sub{color:var(--muted);font-size:13px;text-align:center;font-weight:700}
.mg-fact{text-align:center;color:var(--muted);font-size:14px;min-height:20px;font-weight:700;max-width:680px}
.mg-fact b{color:var(--target)}
@media(max-width:520px){ .mg-grid{gap:8px} .mg-ladder{gap:8px} }

/* ---- Country Codex (browsable reference) ---- */
#codex{position:absolute;inset:0;z-index:7;background:var(--bg);display:none;flex-direction:column;
  padding:16px 18px calc(16px + env(safe-area-inset-bottom));gap:12px}
#codex.show{display:flex}
.cx-top{display:flex;align-items:center;gap:12px;flex:0 0 auto;max-width:1000px;width:100%;margin:0 auto}
#cx-search{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;
  font:inherit;font-size:15px;color:var(--text);padding:11px 14px}
#cx-search:focus{outline:none;border-color:var(--accent)}
.cx-count{color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
.cx-grid{flex:1;min-height:0;overflow-y:auto;display:grid;gap:10px;max-width:1000px;width:100%;margin:0 auto;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));align-content:start;padding-bottom:8px}
.cx-item{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:12px 13px;cursor:pointer;text-align:left;color:var(--text);font:inherit;transition:.13s}
.cx-item:hover{background:var(--surface2);border-color:var(--border2);transform:translateY(-1px)}
.cx-item .cxf{font-size:30px;line-height:1;flex:0 0 auto}
.cx-item .cxn{min-width:0}
.cx-item .cxn b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-item .cxn span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-detail{flex:1;min-height:0;overflow-y:auto;max-width:760px;width:100%;margin:0 auto}
.cx-detail[hidden]{display:none}
.cxd-back{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;margin-bottom:14px}
.cxd-hd{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.cxd-hd .cxd-flag{font-size:56px;line-height:1}
.cxd-hd h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.cxd-hd .cxd-sub{color:var(--muted);font-size:14px;font-weight:700;margin-top:2px}
.cxd-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.cxd-fact{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
.cxd-fact .k{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cxd-fact .v{font-size:15px;font-weight:800;margin-top:3px}
.cxd-note{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--target);
  border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.55}
.cxd-note .k{display:block;color:var(--target);font-size:12px;font-weight:800;margin-bottom:4px}
@media(max-width:520px){ .cx-grid{grid-template-columns:1fr 1fr;gap:8px} .cxd-facts{grid-template-columns:1fr} .cx-item .cxf{font-size:26px} }

/* ---- Falling Flags ---- */
#fall{position:absolute;inset:0;z-index:7;background:radial-gradient(120% 80% at 50% 0,var(--surface),var(--bg) 70%);display:none;overflow:hidden}
#fall.show{display:block}
#fall-area{position:absolute;inset:0}
.fall-item{position:absolute;top:0;left:0;font-size:44px;line-height:1;will-change:transform;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));cursor:default;user-select:none}
.fall-item.pop{animation:fallPop .3s ease forwards}
@keyframes fallPop{to{transform:scale(1.6);opacity:0}}
#fall-hud{position:absolute;top:12px;left:14px;font-weight:800;font-size:15px;color:var(--text);z-index:3;display:flex;gap:14px}
#fall-hud .lives{color:var(--bad)}
.fall-line{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,var(--bad),transparent);opacity:.55;z-index:2}
.fall-flash{animation:fallFlash .4s ease}
@keyframes fallFlash{0%{background:var(--bad-dim)}100%{background:transparent}}

/* ---- Flag Symbol Picker ---- */
#sym{position:absolute;inset:0;z-index:7;background:var(--bg);display:none;flex-direction:column;padding:16px 18px calc(16px + env(safe-area-inset-bottom));gap:12px}
#sym.show{display:flex}
.sym-top{display:flex;align-items:center;gap:12px;max-width:900px;width:100%;margin:0 auto;flex:0 0 auto}
.sym-q{flex:1;font-size:clamp(16px,3vw,21px);font-weight:800;letter-spacing:-.01em}
.sym-q b{color:var(--target)}
.sym-grid{flex:1;min-height:0;overflow-y:auto;display:grid;gap:8px;max-width:900px;width:100%;margin:0 auto;
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));align-content:start;padding-bottom:6px}
.sym-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface);border:2px solid var(--border2);
  border-radius:12px;padding:12px 6px 8px;cursor:pointer;font:inherit;color:var(--text);transition:.12s}
.sym-cell:hover{background:var(--surface2)}
.sym-cell .sf{font-size:34px;line-height:1}
.sym-cell .sn{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sym-cell.sel{border-color:var(--found);background:color-mix(in srgb,var(--found) 16%,var(--surface))}
.sym-cell.sel::after{content:"✓";position:absolute;top:3px;right:6px;color:var(--found);font-weight:900;font-size:13px}
.sym-cell.right{border-color:var(--ok);background:var(--ok-dim)}
.sym-cell.wrong{border-color:var(--bad);background:var(--bad-dim)}
.sym-cell.missed{border-color:var(--target);background:color-mix(in srgb,var(--target) 14%,var(--surface))}
.sym-fact{text-align:center;color:var(--muted);font-size:14px;min-height:20px;font-weight:700;max-width:760px;margin:0 auto}
.sym-fact b{color:var(--target)}
@media(max-width:520px){ .sym-grid{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))} .sym-cell .sf{font-size:28px} }

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- mobile ---------- */
@media(max-width:720px){
  .bar{padding:6px 10px;gap:7px}
  /* compact one-row header: home · mode title · language (brand text is redundant in-game) */
  .bar-top{flex-wrap:nowrap}
  .brand{display:none}
  .modetitle:before{display:none}
  .modetitle{font-size:15px;color:var(--text);margin-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #homebtn{flex:0 0 auto}
  .bar-tools{flex-wrap:wrap}
  .chip{flex:1;justify-content:center;padding:6px 10px}
  .tools-right{width:100%;margin-left:0;gap:7px}
  .tools-right .btn{flex:1}
  select#region{max-width:none;flex:1}
  #legend{display:none}
  #q{font-size:16px;padding:11px 13px}
  #promptbar{padding:8px 14px 2px}
  #promptbar .flag{font-size:30px}
  #vsbar{padding:6px 10px 2px}
  #mapctrl .btn{width:42px;height:42px}
  footer{display:none}
  #stage{flex-direction:column}
  /* when a side panel is showing, split the stage so its list scrolls and all hints are visible;
     when it's hidden (quiz/find/trivia/compare…), the map fills the whole stage */
  #mapwrap{flex:1 1 40%;min-height:0}
  #studypanel{flex:1 1 46%;width:auto;border-left:none;border-top:1px solid var(--border);min-height:0}
  #trivia,#compare{overflow-y:auto;justify-content:flex-start;padding-top:24px;gap:14px}
  .sp-flag{font-size:20px;width:26px}
  .sp-name{font-size:14px}
}
@media(max-width:430px){
  #inputrow .btn span.t{display:none}
  .tools-right .btn span.t{display:none}
  .step{min-width:46px}
  .modetitle{font-size:14px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="bar bar-top">
      <button class="btn hidden" id="homebtn" data-icon="home"><span class="t">홈</span></button>
      <div class="brand" id="brand"><span data-icon="brand"></span> 지오라마</div>
      <span class="modetitle" id="modetitle"></span>
      <button class="btn" id="themebtn" title="테마 / Theme" aria-label="테마 바꾸기" style="margin-left:auto"><span class="ti">🌙</span></button>
      <button class="btn" id="cbbtn" title="색약 모드 / Colorblind-safe" aria-label="색약 친화 색상 켜기/끄기">🎨</button>
      <button class="btn" id="setbtn" title="설정 / Settings" aria-label="설정" data-icon="gear"></button>
      <button class="btn" id="langbtn" title="Language / 언어">EN</button>
    </div>
    <div class="bar bar-tools">
      <div class="chip" id="timer"><span class="lbl">시간</span><span class="val" id="timerval">0:00</span></div>
      <div class="chip" id="scorechip"><span class="lbl" id="scorelbl">찾은 나라</span><span class="val" id="scoreval">0</span></div>
      <div class="tools-right">
        <select id="warsel" class="hidden" title="전쟁 선택"></select>
        <select id="metric" class="hidden" title="지표 선택"></select>
        <button class="btn hidden" id="orderbtn" data-icon="sort"><span class="t">내림차순</span></button>
        <select id="region" class="hidden" title="지역 선택"></select>
        <div id="durrow" class="hidden"></div>
        <button class="btn" id="regquiz" data-icon="search"><span class="t">이 지역 시험</span></button>
        <button class="btn" id="reset" data-icon="reset"><span class="t">초기화</span></button>
      </div>
    </div>
  </header>

  <div id="vsbar" class="hidden" aria-live="polite"></div>
  <div id="promptbar" aria-live="polite"></div>

  <div id="inputrow">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="나라 이름이나 약자 입력…  (예: 대한민국, 미국, JP)">
    <button class="btn" id="go" data-icon="check"><span class="t">확인</span></button>
    <button class="btn hidden" id="micbtn" title="음성으로 답하기"><span class="mic">🎤</span></button>
    <button class="btn hidden" id="skip" data-icon="skip"><span class="t">넘기기</span></button>
    <button class="btn hidden step" id="prev" data-icon="prev"><span class="t">이전</span></button>
    <button class="btn hidden step" id="shuffle" data-icon="shuffle"><span class="t">섞기</span></button>
    <button class="btn hidden step" id="next" data-icon="next"><span class="t">다음</span></button>
  </div>
  <div id="feedback" aria-live="polite"></div>

  <div id="stage">
    <div id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="tooltip"></div>
      <div id="legend">
        <span><span class="sw" style="background:var(--land)"></span>기본</span>
        <span><span class="sw" style="background:var(--found)"></span>찾음</span>
        <span><span class="sw tgt"></span>문제</span>
      </div>
      <div id="mapctrl">
        <button class="btn" id="zin" data-icon="plus" title="확대" aria-label="확대"></button>
        <button class="btn" id="zout" data-icon="minus" title="축소" aria-label="축소"></button>
        <button class="btn" id="zfit" data-icon="fit" title="전체 보기" aria-label="전체 보기"></button>
      </div>
      <div id="trivia">
        <div class="tv-head"><span id="tv-war"></span><span id="tv-prog"></span></div>
        <div class="tv-bar"><i id="tv-barfill"></i></div>
        <div class="tv-q" id="tv-q"></div>

en":"In the northeastern Catalonia region, a movement for independence continues."}},"PT":{"hist":{"ko":"이 나라의 항해자들은 대항해시대를 열어 인도로 가는 바닷길을 처음으로 개척했어요.","en":"This country's navigators launched the Age of Discovery, pioneering the sea route to India."}},"NL":{"hist":{"ko":"이 나라는 국토의 상당 부분이 해수면보다 낮아 제방과 풍차로 바다를 막고 땅을 넓혀 왔어요.","en":"Much of this country lies below sea level, reclaimed from the sea with dikes and windmills."}},"BE":{"hist":{"ko":"이 나라에는 유럽연합의 주요 기관들이 자리하며, 과거 아프리카의 콩고를 식민 지배했어요.","en":"This country hosts the main institutions of the European Union and once colonized the Congo in Africa."}},"CH":{"hist":{"ko":"이 나라는 오랜 영세중립을 지켜온 알프스의 나라로, 국제 적십자가 이곳에서 창설되었어요.","en":"A long-neutral Alpine country, this is where the International Red Cross was founded."}},"AT":{"hist":{"ko":"이 나라는 유럽을 호령한 합스부르크 왕가의 중심이었고, 작곡가 모차르트의 고향이에요.","en":"This country was the heart of the Europe-spanning Habsburg dynasty and the homeland of the composer Mozart."}},"PL":{"hist":{"ko":"이 나라는 18세기에 이웃 강대국들에 의해 여러 차례 분할되었고, 제2차 세계대전이 이 나라에 대한 침공으로 시작되었어요.","en":"Partitioned repeatedly by neighboring powers in the 18th century, this country was where World War II began with an invasion in 1939."}},"CZ":{"hist":{"ko":"이 나라는 1989년 '벨벳 혁명'으로 공산 정권을 무너뜨렸고, 1993년 이웃 나라와 평화롭게 갈라섰어요.","en":"This country toppled its communist regime in the 1989 Velvet Revolution and peacefully split from its neighbor in 1993."}},"SK":{"hist":{"ko":"이 나라는 1993년 이웃 나라와 평화롭게 분리되어 독립한 중부 유럽의 내륙국이에요.","en":"This landlocked Central European country became independent in 1993 through a peaceful split from its neighbor."}},"HU":{"hist":{"ko":"이 나라는 1956년 소련의 지배에 맞서 봉기를 일으켰고, 제1차 세계대전 후 영토의 3분의 2를 잃었어요.","en":"This country rose up against Soviet control in 1956 and had lost two-thirds of its territory after World War I."}},"RO":{"hist":{"ko":"이 나라는 1989년 유혈 혁명으로 독재자 차우셰스쿠 정권이 무너졌으며, 트란실바니아 지방이 유명해요.","en":"A bloody 1989 revolution overthrew the dictator Ceaușescu in this country, home to the Transylvania region."}},"BG":{"hist":{"ko":"이 나라는 약 500년간 오스만 제국의 지배를 받다가 1878년에 해방되었어요.","en":"This country was freed in 1878 after nearly five centuries under Ottoman rule."}},"GR":{"hist":{"ko":"이 나라는 서양 문명과 민주주의의 발상지로 여겨지며, 1821년 오스만 제국에 맞서 독립 전쟁을 일으켰어요.","en":"Seen as the birthplace of Western civilization and democracy, this country launched a war of independence against the Ottomans in 1821."},"dispute":{"ko":"이 나라는 에게해의 여러 섬과 영해·영공을 두고 이웃 나라와 오랜 긴장을 겪어 왔어요.","en":"It has long-standing tensions with a neighbor over islands and maritime boundaries in the Aegean Sea."}},"SE":{"hist":{"ko":"이 나라는 바이킹의 본거지 중 하나였으며, 200년 넘게 전쟁에 참여하지 않은 중립 전통으로 유명해요.","en":"One of the old Viking homelands, this country is known for a tradition of neutrality unbroken for over two centuries."}},"NO":{"hist":{"ko":"이 나라는 빙하가 깎아낸 피오르 해안으로 유명하며, 1905년 이웃 나라와의 연합에서 벗어나 독립했어요.","en":"Famous for its glacier-carved fjords, this country left a union with its neighbor to become independent in 1905."}},"FI":{"hist":{"ko":"이 나라는 1917년 러시아로부터 독립했고, 1939년 소련의 침공에 맞서 '겨울 전쟁'을 치렀어요.","en":"This country gained independence from Russia in 1917 and fought the Winter War against a Soviet invasion in 1939."}},"DK":{"hist":{"ko":"이 나라는 세계에서 가장 큰 섬을 자치령으로 두고 있으며, 유럽에서 가장 오래된 왕실 중 하나를 이어오고 있어요.","en":"This country holds the world's largest island as an autonomous territory and has one of Europe's oldest monarchies."}},"IS":{"hist":{"ko":"이 나라는 930년에 세워진 세계에서 가장 오래된 의회 전통을 지닌, 화산과 빙하의 섬이에요.","en":"This volcanic, glacier-covered island has the world's oldest parliamentary tradition, dating to the year 930."}},"RU":{"hist":{"ko":"이 나라는 1917년 혁명으로 세계 최초의 공산주의 국가가 되었고, 1991년 거대한 연방이 해체되었어요.","en":"A 1917 revolution made this the world's first communist state, and its vast union broke apart in 1991."},"dispute":{"ko":"이 나라는 2014년 크림반도를 병합했으며, 여러 이웃 나라와 영토 분쟁을 겪고 있어요.","en":"This country annexed the Crimean Peninsula in 2014 and is involved in territorial disputes with several neighbors."}},"UA":{"hist":{"ko":"이 나라는 1932~33년 대기근을 겪었고, 1986년 체르노빌 원전 사고가 이곳에서 일어났으며, 1991년 소련 해체와 함께 독립했어요.","en":"This country suffered a great famine in 1932–33, was the site of the 1986 Chernobyl disaster, and gained independence when the Soviet Union dissolved in 1991."},"dispute":{"ko":"이 나라는 2014년 이후 크림반도와 동부 지역을 두고 러시아와 전쟁을 겪고 있어요.","en":"Since 2014 it has been at war with Russia over the Crimean Peninsula and its eastern regions."}},"BY":{"hist":{"ko":"이 나라는 제2차 세계대전에서 인구의 약 4분의 1을 잃었고, 1991년 소련 해체로 독립한 내륙국이에요.","en":"This landlocked country lost about a quarter of its population in WWII and became independent when the Soviet Union collapsed in 1991."}},"LT":{"hist":{"ko":"이 나라는 중세에 유럽에서 손꼽히게 넓은 나라였으며, 1990년 소련에서 가장 먼저 독립을 선언했어요.","en":"Once one of medieval Europe's largest states, this country was the first to declare independence from the Soviet Union in 1990."}},"EE":{"hist":{"ko":"이 나라는 '노래 혁명'을 통해 1991년 소련으로부터 독립을 되찾은 발트해 연안국이에요.","en":"Through its 'Singing Revolution,' this Baltic country regained independence from the Soviet Union in 1991."}},"LV":{"hist":{"ko":"이 나라는 발트해에 면한 나라로, 1991년 소련 해체와 함께 독립을 회복했어요.","en":"This Baltic country restored its independence when the Soviet Union broke apart in 1991."}},"RS":{"hist":{"ko":"이 나라는 옛 유고슬라비아 연방의 중심이었으며, 1990년대 연방 해체 과정에서 여러 전쟁에 휘말렸어요.","en":"This country was the core of the former Yugoslav federation and was drawn into several wars as it broke apart in the 1990s."},"dispute":{"ko":"이 나라는 2008년 독립을 선언한 남부 코소보 지역을 자국 영토로 여기며 인정하지 않고 있어요.","en":"It refuses to recognize its southern region of Kosovo, which declared independence in 2008, and still regards it as its own territory."}},"HR":{"hist":{"ko":"이 나라는 1991년 유고슬라비아 연방에서 독립하며 전쟁을 겪었고, 아드리아해의 긴 해안선으로 유명해요.","en":"This country fought a war of independence as it broke from Yugoslavia in 1991 and is famous for its long Adriatic coastline."}},"BA":{"hist":{"ko":"이 나라는 1990년대 유고슬라비아 해체 과정에서 참혹한 전쟁과 스레브레니차 학살을 겪었어요.","en":"This country endured a brutal war and the Srebrenica massacre during the breakup of Yugoslavia in the 1990s."}},"SI":{"hist":{"ko":"이 나라는 1991년 유고슬라비아 연방에서 가장 먼저 독립한 알프스 자락의 작은 나라예요.","en":"This small Alpine country was the first to break away from the Yugoslav federation in 1991."}},"MK":{"hist":{"ko":"이 나라는 1991년 유고슬라비아 연방에서 평화롭게 독립한 발칸반도의 내륙국이에요.","en":"This landlocked Balkan country peacefully gained independence from Yugoslavia in 1991."},"dispute":{"ko":"이 나라는 국명을 두고 이웃 나라와 오랜 분쟁을 벌인 끝에 2019년 정식 국명을 바꿨어요.","en":"After a long dispute with a neighbor over its name, this country officially changed its name in 2019."}},"AL":{"hist":{"ko":"이 나라는 냉전기에 극도로 폐쇄적이었던 강경 공산주의 국가로, 수많은 벙커를 지은 것으로 유명해요.","en":"During the Cold War this country was an intensely isolated hardline communist state, famous for building thousands of bunkers."}},"CY":{"hist":{"ko":"이 지중해 동부의 섬나라는 1960년 영국에서 독립했어요.","en":"This eastern Mediterranean island nation gained independence from Britain in 1960."},"dispute":{"ko":"이 섬나라는 1974년 이후 남북으로 분단되어, 북쪽은 오직 튀르키예만 인정하는 지역이에요.","en":"This island nation has been divided since 1974, with its north recognized only by Türkiye."}},"GE":{"hist":{"ko":"이 캅카스 산맥 남쪽의 나라는 세계에서 손꼽히게 일찍 기독교를 받아들였고, 1991년 소련에서 독립했어요.","en":"South of the Caucasus Mountains, this country was among the earliest to adopt Christianity and became independent from the Soviet Union in 1991."},"dispute":{"ko":"이 나라는 압하지야와 남오세티야 분리 지역을 두고 러시아와 갈등을 빚어 2008년 전쟁까지 벌였어요.","en":"This country clashed with Russia over the breakaway regions of Abkhazia and South Ossetia, even going to war in 2008."}},"AM":{"hist":{"ko":"이 나라는 301년경 세계에서 가장 먼저 기독교를 국교로 삼은 나라로, 20세기 초 대학살의 아픈 역사를 지녔어요.","en":"Around 301 AD this country became the first to adopt Christianity as its state religion, and it carries the painful history of an early-20th-century genocide."},"dispute":{"ko":"이 나라는 이웃 나라와 나고르노카라바흐 산악 지역을 두고 여러 차례 전쟁을 벌였어요.","en":"It has fought several wars with a neighbor over the mountainous Nagorno-Karabakh region."}},"AZ":{"hist":{"ko":"이 나라는 카스피해의 풍부한 석유로 일찍부터 유전 개발이 이뤄진 캅카스의 나라예요.","en":"Rich in Caspian Sea oil, this Caucasus country was one of the world's earliest oil-drilling regions."},"dispute":{"ko":"이 나라는 이웃 나라와 나고르노카라바흐 지역을 두고 오랜 전쟁을 벌여 왔어요.","en":"It has waged a long war with a neighbor over the Nagorno-Karabakh region."}},"KZ":{"hist":{"ko":"이 나라는 세계에서 가장 넓은 내륙국으로, 옛 소련의 우주선 발사 기지가 이곳에 있어요.","en":"The world's largest landlocked country, this nation hosts the former Soviet space-launch cosmodrome."}},"UZ":{"hist":{"ko":"이 나라에는 실크로드의 교역과 학문의 중심지였던 사마르칸트가 있어요.","en":"This country is home to Samarkand, a great hub of trade and learning on the Silk Road."}},"TR":{"hist":{"ko":"이 나라는 한때 세 대륙에 걸친 오스만 제국의 중심이었으며, 1923년 제국을 무너뜨리고 공화국을 세웠어요.","en":"This country was the heart of the Ottoman Empire that spanned three continents, and it founded a republic on the empire's ruins in 1923."},"dispute":{"ko":"이 나라는 1974년 이웃 섬나라의 북부에 군대를 보내 점령했고, 그 분단이 지금까지 이어지고 있어요.","en":"In 1974 it sent troops into the north of a neighboring island nation, a division that persists to this day."}},"SA":{"hist":{"ko":"이 나라에는 이슬람교에서 가장 성스러운 두 도시가 있으며, 세계 최대급의 석유 수출국이에요.","en":"This country contains Islam's two holiest cities and is one of the world's largest oil exporters."}},"IR":{"hist":{"ko":"이 나라는 고대 페르시아 제국을 이어받은 곳으로, 1979년 이슬람 혁명으로 왕정이 무너졌어요.","en":"Heir to the ancient Persian Empire, this country saw its monarchy overthrown in the 1979 Islamic Revolution."}},"IQ":{"hist":{"ko":"이 나라는 두 강 사이 고대 메소포타미아 문명의 발상지이며, 2003년 미국 주도의 침공으로 정권이 무너졌어요.","en":"The cradle of ancient Mesopotamian civilization between two rivers, this country's regime fell in a US-led invasion in 2003."}},"IL":{"hist":{"ko":"이 나라는 1948년에 건국되었으며, 그 이후 이웃 아랍 국가들과 여러 차례 전쟁을 치렀어요.","en":"Founded in 1948, this country has since fought several wars with its Arab neighbors."},"dispute":{"ko":"이 나라는 점령지의 정착촌과 팔레스타인 영토 문제를 둘러싸고 오랜 분쟁을 겪고 있어요.","en":"It is embroiled in a long-running conflict over settlements in occupied territory and Palestinian lands."}},"PS":{"hist":{"ko":"이 지역은 가자 지구와 요르단강 서안으로 나뉘어 있으며, 독립 국가 수립을 추구하고 있어요.","en":"Split between the Gaza Strip and a territory west of the Jordan River, this territory seeks to establish an independent state."},"dispute":{"ko":"이 지역은 이스라엘과 영토·주권을 둘러싸고 20세기 중반부터 이어진 분쟁의 중심에 있어요.","en":"It lies at the center of a conflict with Israel over land and sovereignty going back to the mid-20th century."}},"SY":{"hist":{"ko":"이 나라는 2011년부터 오랜 내전을 겪었으며, 팔미라 등 고대 문명의 유적이 많은 곳이에요.","en":"This country has endured a long civil war since 2011 and is dotted with ancient ruins such as Palmyra."}},"JO":{"hist":{"ko":"이 나라에는 붉은 바위를 깎아 만든 고대 도시 페트라가 있어요.","en":"This country is home to Petra, an ancient city carved into red rock."}},"LB":{"hist":{"ko":"이 나라는 1975년부터 15년간 이어진 내전을 겪었고, 고대 페니키아 문명의 본거지였어요.","en":"This country endured a 15-year civil war beginning in 1975 and was the homeland of the ancient Phoenician civilization."}},"EG":{"hist":{"ko":"이 나라는 피라미드와 파라오, 스핑크스로 대표되는 나일강 유역 고대 문명의 발상지예요.","en":"This country is the cradle of an ancient Nile civilization famed for its pyramids, pharaohs, and Sphinx."}},"KW":{"hist":{"ko":"이 나라는 1990년 이웃 나라의 침공을 받아 걸프전이 벌어졌던 석유 부국이에요.","en":"This oil-rich country was invaded by a neighbor in 1990, sparking the Gulf War."}},"YE":{"hist":{"ko":"이 나라는 아라비아반도 남쪽 끝에 있으며, 오랜 내전과 인도주의 위기를 겪고 있어요.","en":"At the southern tip of the Arabian Peninsula, this country is mired in a long civil war and humanitarian crisis."}},"AF":{"hist":{"ko":"이 나라는 1979년 소련의 침공을 받았고, 이후 수십 년간 이어진 전쟁과 탈레반의 부상을 겪었어요.","en":"Invaded by the Soviet Union in 1979, this country has since seen decades of war and the rise of the Taliban."}},"PK":{"hist":{"ko":"이 나라는 1947년 영국령 인도가 종교에 따라 나뉘면서 세워진 이슬람 국가예요.","en":"This Muslim-majority country was created in 1947 when British India was partitioned along religious lines."},"dispute":{"ko":"이 나라는 이웃 나라와 카슈미르 지역을 두고 여러 차례 전쟁을 벌인 오랜 분쟁을 이어오고 있어요.","en":"It has fought several wars with a neighbor over the Kashmir region in a decades-long dispute."}},"IN":{"hist":{"ko":"이 나라는 1947년 영국에서 독립했으며, 간디의 비폭력 저항 운동으로 널리 알려져 있어요.","en":"This country won independence from Britain in 1947 and is renowned for Gandhi's nonviolent resistance movement."},"dispute":{"ko":"이 나라는 이웃 나라들과 북부 카슈미르 등 국경 지역을 두고 오랜 영유권 분쟁을 겪고 있어요.","en":"It is engaged in long-standing border disputes with neighbors over the northern Kashmir region and other areas."}},"BD":{"hist":{"ko":"이 나라는 1971년 전쟁을 거쳐 파키스탄에서 분리 독립했으며, 갠지스강 삼각주의 저지대에 자리해요.","en":"This country split from Pakistan after a 1971 war and lies in the low-lying delta of the Ganges."}},"LK":{"hist":{"ko":"이 섬나라는 2009년까지 26년간 타밀 반군과 내전을 겪었으며, 홍차 재배로 유명해요.","en":"This island nation endured a 26-year civil war with Tamil rebels that ended in 2009 and is famous for its tea."}},"NP":{"hist":{"ko":"이 나라에는 세계 최고봉 에베레스트가 솟아 있으며, 2008년에 오랜 왕정을 폐지하고 공화국이 되었어요.","en":"Home to Mount Everest, the world's highest peak, this country abolished its centuries-old monarchy and became a republic in 2008."}},"BT":{"hist":{"ko":"이 나라는 국내총생산 대신 '국민총행복'을 국정 지표로 삼는 히말라야의 불교 왕국이에요.","en":"This Himalayan Buddhist kingdom famously measures 'Gross National Happiness' instead of focusing on GDP."}},"MN":{"hist":{"ko":"이 나라는 13세기에 칭기즈 칸이 역사상 가장 넓은 제국을 일으킨 초원의 발상지예요.","en":"This steppe country is where Genghis Khan founded history's largest contiguous empire in the 13th century."}},"CN":{"hist":{"ko":"이 나라는 만리장성을 쌓은 유구한 왕조의 역사를 지녔고, 1949년 공산 혁명으로 현재의 정부가 세워졌어요.","en":"With a long dynastic history that built the Great Wall, this country's current government was established by a communist revolution in 1949."},"dispute":{"ko":"이 나라는 주변 바다의 여러 섬과 암초, 그리고 인접 지역의 영유권을 두고 여러 이웃 나라와 갈등을 겪어요.","en":"It is involved in disputes with several neighbors over islands and reefs in nearby seas and over adjacent territories."}},"JP":{"hist":{"ko":"제2차 세계대전 말, 이 나라의 두 도시에 원자폭탄이 투하되었어요.","en":"Near the end of WWII, two of this country's cities were struck by atomic bombs."},"dispute":{"ko":"이 나라는 이웃 나라들과 여러 섬(예: 쿠릴열도)을 두고 영유권 갈등을 겪고 있어요.","en":"It has island sovereignty disputes with neighbors (e.g., the s famous for unique wildlife found nowhere else, such as lemurs."}},"NA":{"hist":{"ko":"이 나라는 독일의 식민 지배를 받았으며, 대서양 연안을 따라 펼쳐진 붉은 사막으로 유명해요.","en":"Once a German colony, this country is famed for the red desert stretching along its Atlantic coast."}},"LR":{"hist":{"ko":"이 나라는 19세기에 해방된 미국 노예들이 건너와 세운 서아프리카의 공화국이에요.","en":"This West African republic was founded in the 19th century by freed American slaves who resettled there."}}};

/* number formatting (Korean units) */
function fmtInt(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtPop(n){
  if(EN()){
    if(n>=1e9) return (n/1e9).toFixed(n>=1e10?2:3)+' billion';
    if(n>=1e6) return (n/1e6).toFixed(n>=1e7?1:2)+' million';
    return fmtInt(n);
  }
  if(n>=1e8) return (n/1e8).toFixed(n>=1e9?1:2)+'억 명';
  if(n>=1e4) return Math.round(n/1e4).toLocaleString('en-US')+'만 명';
  return fmtInt(n)+' 명';
}
function fmtUSD(n){
  if(EN()){
    if(n>=1e12) return '$'+(n/1e12).toFixed(2)+' trillion';
    if(n>=1e9)  return '$'+(n/1e9).toFixed(n>=1e10?0:1)+' billion';
    if(n>=1e6)  return '$'+(n/1e6).toFixed(0)+' million';
    return '$'+fmtInt(n);
  }
  if(n>=1e12) return (n/1e12).toFixed(2)+'조 달러';
  if(n>=1e8)  return Math.round(n/1e8).toLocaleString('en-US')+'억 달러';
  if(n>=1e4)  return Math.round(n/1e4).toLocaleString('en-US')+'만 달러';
  return '$'+fmtInt(n);
}
function fmtArea(n){ return fmtInt(n)+' km²'; }

/* ================= view / pan / zoom / pinch ================= */
let view=[VBX,VBY,VBW,VBH];
// keep small-country markers roughly constant on-screen: shrink their radius as you zoom in
function updateMarkerScale(){
  const mr=Math.max(0.28,Math.min(1.4, view[2]/VBW*1.4));
  const mk=gMarkers.children;
  for(let i=0;i<mk.length;i++) mk[i].setAttribute('r',mr.toFixed(3));
}
function applyView(){ map.setAttribute('viewBox',view.map(n=>Math.round(n*100)/100).join(' ')); updateMarkerScale(); }
applyView();
let anim=null;
function animateView(target,ms){
  if(anim) cancelAnimationFrame(anim);
  const start=view.slice(), t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function step(now){ let t=Math.min(1,(now-t0)/ms), e=ease(t);
    for(let i=0;i<4;i++) view[i]=start[i]+(target[i]-start[i])*e; applyView();
    if(t<1) anim=requestAnimationFrame(step); }
  anim=requestAnimationFrame(step);
}
function clampView(){
  view[2]=Math.max(6,Math.min(VBW,view[2])); view[3]=view[2]*(VBH/VBW);
  view[0]=Math.max(VBX-view[2]*0.15,Math.min(VBX+VBW-view[2]*0.85,view[0]));
  view[1]=Math.max(VBY-view[3]*0.15,Math.min(VBY+VBH-view[3]*0.85,view[1]));
}
function focusEntry(entry,pad){
  const b=entry.b; pad=pad||1.2;
  let w=Math.max(b[2],b[3]*(VBW/VBH))*pad; w=Math.max(w,14); w=Math.min(w,VBW);
  let h=w*(VBH/VBW); const cx=b[0]+b[2]/2, cy=b[1]+b[3]/2;
  const t=[cx-w/2,cy-h/2,w,h];
  t[0]=Math.max(VBX-w*0.15,Math.min(VBX+VBW-w*0.85,t[0]));
  t[1]=Math.max(VBY-h*0.15,Math.min(VBY+VBH-h*0.85,t[1]));
  animateView(t,480);
}
function fitRegion(pool){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pool.forEach(e=>{ const b=e.b||[e.x,e.y,0,0]; x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[0]+b[2]);y1=Math.max(y1,b[1]+b[3]); });
  const ar=VBW/VBH; let w=(x1-x0)*1.3, h=(y1-y0)*1.3;
  if(w/h<ar) w=h*ar; h=w/ar; w=Math.min(w,VBW); h=w/ar;
  let cx=(x0+x1)/2, cy=(y0+y1)/2, vx=cx-w/2, vy=cy-h/2;
  vx=Math.max(VBX-w*0.1,Math.min(VBX+VBW-w*0.9,vx));
  vy=Math.max(VBY-h*0.1,Math.min(VBY+VBH-h*0.9,vy));
  animateView([vx,vy,w,h],520); return w;
}
function resetView(){ animateView([VBX,VBY,VBW,VBH],480); }

map.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=map.getBoundingClientRect();
  const px=view[0]+(e.clientX-r.left)/r.width*view[2];
  const py=view[1]+(e.clientY-r.top)/r.height*view[3];
  view[2]*=e.deltaY<0?0.82:1.22; clampView();
  view[0]=px-(e.clientX-r.left)/r.width*view[2];
  view[1]=py-(e.clientY-r.top)/r.height*view[3];
  clampView(); applyView();
},{passive:false});

const pointers=new Map();
let drag=null, pinch=null, gestureMoved=false;
function pts(){ return [...pointers.values()]; }
map.addEventListener('pointerdown',e=>{
  map.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  gestureMoved=false;
  if(pointers.size===1){ drag={x:e.clientX,y:e.clientY,v:view.slice()}; map.classList.add('grabbing'); }
  else { drag=null; pinch=null; }
});
map.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=map.getBoundingClientRect();
  if(pointers.size>=2){
    const [a,b]=pts(); const dist=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(!pinch){ pinch={dist,view:view.slice(),mx,my}; return; }
    gestureMoved=true;
    const wx=pinch.view[0]+(pinch.mx-r.left)/r.width*pinch.view[2];
    const wy=pinch.view[1]+(pinch.my-r.top)/r.height*pinch.view[3];
    view[2]=pinch.view[2]*(pinch.dist/Math.max(1,dist)); clampView();
    view[0]=wx-(mx-r.left)/r.width*view[2];
    view[1]=wy-(my-r.top)/r.height*view[3];
    clampView(); applyView();
  } else if(drag){
    const dx=(e.clientX-drag.x)/r.width*view[2], dy=(e.clientY-drag.y)/r.height*view[3];
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4) gestureMoved=true;
    view[0]=drag.v[0]-dx; view[1]=drag.v[1]-dy; clampView(); applyView();
  }
});
function upPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(pointers.size===0){ drag=null; map.classList.remove('grabbing'); }
  else if(pointers.size===1){ const p=pts()[0]; drag={x:p.x,y:p.y,v:view.slice()}; }
}
map.addEventListener('pointerup',upPointer);
map.addEventListener('pointercancel',upPointer);

const tooltip=document.getElementById('tooltip');

  if(state.mode!=='free'||drag||pointers.size){ tooltip.style.opacity=0; return; }
  const entry=byEl.get(e.target);
  if(entry){ tooltip.textContent=NM(entry);
    const r=map.getBoundingClientRect();
    tooltip.style.left=(e.clientX-r.left)+'px'; tooltip.style.top=(e.clientY-r.top)+'px'; tooltip.style.opacity=1;
  } else tooltip.style.opacity=0;
});
map.addEventListener('pointerleave',()=>tooltip.style.opacity=0);
map.addEventListener('click',e=>{
  if(gestureMoved) return;
  // pointer capture (used for pan/zoom) retargets the click to the <svg>, so hit-test by point
  const entry=byEl.get(document.elementFromPoint(e.clientX,e.clientY)); if(!entry) return;
  if(state.mode==='free') revealFree(entry);
  else if(state.mode==='findmap') handleFindClick(entry);
  else if(state.mode==='study'){ const i=state.cards.indexOf(entry); if(i>=0) showCard(i); }
  else if(state.mode==='rank'){ const i=state.rankList?state.rankList.indexOf(entry):-1; if(i>=0) focusRank(i); }
  else if(state.mode==='conquer') conquerClick(entry);
  else if(state.mode==='locate') locateClick(entry);
  else if(state.mode==='mastery') masteryClick(entry);
});

function showCard(i){
  if(!state.cards.length) return;

  allEntries.forEach(x=>x.el.classList.remove('target','found'));

  const items=el.spList.children;

el.prev.onclick=()=>{ if(state.mode==='study') showCard(state.cardIdx-1); };
