/* ================= location study (find-by-name, no timer, repeat until learned) ================= */
function startLocate(){
  let pool=regionEntries(state.region).filter(e=>!e.isMarker);
  if(!pool.length) pool=allEntries.filter(e=>e.sov&&!e.isMarker);
  state.found=new Set(); state.locTotal=pool.length; state.locPool=pool;
  state.locQueue=shuffleArr(pool.slice());
  clearMap(); clearLabels();
  if(state.region!=='전세계') fitRegion(pool);
  el.studypanel.classList.add('hidden');
  updateScore();
  setFeedback(EN()?'No timer — tap the named country. Miss? It lights up so you learn it. “Skip” shows it.':'타이머 없이 익혀요 — 이름의 나라를 누르세요. 틀리면 위치를 보여 줘요. “넘기기”로 위치 확인.','info');
  nextLocateTarget();
}
function nextLocateTarget(){
  allEntries.forEach(x=>x.el.classList.remove('target'));
  const remaining=state.locPool.filter(e=>!state.found.has(e.id));
  if(!remaining.length){ endGame(); return; }
  if(!state.locQueue.length) state.locQueue=shuffleArr(remaining);
  state.target=state.locQueue.shift();
  while(state.target && state.found.has(state.target.id)) state.target=state.locQueue.shift();
  if(!state.target){ endGame(); return; }
  el.prompt.innerHTML=EN()?('Where is <b>'+NM(state.target)+'</b>? Tap it on the map. No timer — learn as you go.'):('<b>'+NM(state.target)+'</b> 은(는) 어디일까요? 지도에서 눌러 보세요. 타이머 없이 익혀요.');
}
function locateClick(entry){
  if(state.ended||state.findLock||!state.target) return;
  if(entry.id===state.target.id){
    state.found.add(entry.id); markFound(entry,true); celebrate(true,LT('맞아요!','Yes!')); trackCountry(state.target,true);
    setFeedback(LT('맞아요! ','Correct! ')+NM(entry),'ok','check'); updateScore();
    state.findLock=true; later(()=>{ state.findLock=false; nextLocateTarget(); },600);
  } else {
    // teach: flash the wrong pick, then briefly light up the correct location
    trackCountry(state.target,false);
    flashWrong(entry);
    const t=state.target; t.el.classList.add('target'); t.el.parentNode.appendChild(t.el); focusEntry(t,2.4);
    setFeedback(EN()?('That’s '+NM(entry)+'. '+NM(t)+' is here — remember it!'):('그건 '+NM(entry)+' 예요. '+NM(t)+' 은(는) 여기예요 — 기억해요!'),'no','x');
    state.findLock=true; later(()=>{ state.findLock=false; t.el.classList.remove('target'); },1500);
  }
}

  setFeedback(EN()?'Drop on the right country and it sticks; wrong ones bounce back. Place them all to win!':'맞는 나라에 놓으면 붙고, 틀리면 돌아옵니다. 다 붙이면 완성!','info');

function buildTray(){
  el.spTitle.textContent=LT('남은 이름표 · ','Labels left · ')+state.cards.length+LT('개','');
  el.spList.classList.remove('hide'); el.spList.innerHTML='';

    c.querySelector('.sp-name').textContent=NM(e);
    c.addEventListener('pointerdown',ev=>beginDrag(ev,e,c));
    el.spList.appendChild(c);
  });
}
function moveGhost(x,y){ ghost.style.left=x+'px'; ghost.style.top=y+'px'; }
function entryAtPoint(x,y){ const t=document.elementFromPoint(x,y); return t?byEl.get(t):null; }
function beginDrag(ev,e,chip){
  if(state.ended||dragEntry) return;
  ev.preventDefault();
  dragEntry=e; dragChip=chip; dragStartX=ev.clientX; dragStartY=ev.clientY; chip.classList.add('dragging');
  ghost.innerHTML='<span class="sp-flag">'+flagEmoji(e.i2)+'</span><span></span>';
  ghost.lastChild.textContent=NM(e);
  ghost.classList.remove('hidden'); moveGhost(ev.clientX,ev.clientY);
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragUp);
  window.addEventListener('pointercancel',cancelDrag);
}
function onDragMove(ev){
  if(!dragEntry) return;
  moveGhost(ev.clientX,ev.clientY);
  const e=entryAtPoint(ev.clientX,ev.clientY);
  if(e!==dragHover){
    if(dragHover) dragHover.el.classList.remove('dragover');
    dragHover=e||null;
    if(dragHover && dragHover.el.classList.contains('sset')) dragHover.el.classList.add('dragover');
    else dragHover=null;
  }
}
function endDragListeners(){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragUp);
  window.removeEventListener('pointercancel',cancelDrag);
}
function cancelDrag(){
  endDragListeners(); ghost.classList.add('hidden');
  if(dragHover){ dragHover.el.classList.remove('dragover'); dragHover=null; }
  if(dragChip) dragChip.classList.remove('dragging');
  dragEntry=null; dragChip=null;
}
function onDragUp(ev){
  const e=dragEntry, chip=dragChip;
  const moved=Math.abs(ev.clientX-dragStartX)+Math.abs(ev.clientY-dragStartY)>6;
  const target=entryAtPoint(ev.clientX,ev.clientY);
  cancelDrag();
  if(!e||!moved) return;   // a tap without dragging isn't a drop
  if(target && target.id===e.id) placeLabel(e,chip);
  else failDrop(e,chip,target);
}
function placeLabel(e,chip){
  e.el.classList.remove('sset','dragover'); e.el.classList.add('found');
  e.el.classList.remove('pop'); void e.el.offsetWidth; e.el.classList.add('pop');
  e.el.parentNode.appendChild(e.el);
  addPlacedLabel(e);
  state.cards=state.cards.filter(x=>x.id!==e.id);
  if(chip&&chip.parentNode) chip.parentNode.removeChild(chip);
  el.spTitle.textContent=LT('남은 이름표 · ','Labels left · ')+state.cards.length+LT('개','');
  if(!state.running){ state.running=true; startTicker(); }
  updateScore();
  celebrate(true,LT('붙었어요!','Placed!'));
  setFeedback(LT('붙었어요! ','Placed! ')+NM(e),'ok','check');
  if(state.cards.length===0) endGame();
}
function failDrop(e,chip,target){
  if(target){ target.el.classList.remove('wrong'); void target.el.offsetWidth; target.el.classList.add('wrong'); setTimeout(()=>target.el.classList.remove('wrong'),500); }
  if(chip){ chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake'); }
  setFeedback(target?(EN()?(NM(e)+' doesn’t go here. Try again.'):(e.ko+' 은(는) 여기가 아니에요. 다시 놓아 보세요.')):(LT('나라 땅 위에 놓아 주세요.','Drop it on a country.')),'no','x');
}
function addPlacedLabel(e){
  const b=e.b||[e.x,e.y,0,0];
  const w=e.isMarker?0:(b[2]||1);
  const fs=Math.max((state.studyW||120)*0.006,Math.min((state.studyW||120)*0.02,w*0.3));
  const t=document.createElementNS(SVGNS,'text');
  t.setAttribute('x',b[0]+b[2]/2); t.setAttribute('y',b[1]+b[3]/2);
  t.setAttribute('font-size',fs.toFixed(3)); t.setAttribute('stroke-width',(fs*0.16).toFixed(3));
  t.setAttribute('text-anchor','middle'); t.setAttribute('class','clabel');
  t.textContent=NM(e); gLabels.appendChild(t);
}

/* ================= hint quiz (guess by clues) ================= */
function hintPool(){ return regionEntries(state.region).filter(e=>e.st); }
function sizeBucket(a){
  if(EN()){
    if(a>=2500000) return 'one of the largest in the world';
    if(a>=1000000) return 'very large';
    if(a>=300000) return 'fairly large';
    if(a>=100000) return 'medium-sized';
    if(a>=30000) return 'fairly small';
    return 'very small';
  }
  if(a>=2500000) return '세계에서 손꼽히게 큰';
  if(a>=1000000) return '아주 큰';
  if(a>=300000) return '큰 편인';
  if(a>=100000) return '중간 크기의';
  if(a>=30000) return '작은 편인';
  return '아주 작은';
}
// area rank expressed as a "top N in the world" bracket — more identifiable than a vague bucket
function areaRankClue(e){
  const r=e.areaRank; if(!r) return null; const en=EN();
  let br=0; for(const b of [10,25,50,75,100,150]){ if(r<=b){ br=b; break; } }
  if(br) return en?('By land area it ranks in the world’s <b>top '+br+'</b>.'):('영토 크기가 세계 <b>상위 '+br+'위</b> 안에 들어요.');
  return en?('By land area it is <b>outside the top 150</b> (one of the smaller countries).'):('영토 크기는 세계 <b>150위권 밖</b>(작은 나라 축)이에요.');
}
// Returns {normal:[...clues...], fever:[...strong clues...]}. Strong identifying clues
// (history / dispute) lead; the generic clues are shuffled so the order still varies.
function buildHints(e){
  const s=e.st||{}, en=EN(), lead=[], geo=[], stat=[], F=[];
  const nbs=en?(s.nbe||[]):(s.nb||[]);
  const K=state.hintKinds||new Set(['hist','geo','stat','fever']);
  // ---------- 📜 history / ⚔️ dispute (strong identifying) ----------
  const HF=(e.i2&&HISTFACTS[e.i2])||null;
  if(HF&&HF.hist) lead.push('📜 '+(en?HF.hist.en:HF.hist.ko));
  if(HF&&HF.dispute) lead.push('⚔️ '+(en?HF.dispute.en:HF.dispute.ko));
  // ---------- geography ----------
  geo.push(en?('This country is in <b>'+regionOf(e)+'</b>.'):('이 나라는 <b>'+regionOf(e)+'</b>에 있어요.'));
  { const ar=areaRankClue(e); if(ar) geo.push(ar); }
  { const loc=[];
    if(s.lat!=null) loc.push(en?(s.lat>=0?'Northern Hemisphere':'Southern Hemisphere'):(s.lat>=0?'북반구':'남반구'));
    if(s.land!=null) loc.push(en?(s.land?'landlocked':'has a coastline'):(s.land?'내륙국(바다에 접하지 않음)':'바다에 접한 나라'));
    if(loc.length) geo.push(en?('Location: <b>'+loc.join('</b>, <b>')+'</b>.'):('위치: <b>'+loc.join('</b>, <b>')+'</b>.')); }
  if(s.temp!=null) geo.push(en?('Its average yearly temperature is about <b>'+s.temp+'℃</b>.'):('연평균 기온은 약 <b>'+s.temp+'℃</b>예요.'));
  if(s.elev!=null) geo.push(en?('Its average elevation is about <b>'+fmtInt(s.elev)+' m</b>.'):('평균 고도는 약 <b>'+fmtInt(s.elev)+' m</b>예요.'));
  if(nbs.length) geo.push(en?('It shares land borders with <b>'+nbs.length+'</b> countries.'):('육지 국경을 맞댄 나라가 <b>'+nbs.length+'</b>개예요.'));
  else if(s.land===0) geo.push(en?('It is an <b>island nation</b> with no land borders.'):('육지 국경이 없는 <b>섬나라</b>예요.'));
  // ---------- population / economy stats ----------
  if(s.pop) stat.push(en?('Its population is about <b>'+fmtPop(s.pop)+'</b>.'):('인구는 약 <b>'+fmtPop(s.pop)+'</b>이에요.'));
  if(s.dens) stat.push(en?('Its population density is about <b>'+fmtInt(s.dens)+' /km²</b>.'):('인구 밀도는 약 <b>'+fmtInt(s.dens)+' 명/km²</b>이에요.'));
  if(en?s.gove:s.gov) stat.push(en?('Its government is a <b>'+s.gove+'</b>.'):('정부 형태는 <b>'+s.gov+'</b>이에요.'));
  if(s.gdp||s.gpc){ const t=[]; if(s.gdp)t.push(en?('GDP about '+fmtUSD(s.gdp)):('GDP 약 '+fmtUSD(s.gdp))); if(s.gpc)t.push(en?('GDP per capita about $'+fmtInt(s.gpc)):('1인당 GDP 약 $'+fmtInt(s.gpc)));
    stat.push(en?('Economy: <b>'+t.join('</b>, <b>')+'</b>.'):('경제: <b>'+t.join('</b>, <b>')+'</b>.')); }
  // ---------- 🔥 fever (very revealing) ----------
  if(en && e.en) F.push('Its English name starts with <b>'+e.en.charAt(0).toUpperCase()+'</b>.');
  else if(!en && e.ko) F.push('이름은 <b>'+e.ko.charAt(0)+'</b>(으)로 시작해요.');
  if(nbs.length) F.push(en?('It borders <b>'+nbs.join(', ')+'</b>.'):('<b>'+(s.nb||[]).join('·')+'</b> 와(과) 국경을 맞대고 있어요.'));
  if(en?s.cape:s.cap) F.push(en?('Its capital is <b>'+s.cape+'</b>.'):('수도는 <b>'+s.cap+'</b>이에요.'));
  if(e.i2) F.push((en?'This is its flag: ':'이 나라의 국기예요: ')+'<span style="font-size:1.55em;vertical-align:-3px">'+flagEmoji(e.i2)+'</span>');
  // keep only the chosen kinds (always leave at least the region/geo clue)
  const useLead = K.has('hist') ? lead : [];
  let gen = (K.has('geo')?geo:[]).concat(K.has('stat')?stat:[]);
  if(!gen.length) gen=geo;                 // never leave zero normal clues
  const fever = K.has('fever') ? F : [];
  // Difficulty mix: the strong identifying clues (history/dispute) are placed differently
  // each round so some are easy (big clue first) and some are genuinely hard (vague first).
  let normal, tier;
  if(!useLead.length){ tier='vague'; normal=shuffleArr(gen); }
  else{
    const r=Math.random();
    if(r<0.34){ tier='easy'; normal=shuffleArr(useLead).concat(shuffleArr(gen)); }        // big clue up front
    else if(r<0.67){ tier='mixed'; normal=shuffleArr(useLead.concat(gen)); }              // everything jumbled
    else{ tier='hard'; normal=shuffleArr(gen).concat(shuffleArr(useLead)); }              // vague first, strong clue last
  }
  return {normal, fever:shuffleArr(fever), tier};
}

const CLUE_BASE=20;
function buildClues(e){
  const s=e.st||{}, en=EN(), nbs=en?(s.nbe||[]):(s.nb||[]), HF=(e.i2&&HISTFACTS[e.i2])||null;
  const out=[]; const add=(cost,label,html)=>{ if(html) out.push({cost,label,html,bought:false}); };

  { const loc=[]; if(s.lat!=null) loc.push(en?(s.lat>=0?'Northern Hemisphere':'Southern Hemisphere'):(s.lat>=0?'북반구':'남반구'));
    if(s.land!=null) loc.push(en?(s.land?'landlocked':'has a coastline'):(s.land?'내륙국':'바다에 접함'));
    if(loc.length) add(1, LT('반구·해안','Hemisphere/coast'), '<b>'+loc.join('</b>, <b>')+'</b>'); }
  { const ar=areaRankClue(e); if(ar) add(1, LT('면적 순위','Area rank'), ar); }
  if(s.temp!=null) add(1, LT('평균 기온','Avg. temp'), en?('Avg. temperature about <b>'+s.temp+'℃</b>.'):('연평균 기온 약 <b>'+s.temp+'℃</b>.'));
  if(s.elev!=null) add(1, LT('평균 고도','Avg. elevation'), en?('Avg. elevation about <b>'+fmtInt(s.elev)+' m</b>.'):('평균 고도 약 <b>'+fmtInt(s.elev)+' m</b>.'));
  if(s.pop) add(2, LT('인구','Population'), en?('Population about <b>'+fmtPop(s.pop)+'</b>.'):('인구 약 <b>'+fmtPop(s.pop)+'</b>.'));
  if(s.dens) add(2, LT('인구 밀도','Density'), en?('Density about <b>'+fmtInt(s.dens)+' /km²</b>.'):('인구 밀도 약 <b>'+fmtInt(s.dens)+' 명/km²</b>.'));
  if(en?s.gove:s.gov) add(2, LT('정부 형태','Government'), en?('Government: <b>'+s.gove+'</b>.'):('정부 형태: <b>'+s.gov+'</b>.'));
  if(s.gdp||s.gpc){ const t=[]; if(s.gdp)t.push(en?('GDP '+fmtUSD(s.gdp)):('GDP '+fmtUSD(s.gdp))); if(s.gpc)t.push(en?('per-capita $'+fmtInt(s.gpc)):('1인당 $'+fmtInt(s.gpc)));
    add(2, LT('경제','Economy'), '<b>'+t.join('</b>, <b>')+'</b>'); }
  if(nbs.length) add(2, LT('접경국 수','# of borders'), en?('Shares land borders with <b>'+nbs.length+'</b> countries.'):('접경국이 <b>'+nbs.length+'</b>개국이에요.'));
  else if(s.land===0) add(2, LT('섬 여부','Island?'), LT('육지 국경이 없는 <b>섬나라</b>예요.','It is an <b>island nation</b> with no land borders.'));
  if(HF&&HF.hist) add(3, LT('역사','History'), '📜 '+(en?HF.hist.en:HF.hist.ko));
  if(HF&&HF.dispute) add(3, LT('분쟁·이슈','Dispute'), '⚔️ '+(en?HF.dispute.en:HF.dispute.ko));
  const firstL = en?(e.en?e.en.charAt(0).toUpperCase():''):(e.ko?e.ko.charAt(0):'');
  if(firstL) add(4, LT('첫 글자','First letter'), en?('Its name starts with <b>'+firstL+'</b>.'):('이름은 <b>'+firstL+'</b>(으)로 시작해요.'));
  if(en?s.cape:s.cap) add(5, LT('수도','Capital'), en?('Its capital is <b>'+s.cape+'</b>.'):('수도는 <b>'+s.cap+'</b>이에요.'));
  if(nbs.length) add(5, LT('국경 나라','Neighbors'), en?('It borders <b>'+nbs.join(', ')+'</b>.'):('<b>'+(s.nb||[]).join('·')+'</b> 와(과) 국경을 맞대요.'));
  if(e.i2) add(6, LT('국기','Flag'), (en?'Its flag: ':'국기: ')+'<span style="font-size:1.5em;vertical-align:-3px">'+flagEmoji(e.i2)+'</span>');
  return out;
}

/* ================= conquer mode (tap to fill; master the region) ================= */
function conquerParams(count){
  const K = count<=10?5 : count<=20?4 : count<=35?3 : 2;   // fewer taps per country when many (fair for Africa)
  const time = Math.min(360, Math.max(45, Math.round(count*K*1.0)));
  return {K,time};
}
function conquerShade(t){ const lo=[46,66,58], hi=[52,199,119]; return 'rgb('+lo.map((c,i)=>Math.round(c+(hi[i]-c)*t)).join(',')+')'; }
function startConquer(){
  let pool=regionEntries(state.region).filter(e=>!e.isMarker);
  if(!pool.length) pool=allEntries.filter(e=>e.sov&&!e.isMarker);
  const {K,time}=conquerParams(pool.length);
  state.conquerK=K; state.conquerTotal=pool.length; state.conquerDone=0; state.lv={}; state.duration=time;
  state.conquerPool=new Set(pool.map(e=>e.id));
  clearMap(); clearLabels();
  pool.forEach(e=>{ e.el.classList.add('sset'); e.el.parentNode.appendChild(e.el); });
  state.studyW=fitRegion(pool);
  el.prompt.innerHTML=EN()?('Conquer <b>'+regionName(state.region)+'</b>! Tap each country <b>'+K+'×</b> to fill it. Paint them all for 🏆'):('<b>'+regionName(state.region)+'</b> 정복! 나라를 <b>'+K+'번</b> 눌러 가득 칠하세요. 전부 칠하면 🏆');
  setFeedback(EN()?(fmtTime(time)+' limit · tap countries on the map repeatedly to paint them.'):('제한 '+fmtTime(time)+' · 지도의 나라를 반복해 눌러 칠하세요.'),'info');
  updateScore();
}
function conquerClick(e){
  if(state.ended||!state.conquerPool||!state.conquerPool.has(e.id)) return;
  const lv=state.lv[e.id]||0;
  if(lv>=state.conquerK) return;                 // already fully conquered — never redraw
  if(!state.running){ state.running=true; startTicker(); }
  const nl=lv+1; state.lv[e.id]=nl;
  if(nl>=state.conquerK){
    e.el.classList.remove('sset'); e.el.style.fill=''; e.el.classList.add('found');
    e.el.classList.remove('pop'); void e.el.offsetWidth; e.el.classList.add('pop');
    e.el.parentNode.appendChild(e.el); addPlacedLabel(e);
    state.conquerDone++; updateScore(); celebrate(true,LT('정복!','Conquered!'));
    setFeedback(NM(e)+LT(' 정복! ',' conquered! ')+'('+state.conquerDone+' / '+state.conquerTotal+')','ok','check');
    if(state.conquerDone>=state.conquerTotal) endGame();
  } else {
    e.el.style.fill=conquerShade(nl/state.conquerK);
  }
}

/* ================= compare — "which is bigger?" ================= */
function cmpVal(e){ return e.st?e.st[state.cmpMetric]:null; }
function cmpFmt(v){ const m=METRICS.find(x=>x.k===state.cmpMetric); return m?m.fmt(v):fmtInt(v); }
function cmpLabel(){ const m=CMP_METRICS.find(x=>x.k===state.cmpMetric)||CMP_METRICS[0]; return EN()?m.te:m.t; }
function startCompare(){
  el.studypanel.classList.add('hidden'); el.trivia.classList.remove('show'); el.compare.classList.add('show');
  el.minigame.classList.remove('show');

  el.timer.classList.toggle('hidden',state.vs);
  state.score=0; state.cmpLock=false;
  state.cmpPool=regionEntries(state.region).filter(e=>cmpVal(e)!=null);
  if(state.cmpPool.length<2) state.cmpPool=allEntries.filter(e=>e.sov&&cmpVal(e)!=null);
  if(state.vs){ vsInit(); el.cmpFact.textContent=LT('1 대 1 · 번갈아 한 번씩 고르세요. 정답 +1점.','1v1 · take turns picking. +1 per correct.'); }
  else el.cmpFact.textContent=LT('첫 선택에 '+state.duration+'초 타이머가 시작돼요.','the '+state.duration+'s timer starts on your first pick.');
  updateScore(); updateTimerDisplay();
  nextComparePair();
}
function pickTwoDistinct(){
  const pool=state.cmpPool; let a=pool[Math.floor(Math.random()*pool.length)], bb=a, tries=0;
  while((bb===a||cmpVal(a)===cmpVal(bb))&&tries<60){ bb=pool[Math.floor(Math.random()*pool.length)]; tries++; }
  return [a,bb];
}

function compareClick(which){
  if(state.ended||state.cmpLock||!state.cmpA) return;
  if(!state.vs && !state.running){ state.running=true; startTicker(); }
  state.cmpLock=true;
  const a=state.cmpA,b=state.cmpB, va=cmpVal(a),vb=cmpVal(b), bigger=va>=vb?'a':'b', correct=which===bigger;
  el.cmpA.querySelector('.cval').textContent=cmpFmt(va);
  el.cmpB.querySelector('.cval').textContent=cmpFmt(vb);
  el.cmpA.classList.add(bigger==='a'?'win':'lose');
  el.cmpB.classList.add(bigger==='b'?'win':'lose');
  if(correct){ if(state.vs) vsAward(1); else { state.score++; updateScore(); } celebrate(true,LT('정답!','Correct!')); el.cmpFact.textContent=LT('정답! 👍','Correct! 👍'); }
  else { celebrate(false,LT('오답','Nope')); el.cmpFact.textContent=LT('아쉬워요.','Not quite.'); }
  if(state.vs){ vsAfterAnswerCmp(correct); return; }
  const g=state.gen; setTimeout(()=>{ if(state.gen!==g||state.ended||state.mode!=='compare') return; nextComparePair(); },950);
}
// compare 1v1 turn handoff
function vsAfterAnswerCmp(correct){
  state.vsDone++; const g=state.gen;
  setTimeout(()=>{ if(state.gen!==g||state.ended||!state.vs) return;
    if(state.vsDone>=state.vsRounds){ endVs(); return; }
    state.turn^=1; updateVsBar(); nextComparePair();
  }, correct?950:1150);
}
el.cmpA.onclick=()=>compareClick('a');
el.cmpB.onclick=()=>compareClick('b');

/* ================= mini-games: Higher–Lower · Estimate · Odd-One-Out ================= */
function mgShow(){ el.studypanel.classList.add('hidden'); el.trivia.classList.remove('show'); el.compare.classList.remove('show');
  el.minigame.classList.add('show'); el.prompt.classList.add('hidden'); el.feedback.classList.add('hidden'); }
function rndOf(a){ return a[Math.floor(Math.random()*a.length)]; }
function mgPool(minN){ let p=regionEntries(state.region).filter(e=>e.st); if(p.length<(minN||4)) p=allEntries.filter(e=>e.sov&&e.st); return p; }

/* ---- Higher / Lower ladder (uses state.cmpMetric) ---- */
function startLadder(){
  mgShow(); el.timer.classList.remove('hidden');
  state.score=0; state.ladderStreak=0; state.mgLock=false;
  state.ladderPool=mgPool(3).filter(e=>cmpVal(e)!=null);
  if(state.ladderPool.length<3){ el.mgQ.textContent=LT('이 지역은 자료가 부족해요. 다른 지역을 골라 주세요.','Not enough data here — pick another region.'); el.mgBody.innerHTML=''; el.mgFact.textContent=''; return; }
  state.ladderCur=rndOf(state.ladderPool);
  updateScore(); updateTimerDisplay(); el.mgFact.textContent='';
  renderLadder();
}
function ladderPickNext(){
  const cur=state.ladderCur, cv=cmpVal(cur); let n=cur,tries=0;
  while((n===cur||cmpVal(n)===cv)&&tries<80){ n=rndOf(state.ladderPool); tries++; }
  return n;
}
function ladderCardHTML(e,showVal,tag){
  return '<div class="mg-tag">'+tag+'</div><div class="mf">'+flagEmoji(e.i2)+'</div><div class="mn">'+esc(NM(e))+'</div><div class="mv">'+(showVal?esc(cmpFmt(cmpVal(e))):'?')+'</div>';
}
function renderLadder(){
  state.mgLock=false;
  state.ladderNext=ladderPickNext();
  const cur=state.ladderCur, nxt=state.ladderNext, cv=cmpVal(cur);
  el.mgQ.innerHTML=EN()
    ?('Is <b>'+esc(NM(nxt))+'</b>’s '+cmpLabel()+' <b>higher</b> or <b>lower</b> than <b>'+esc(NM(cur))+'</b> ('+cmpFmt(cv)+')?')
    :('<b>'+esc(NM(nxt))+'</b>의 '+cmpLabel()+' — <b>'+esc(NM(cur))+'</b> ('+cmpFmt(cv)+')보다 더 클까요, 작을까요?');
  el.mgBody.innerHTML='<div class="mg-ladder">'
    +'<div class="mg-card cur">'+ladderCardHTML(cur,true,LT('아는 나라','Known'))+'</div>'
    +'<div class="mg-arrow">vs</div>'
    +'<div class="mg-card nxt">'+ladderCardHTML(nxt,false,LT('맞힐 나라','Guess'))+'</div></div>'
    +'<div class="mg-btns"><button data-hl="higher">▲ '+LT('더 큼','Higher')+'</button><button data-hl="lower">▼ '+LT('더 작음','Lower')+'</button></div>';
  el.mgBody.querySelectorAll('.mg-btns button').forEach(b=>b.onclick=()=>ladderGuess(b.dataset.hl));
}
function ladderGuess(choice){
  if(state.ended||state.mgLock||!state.ladderNext) return;
  if(!state.running){ state.running=true; startTicker(); }
  state.mgLock=true;
  const cv=cmpVal(state.ladderCur), nv=cmpVal(state.ladderNext);
  const correct=(choice==='higher')?(nv>cv):(nv<cv);
  const nxtCard=el.mgBody.querySelector('.mg-card.nxt');
  // reveal the value plus an explicit ▲/▼ showing how it actually compares
  nxtCard.querySelector('.mv').innerHTML=esc(cmpFmt(nv))+' <span class="mg-rel '+(nv>cv?'up':'down')+'">'+(nv>cv?'▲':'▼')+'</span>';
  nxtCard.classList.add(correct?'win':'lose');
  if(correct){
    state.ladderStreak++; state.score=state.ladderStreak; updateScore();
    celebrate(true,LT('연속 '+state.ladderStreak+'!','Streak '+state.ladderStreak+'!'));
    el.mgFact.textContent=LT('정답! 계속 이어가요.','Correct! Keep going.');
    const g=state.gen; setTimeout(()=>{ if(state.gen!==g||state.ended||state.mode!=='ladder')return; state.ladderCur=state.ladderNext; renderLadder(); },900);
  } else {
    celebrate(false,LT('끝!','Game over!'));
    el.mgFact.innerHTML=LT('아쉬워요 — 최종 연속 <b>'+state.ladderStreak+'</b>','Nope — final streak <b>'+state.ladderStreak+'</b>');
    const g=state.gen; setTimeout(()=>{ if(state.gen!==g||state.ended||state.mode!=='ladder')return; endLadder(); },1200);
  }
}
function endLadder(){
  if(state.ended) return; state.ended=true; state.running=false; stopTicker();
  const best=state.ladderStreak;
  showOverlay(LT('연속 기록','Streak'),best,EN()?('You chained '+best+' in a row.'):(best+'개를 연속으로 맞혔어요.'));
  const r=recordResult('ladder',best); const sfx=resultSuffix(r,best); if(sfx){ const s=$('ovsub'); s.textContent+=sfx; }
  renderOverlayExtras('ladder',best); if(r&&r.tierUp) playTierCutscene('game', modeName('ladder'), r.tierUp);
}

/* ---- Estimate (population / area) ---- */
function estUnit(){ return state.estMetric==='area'
  ? {mul:1e3, kl:'면적 (천 km² 단위 · 예: 100)', el:'Area (in thousand km² · e.g. 100)', fmt:v=>fmtArea(v)}
  : {mul:1e6, kl:'인구 (백만 명 단위 · 예: 51)', el:'Population (in millions · e.g. 51)', fmt:v=>fmtPop(v)}; }
function startEstimate(){
  mgShow(); el.timer.classList.remove('hidden');
  state.score=0; state.mgLock=false; state.estRound=0; state.estTotal=8;
  state.estPool=mgPool(4).filter(e=>e.st&&e.st[state.estMetric]!=null);
  if(state.estPool.length<4){ el.mgQ.textContent=LT('이 지역은 자료가 부족해요. 다른 지역을 골라 주세요.','Not enough data here — pick another region.'); el.mgBody.innerHTML=''; el.mgFact.textContent=''; return; }
  state.estQueue=shuffleArr(state.estPool.slice());
  updateScore(); updateTimerDisplay(); el.mgFact.textContent='';
  nextEstimate();
}
function nextEstimate(){
  state.mgLock=false;
  if(!state.estQueue.length) state.estQueue=shuffleArr(state.estPool.slice());
  state.estTarget=state.estQueue.pop();
  const u=estUnit(), t=state.estTarget;
  el.mgQ.innerHTML=(EN()?('Round '+(state.estRound+1)+' / '+state.estTotal):((state.estRound+1)+' / '+state.estTotal+' 라운드'));
  el.mgBody.innerHTML='<div class="mg-card" style="cursor:default"><div class="mf">'+flagEmoji(t.i2)+'</div><div class="mn">'+esc(NM(t))+'</div></div>'
    +'<div class="mg-est"><div class="mg-sub">'+esc(LT(u.kl,u.el))+'</div>'
    +'<input id="mg-in" type="number" inputmode="decimal" min="0" step="any" placeholder="'+LT('숫자 입력','enter a number')+'">'
    +'<button class="btn solid" id="mg-go">'+LT('제출','Submit')+'</button></div>';
  const inp=el.mgBody.querySelector('#mg-in');
  el.mgBody.querySelector('#mg-go').onclick=estSubmit;
  inp.onkeydown=e=>{ if(e.key==='Enter') estSubmit(); };
  inp.focus();
}
function estScore(ratio){ // ratio >=1 (bigger/smaller). closer to 1 = better
  if(ratio<=1.1)return 100; if(ratio<=1.25)return 80; if(ratio<=1.5)return 60; if(ratio<=2)return 40; if(ratio<=3)return 20; if(ratio<=5)return 10; return 0;
}
function estSubmit(){
  if(state.ended||state.mgLock) return;
  const inp=el.mgBody.querySelector('#mg-in'); if(!inp) return;
  const raw=parseFloat(inp.value); if(isNaN(raw)||raw<0){ inp.focus(); return; }
  if(!state.running){ state.running=true; startTicker(); }
  state.mgLock=true;
  const u=estUnit(), t=state.estTarget, truth=t.st[state.estMetric], guess=raw*u.mul;
  const ratio=guess<=0?1e9:Math.max(guess,truth)/Math.min(guess,truth);
  const pts=estScore(ratio); state.score+=pts; updateScore();
  const good=pts>=60;
  celebrate(good,'+'+pts);
  el.mgFact.innerHTML=(EN()?('Actual: <b>'+u.fmt(truth)+'</b> · you guessed '+u.fmt(guess)+' · +'+pts+' pts')
    :('실제: <b>'+u.fmt(truth)+'</b> · 추정 '+u.fmt(guess)+' · +'+pts+'점'));
  state.estRound++;
  const g=state.gen;
  setTimeout(()=>{ if(state.gen!==g||state.ended||state.mode!=='estimate')return;
    if(state.estRound>=state.estTotal) endEstimate(); else nextEstimate(); },1500);
}
function endEstimate(){
  if(state.ended) return; state.ended=true; state.running=false; stopTicker();
  showOverlay(LT('어림 점수','Estimate score'),state.score,EN()?('Over '+state.estTotal+' rounds.'):(state.estTotal+'라운드 합계.'));
  const r=recordResult('estimate',state.score); const sfx=resultSuffix(r,state.score); if(sfx){ const s=$('ovsub'); s.textContent+=sfx; }
  renderOverlayExtras('estimate',state.score); if(r&&r.tierUp) playTierCutscene('game', modeName('estimate'), r.tierUp);
}

/* ---- Odd One Out ---- */
const ODD_RULES=[
  {k:'continent', q:['다른 대륙에 있는 나라를 고르세요.','Pick the country on a different continent.'], key:e=>e.c},
  {k:'region',    q:['다른 지역(권역)에 속한 나라를 고르세요.','Pick the country in a different region.'], key:e=>(SUB_OF[e.i2]||e.c)},
  {k:'coast',     q:['바다 접근이 다른 하나를 고르세요.','Pick the odd one by coastline (land-locked vs coastal).'], key:e=>(e.st&&e.st.land===1)?'land':'coast'},
];
function startOddone(){
  mgShow();
  el.timer.classList.toggle('hidden',state.vs);
  state.score=0; state.mgLock=false;
  state.oddPool=allEntries.filter(e=>e.sov&&e.st&&e.c);
  if(state.vs){ vsInit(); el.mgFact.textContent=LT('1 대 1 · 번갈아 한 문제씩. 정답 +1점.','1v1 · take turns. +1 per correct.'); }
  else el.mgFact.textContent=LT('첫 선택에 '+state.duration+'초 타이머가 시작돼요.','the '+state.duration+'s timer starts on your first pick.');
  updateScore(); updateTimerDisplay();
  nextOddone();
}
function buildOddRound(){
  // try rules until one yields a clean 3+1 split
  const rules=shuffleArr(ODD_RULES.slice());
  for(const rule of rules){
    const groups={}; state.oddPool.forEach(e=>{ const k=rule.key(e); (groups[k]=groups[k]||[]).push(e); });
    const keys=Object.keys(groups).filter(k=>groups[k].length>=3);
    if(!keys.length) continue;
    const famKey=rndOf(keys);
    const others=state.oddPool.filter(e=>rule.key(e)!==famKey);
    if(others.length<1) continue;
    const fam=shuffleArr(groups[famKey].slice()).slice(0,3);
    const odd=rndOf(others);
    return {rule, fam, odd, cards:shuffleArr(fam.concat([odd]))};
  }
  return null;
}
function nextOddone(){
  state.mgLock=false;
  const rd=buildOddRound();
  if(!rd){ el.mgQ.textContent=LT('문제를 만들 수 없어요.','Could not build a round.'); return; }
  state.oddRound=rd;
  el.mgQ.textContent=LT(rd.rule.q[0],rd.rule.q[1]);
  el.mgBody.innerHTML='<div class="mg-grid"></div>';
  const grid=el.mgBody.querySelector('.mg-grid');
  rd.cards.forEach(e=>{ const b=document.createElement('button'); b.className='mg-card';
    b.innerHTML='<div class="mf">'+flagEmoji(e.i2)+'</div><div class="mn">'+esc(NM(e))+'</div>';
    b.onclick=()=>oddClick(e,b); grid.appendChild(b); });
}
function oddClick(e,btn){
  if(state.ended||state.mgLock||!state.oddRound) return;
  if(!state.vs && !state.running){ state.running=true; startTicker(); }
  state.mgLock=true;
  const rd=state.oddRound, correct=e===rd.odd;
  const grid=el.mgBody.querySelector('.mg-grid'); const kids=[...grid.children];
  kids.forEach((k,i)=>{ const ce=rd.cards[i]; if(ce===rd.odd) k.classList.add('win'); else if(ce===e) k.classList.add('lose'); else k.classList.add('dim'); });
  if(correct){ if(state.vs) vsAward(1); else { state.score++; updateScore(); } celebrate(true,LT('정답!','Correct!')); }
  else { celebrate(false,LT('오답','Nope')); }
  el.mgFact.innerHTML=EN()?('The odd one was <b>'+esc(NM(rd.odd))+'</b>.'):('정답은 <b>'+esc(NM(rd.odd))+'</b> 였어요.');
  if(state.vs){ vsAfterAnswerMG(correct); return; }
  const g=state.gen; setTimeout(()=>{ if(state.gen!==g||state.ended||state.mode!=='oddone')return; nextOddone(); },1050);
}
// odd-one-out 1v1 turn handoff (mirrors vsAfterAnswer but re-renders the panel)
function vsAfterAnswerMG(correct){
  state.vsDone++; const g=state.gen;
  setTimeout(()=>{ if(state.gen!==g||state.ended||!state.vs) return;
    if(state.vsDone>=state.vsRounds){ endVs(); return; }
    state.turn^=1; updateVsBar(); nextOddone();
  }, correct?900:1150);
}

/* ---- Border Chain (uses the map + text input) ---- */
function chainNeighbors(e){
  // resolve this country's neighbor names to entry ids, restricted to the active pool
  const out=new Set(); const names=(e.st&&(e.st.nb||[]))||[];
  names.forEach(nm=>{ const t=lookup.get(norm(nm)); if(t&&state.chainSet&&state.chainSet.has(t.id)) out.add(t.id); });
  return out;
}
function chainLiveNeighbors(id){ const e=idMap.get(id); if(!e) return []; return [...chainNeighbors(e)].filter(nid=>!state.chainUsed.has(nid)); }
function startChain(){
  el.minigame.classList.remove('show');
  el.prompt.classList.remove('hidden'); el.feedback.classList.remove('hidden');
  el.timer.classList.remove('hidden'); resetView();
  let pool=regionEntries(state.region).filter(e=>e.st); if(pool.length<3) pool=allEntries.filter(e=>e.sov&&e.st);
  state.chainSet=new Set(pool.map(e=>e.id));
  // seeds that actually have at least one neighbor inside the pool
  const seeds=pool.filter(e=>chainNeighbors(e).size>0);
  if(!seeds.length){ el.prompt.innerHTML=LT('이 지역은 육지 국경이 거의 없어 사슬을 만들 수 없어요. 다른 지역을 골라 주세요.','This region has too few land borders for a chain — pick another region.'); setFeedback('','info'); state.ended=true; return; }
  // prefer a well-connected starting country so the chain has room to grow
  const wellConnected=seeds.filter(e=>chainNeighbors(e).size>=3);
  const seedPool=wellConnected.length?wellConnected:seeds;
  state.chainUsed=new Set(); state.chainLen=1;
  state.chainCur=rndOf(seedPool).id; state.chainUsed.add(state.chainCur);
  const cur=idMap.get(state.chainCur);
  cur.el.classList.add('found'); cur.el.classList.add('target'); cur.el.parentNode.appendChild(cur.el); focusEntry(cur,2.2);
  updateScore(); updateTimerDisplay();
  chainPrompt(); el.q.value=''; el.q.focus();
}
function chainPrompt(){
  const cur=idMap.get(state.chainCur); const live=chainLiveNeighbors(state.chainCur).length;
  el.prompt.innerHTML=EN()?('Name a country bordering <b>'+esc(NM(cur))+'</b>. <span style="color:var(--muted)">('+live+' left)</span>')
    :('<b>'+esc(NM(cur))+'</b> 와(과) 국경을 맞댄 나라를 입력하세요. <span style="color:var(--muted)">(남은 이웃 '+live+')</span>');
  setFeedback(EN()?('Chain length: '+state.chainLen):('사슬 길이: '+state.chainLen),'info');
}
function chainGuess(raw){
  const entry=resolveName(raw); if(!entry){ notFound(raw); return; }
  if(state.chainUsed.has(entry.id)){ setFeedback(LT('이미 사슬에 있는 나라예요: ','Already in the chain: ')+NM(entry),'info'); shakeInput(); return; }
  if(!state.chainSet.has(entry.id)){ setFeedback(EN()?(NM(entry)+' is not in this region.'):(NM(entry)+' 은(는) 이 지역이 아니에요.'),'no','x'); shakeInput(); return; }
  const nb=chainNeighbors(idMap.get(state.chainCur));
  if(!nb.has(entry.id)){ setFeedback(EN()?(NM(entry)+' does not border '+NM(idMap.get(state.chainCur))+'.'):(NM(entry)+' 은(는) '+NM(idMap.get(state.chainCur))+' 와(과) 국경이 없어요.'),'no','x'); shakeInput(); return; }
  // valid link
  if(!state.running){ state.running=true; startTicker(); }
  const prev=idMap.get(state.chainCur); prev.el.classList.remove('target');
  state.chainUsed.add(entry.id); state.chainLen++; state.chainCur=entry.id;
  markFound(entry,true); entry.el.classList.add('target'); entry.el.parentNode.appendChild(entry.el); focusEntry(entry,2.2);
  updateScore(); el.q.value='';
  celebrate(true,'+1');
  if(chainLiveNeighbors(state.chainCur).length===0){ // dead end
    setFeedback(EN()?('Dead end! Final chain: '+state.chainLen):('막다른 길! 최종 사슬: '+state.chainLen),'ok','check');
    later(endChain,1200); return;
  }
  chainPrompt();
}
function endChain(){
  if(state.ended) return; state.ended=true; state.running=false; stopTicker(); el.q.disabled=true;
  showOverlay(LT('사슬 길이','Chain length'),state.chainLen,EN()?('You linked '+state.chainLen+' bordering countries.'):('국경을 맞댄 나라 '+state.chainLen+'개를 이었어요.'));
  const r=recordResult('chain',state.chainLen); const sfx=resultSuffix(r,state.chainLen); if(sfx){ const s=$('ovsub'); s.textContent+=sfx; }
  renderOverlayExtras('chain',state.chainLen); if(r&&r.tierUp) playTierCutscene('game', modeName('chain'), r.tierUp);
}

function renderCodexGrid(query){

    return norm(e.ko).includes(q)||norm(e.en).includes(q)||(e.i2&&norm(e.i2).includes(q))||(e.al||[]).some(a=>norm(a).includes(q)); });
  el.cxCount.textContent=EN()?(list.length+' countries'):(list.length+'개');
  el.cxGrid.innerHTML='';
  const frag=document.createDocumentFragment();
  list.forEach(e=>{ const b=document.createElement('button'); b.className='cx-item';
    b.innerHTML='<span class="cxf">'+flagEmoji(e.i2)+'</span><span class="cxn"><b>'+esc(NM(e))+'</b><span>'+esc(regionOf(e))+'</span></span>';
    b.onclick=()=>showCodexDetail(e); frag.appendChild(b); });

  if(!list.length){ const d=document.createElement('div'); d.style.cssText='color:var(--muted);padding:20px;grid-column:1/-1;text-align:center'; d.textContent=LT('검색 결과가 없어요.','No matches.'); el.cxGrid.appendChild(d); }
}
function cxFact(k,v){ return v?('<div class="cxd-fact"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>'):''; }
function showCodexDetail(e){
  const s=e.st||{}, en=EN(), HF=(e.i2&&HISTFACTS[e.i2])||null;
  el.cxGrid.style.display='none'; el.cxDetail.hidden=false; el.cxDetail.scrollTop=0;
  const nbs=en?(s.nbe||[]):(s.nb||[]);
  let facts='';
  facts+=cxFact(LT('지역','Region'),regionOf(e));
  facts+=cxFact(LT('수도','Capital'), en?(s.cape||''):(s.cap||''));
  facts+=cxFact(LT('인구','Population'), s.pop?fmtPop(s.pop):'');
  facts+=cxFact(LT('면적','Area'), s.area?(fmtArea(s.area)+(e.areaRank?(' · '+LT('세계 '+e.areaRank+'위','#'+e.areaRank)):'')):'');
  facts+=cxFact(LT('인구 밀도','Density'), s.dens?(fmtInt(s.dens)+LT(' 명/km²',' /km²')):'');
  facts+=cxFact(LT('정부 형태','Government'), en?(s.gove||''):(s.gov||''));

// Mistake Review — spaced pool of weak/unseen countries (weakest first)
function reviewPool(){
  const u=curUser(); const cc=(u&&u.stats&&u.stats.cc)||{};
  const named=allEntries.filter(e=>e.sov&&!e.isMarker);
  const seen=named.filter(e=>cc[e.i2]&&(cc[e.i2].r+cc[e.i2].w)>0);
  seen.sort((a,b)=>{ const x=cc[a.i2],y=cc[b.i2]; return (x.box-y.box)||(y.w-x.w); });
  const weak=seen.filter(e=>masteryLevel(e.i2)<3);
  if(weak.length>=6) return weak.slice(0,40);
  const unseen=shuffleArr(named.filter(e=>!cc[e.i2]||(cc[e.i2].r+cc[e.i2].w)===0));
  return weak.concat(unseen).slice(0,Math.max(12,weak.length+12));
}
function startReview(){
  el.timer.classList.remove('hidden');
  if(!curUser()){ needLoginMsg(); return; }
  const pool=reviewPool();
  if(!pool.length){ el.prompt.innerHTML=LT('복습할 나라가 없어요. 먼저 퀴즈를 풀어 보세요!','Nothing to review yet — play some quizzes first!'); setFeedback('','info'); return; }

}
// Daily Challenge — a deterministic 10-question set that changes each UTC day
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dailyDateStr(d){ d=d||new Date(); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function yesterdayStr(){ const d=new Date(); d.setUTCDate(d.getUTCDate()-1); return dailyDateStr(d); }
function dailySeedNum(){ const d=new Date(); return (d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate())>>>0; }
function startDaily(){
  el.timer.classList.remove('hidden'); state.countUp=true;
  const rng=mulberry32(dailySeedNum());
  const arr=allEntries.filter(e=>e.sov&&!e.isMarker).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  state.dailyQueue=arr.slice(0,10); state.dailyTotal=10; state.dailyIdx=0; state.score=0; state.found=new Set();
  const u=curUser(), doneToday=u&&u.stats&&u.stats.dailyDate===dailyDateStr();
  updateScore();
  setFeedback(doneToday?LT('오늘은 이미 완료했어요 (최고 '+(u.stats.dailyBest||0)+'/10). 다시 도전할 수 있어요!','Already done today (best '+(u.stats.dailyBest||0)+'/10). Play again anytime!'):LT('첫 답을 입력하면 시작돼요. 전 세계가 같은 10문제!','starts on your first answer — everyone gets the same 10!'),'info');
  nextDailyTarget(); el.q.focus();
}
function nextDailyTarget(){
  if(state.dailyIdx>=state.dailyQueue.length){ endDaily(); return; }
  state.target=state.dailyQueue[state.dailyIdx++];
  allEntries.forEach(e=>e.el.classList.remove('target'));
  state.target.el.classList.remove('found','pop','p1cap','p2cap'); state.target.el.classList.add('target'); focusEntry(state.target,1.6);
  el.prompt.innerHTML=LT('오늘의 도전 '+state.dailyIdx+'/'+state.dailyTotal+' · 금색 나라의 이름을 입력하세요.','Daily '+state.dailyIdx+'/'+state.dailyTotal+' · type the gold country.');
}
function endDaily(){
  if(state.ended) return; state.ended=true; state.running=false; stopTicker(); el.q.disabled=true;
  showOverlay(LT('오늘의 도전','Daily challenge'), state.score+' / '+state.dailyTotal, EN()?'Come back tomorrow for a new set!':'내일 새로운 문제로 다시 만나요!');
  const u=curUser();
  if(u){ u.stats=u.stats||{games:0,best:{},plays:{},points:0}; const today=dailyDateStr();
    if(u.stats.dailyDate!==today){ u.stats.dailyStreak=(u.stats.dailyDate===yesterdayStr())?((u.stats.dailyStreak||0)+1):1;
      u.stats.dailyDate=today; u.stats.dailyBest=state.score; }
    else if(state.score>(u.stats.dailyBest||0)){ u.stats.dailyBest=state.score; }
    accSave();
    const s=$('ovsub'); s.textContent+=LT(' · 🔥 연속 '+u.stats.dailyStreak+'일',' · 🔥 '+u.stats.dailyStreak+'-day streak');
  }
  const r=recordResult('daily',state.score);
  renderOverlayExtras('daily',state.score); if(r&&r.tierUp) playTierCutscene('game', modeName('daily'), r.tierUp);
}

function funMatch(raw, fr){ const g=norm(raw); if(!g) return false;
  return fr.ans.some(a=>{ const na=norm(a); return na.length>=2 && (g===na || (na.length>=4 && g.includes(na)) || (g.length>=4 && na.includes(g))); }); }
function buildRankedMatch(base, elo, u, placement){
  let pool=allEntries.filter(e=>e.sov&&!e.isMarker);
  if(base==='flag') pool=pool.filter(e=>e.i2);
  else if(base==='capcountry') pool=pool.filter(e=>e.st&&(e.st.cap||e.st.cape));
  else if(base==='silhouette') pool=pool.filter(e=>e.d);
  else pool=pool.filter(e=>e.i2);
  pool.forEach(e=>{ if(e._d==null) e._d=countryDifficulty(e); });
  if(placement){ // spread across difficulty bands, but pick a random country in each band → a different test per person/attempt
    const sorted=pool.slice().sort((a,b)=>a._d-b._d), n=sorted.length, q=[], used=new Set();
    for(let i=0;i<RANKED_N;i++){ const lo=Math.floor(i/RANKED_N*n), hi=Math.max(lo+1,Math.floor((i+1)/RANKED_N*n));
      let e=null; for(let tries=0;tries<8;tries++){ const cand=sorted[Math.min(n-1,lo+Math.floor(Math.random()*(hi-lo)))]; if(!used.has(cand.id)){ e=cand; break; } }
      if(!e) e=sorted[Math.min(n-1,lo)]; used.add(e.id); q.push({entry:e,fever:false}); }
    return shuffleArr(q);
  }
  // difficulty window scales with elo (obscurer countries as you climb)
  const near=pool.slice().sort((a,b)=>Math.abs(a._d-elo)-Math.abs(b._d-elo)).slice(0,55);
  const main=shuffleArr(near);
  // fever: re-test the player's most-missed countries
  const cc=(u&&u.stats&&u.stats.cc)||{};
  const weak=pool.filter(e=>cc[e.i2]&&cc[e.i2].w>0&&cc[e.i2].w>=cc[e.i2].r)
    .sort((a,b)=>(cc[b.i2].w-cc[b.i2].r)-(cc[a.i2].w-cc[a.i2].r));
  const q=[], used=new Set();
  weak.slice(0,4).forEach(e=>{ q.push({entry:e,fever:true}); used.add(e.id); });
  for(const e of main){ if(q.length>=RANKED_N) break; if(!used.has(e.id)){ q.push({entry:e,fever:false}); used.add(e.id); } }
  const out=shuffleArr(q).slice(0,RANKED_N);
  if(FUN_ROUNDS.length && Math.random()<0.15){ const fr=FUN_ROUNDS[Math.floor(Math.random()*FUN_ROUNDS.length)]; out[Math.floor(Math.random()*out.length)]={fun:fr}; }   // slim chance of a bonus round
  return out;
}

function endRanked(quit){

  let deltaRaw=state.rankedDelta;

  let big, sub, cut=null;

    let old=(u.stats.elo!=null)?u.stats.elo:state.rankedElo0, nw;
    if(placement){ const rate=state.rankedHit/Math.max(1,state.rankedQueue.length); nw=Math.round(Math.max(700,Math.min(2200, 800+rate*1400))); u.stats.placed=true; }

    u.stats.games=(u.stats.games||0)+1; u.stats.points=(u.stats.points||0)+state.rankedHit; u.stats.rankedPending=null;
    addXP(u, state.rankedHit*4 + (placement?20:0));
    unlockTierCosmetics(nw); accSave(); renderProfile(); if(typeof checkAchievements==='function') checkAchievements(); if(typeof maybeUnlockTheme==='function') maybeUnlockTheme();
    const t=rankTierOf(nw), nt=rankNextTier(nw), promoted=(!placement && rankTierOf(old)!==t && nw>old);
    big=state.rankedHit+' / '+state.rankedQueue.length;
    if(placement){ sub=LT('배치 완료! 시작 등급: ','Placed! Starting rank: ')+t.ic+' '+LT(t.ko,t.en)+' '+nw; cut={ic:t.ic,label:LT(t.ko,t.en),sub:LT('배치 완료','Placement complete')}; }
    else{ const d=Math.round(deltaRaw); sub=(d>=0?('ELO +'+d):('ELO '+d))+' · '+t.ic+' '+LT(t.ko,t.en)+' '+nw+(nt?(' · '+LT('다음까지 ','to next ')+(nt.elo-nw)):'')+(promoted?LT(' · ⬆️ 승급!',' · ⬆️ Promoted!'):'')+(quit?LT(' · ⚠️ 중도 포기',' · ⚠️ abandoned'):'')+(state.rankedCheated?LT(' · 🚫 탭 이탈',' · 🚫 left tab'):'');

  } else { big=state.rankedHit+' / '+state.rankedQueue.length; sub=LT('로그인해야 랭크가 저장돼요.','Log in to save your rank.'); }
  showOverlay(quit?LT('랭크 포기','Match abandoned'):(placement?LT('배치고사 결과','Placement result'):LT('랭크전 결과','Ranked result')), big, sub);
  renderOverlayExtras('ranked', state.rankedHit);

  el.fall.classList.add('show'); el.timer.classList.add('hidden');
  state.score=0; state.fallLives=3; state.fallItems=[]; state.fallT=0; state.fallLast=0; state.fallSpawn=350; state.running=true;
  state.fallPool=allEntries.filter(e=>e.sov&&e.i2&&!e.isMarker);

  state.fallRAF=requestAnimationFrame(fallLoop);
}
function spawnFall(){
  const area=el.fallArea, W=area.clientWidth||600;
  const active=new Set(state.fallItems.map(it=>it.entry.id));
  let e=null,tries=0; do{ e=state.fallPool[Math.floor(Math.random()*state.fallPool.length)]; tries++; }while(active.has(e.id)&&tries<20);
  const d=document.createElement('div'); d.className='fall-item'; d.textContent=flagEmoji(e.i2); area.appendChild(d);
  const fw=d.offsetWidth||48, x=Math.max(4,Math.min(W-fw-4, Math.random()*(W-fw-8)));
  const it={entry:e,x,y:-52,speed:0.045+Math.min(0.11,state.fallT*0.0000013),el:d};
  d.style.transform='translate('+x+'px,'+it.y+'px)'; state.fallItems.push(it);
}
function fallLoop(ts){
  if(state.mode!=='fall'||state.ended){ return; }
  const dt=Math.min(48, ts-(state.fallLast||ts)); state.fallLast=ts; state.fallT+=dt;
  state.fallSpawn-=dt;
  if(state.fallSpawn<=0){ spawnFall(); state.fallSpawn=Math.max(620, 1650 - state.fallT*0.055); }
  const H=(el.fallArea.clientHeight||500)-48;
  for(const it of state.fallItems.slice()){
    it.y += it.speed*dt;
    if(it.y>=H){ it.el.remove(); state.fallItems.splice(state.fallItems.indexOf(it),1); state.fallLives--;
      el.fall.classList.remove('fall-flash'); void el.fall.offsetWidth; el.fall.classList.add('fall-flash');
      celebrate(false,LT('놓침!','Missed!')); updateFallHud();
      if(state.fallLives<=0){ endFall(); return; }
    } else it.el.style.transform='translate('+it.x+'px,'+it.y+'px)';
  }
  state.fallRAF=requestAnimationFrame(fallLoop);
}
function fallGuess(raw){
  const entry=resolveName(raw); if(!entry){ notFound(raw); return; }

  const bel=best.el; bel.classList.add('pop'); setTimeout(()=>{ if(bel.parentNode) bel.remove(); },300);
  state.fallItems.splice(state.fallItems.indexOf(best),1);
  state.score++; trackCountry(entry,true); updateScore(); updateFallHud();

  if(state.symLocked||state.mode!=='sym') return; state.symLocked=true;

function fillWarOptions(sel){
  sel.innerHTML='';
  const all=document.createElement('option'); all.value='all'; all.textContent=LT('전체 (랜덤)','All (random)'); sel.appendChild(all);
  [...new Set(TRIVIA.wars.map(w=>w.cat))].forEach(cat=>{
    const catName=EN()?(CAT_EN[cat]||cat):cat;
    const og=document.createElement('optgroup'); og.label=catName;
    const co=document.createElement('option'); co.value='cat:'+cat; co.textContent=catName+LT(' 전체',' (all)'); og.appendChild(co);
    TRIVIA.wars.filter(w=>w.cat===cat).forEach(w=>{ const o=document.createElement('option'); o.value='war:'+w.id; o.textContent=EN()?w.ne:w.name; og.appendChild(o); });
    sel.appendChild(og);
  });
}
function buildWarSelect(){ if(!el.warsel.children.length) fillWarOptions(el.warsel); }
function triviaQuestions(sel){
  let wars=TRIVIA.wars;
  if(sel.indexOf('war:')===0) wars=wars.filter(w=>w.id===sel.slice(4));
  else if(sel.indexOf('cat:')===0) wars=wars.filter(w=>w.cat===sel.slice(4));
  else if(state.triviaCats) wars=wars.filter(w=>state.triviaCats.has(w.cat));   // honor hidden categories on "all random"
  const en=EN(); const qs=[]; wars.forEach(w=>w.q.forEach(q=>qs.push({war:en?w.ne:w.name,q:en?q.qe:q.q,o:en?q.oe:q.o,a:q.a}))); return qs;
}
function allCats(){ return [...new Set(TRIVIA.wars.map(w=>w.cat))]; }
let tvClock=null;
function stopTrivia(){ if(tvClock){clearInterval(tvClock);tvClock=null;} }
function tvStartClock(sec){
  stopTrivia(); const t0=Date.now(); el.tvBar.style.width='100%';
  tvClock=setInterval(()=>{ const e=(Date.now()-t0)/1000, f=Math.max(0,1-e/sec); el.tvBar.style.width=(f*100)+'%';
    if(e>=sec){ stopTrivia(); if(!state.triviaLocked) answerTrivia(-1); } },90);
}
function startTrivia(){
  el.studypanel.classList.add('hidden'); el.trivia.classList.add('show'); buildWarSelect(); el.warsel.value=state.triviaSel;
  el.prompt.classList.add('hidden'); el.feedback.classList.add('hidden');   // trivia panel is full-screen
  state.score=0; state.triviaIdx=0; state.ended=false;
  let qs=shuffleArr(triviaQuestions(state.triviaSel)); if(qs.length>state.triviaCount) qs=qs.slice(0,state.triviaCount);
  state.triviaQueue=qs; updateScore();
  if(!qs.length){ el.tvQ.textContent=LT('문제가 없어요.','No questions.'); el.tvOpts.innerHTML=''; return; }
  showQuestion();
}
function showQuestion(){
  state.triviaLocked=false;
  const item=state.triviaQueue[state.triviaIdx];
  el.tvWar.textContent=item.war;
  el.tvProg.textContent=(state.triviaIdx+1)+' / '+state.triviaQueue.length+' · '+LT('점수 ','Score ')+state.score;
  el.tvQ.textContent=item.q; el.tvFact.textContent='';
  el.tvOpts.className='tv-opts'; el.tvOpts.innerHTML='';
  const L=['A','B','C','D'];
  item.o.forEach((opt,i)=>{ const btn=document.createElement('button'); btn.className='tv-opt';
    btn.innerHTML='<span class="k">'+L[i]+'</span><span class="ot"></span><kbd>'+(i+1)+'</kbd>'; btn.querySelector('.ot').textContent=opt;
    btn.onclick=()=>answerTrivia(i); el.tvOpts.appendChild(btn); });
  tvStartClock(18);
}
function answerTrivia(i){
  if(state.triviaLocked) return; state.triviaLocked=true; stopTrivia();
  const item=state.triviaQueue[state.triviaIdx], opts=el.tvOpts.children;
  el.tvOpts.classList.add('locked');
  opts[item.a].classList.add('correct');
  if(i>=0 && i!==item.a) opts[i].classList.add('wrong');
  const correct=(i===item.a); if(correct){ state.score++; updateScore(); }
  celebrate(correct, correct?LT('정답!','Correct!'):(i<0?LT('시간 초과','Time up'):LT('오답','Wrong')));
  el.tvFact.textContent = correct ? LT('정답! 🎉','Correct! 🎉')
    : (i<0?LT('⏱ 시간 초과 — ','⏱ Time up — '):LT('❌ 아쉬워요 — ','❌ Not quite — '))+LT('정답은 ','Answer: ')+String.fromCharCode(65+item.a)+'. '+item.o[item.a];
  el.tvProg.textContent=(state.triviaIdx+1)+' / '+state.triviaQueue.length+' · '+LT('점수 ','Score ')+state.score;
  const g=state.gen; setTimeout(()=>{ if(state.gen!==g||state.mode!=='trivia'||state.ended) return;
    state.triviaIdx++; if(state.triviaIdx>=state.triviaQueue.length) endTrivia(); else showQuestion(); },1600);
}
function endTrivia(){
  stopTrivia(); state.ended=true; const n=state.triviaQueue.length, pct=Math.round(state.score/n*100);
  showOverlay(pct>=80?LT('🏆 명장!','🏆 Master!'):pct>=50?LT('좋아요!','Nice!'):LT('끝!','Done!'), state.score+' / '+n, LT('전쟁 트리비아 · ','War Trivia · ')+pct+LT('점',''));
  const r=recordResult('trivia',state.score);
  if(r&&r.isBest&&state.score>0){ const s=$('ovsub'); s.textContent=s.textContent+LT(' · 🏆 최고 기록!',' · 🏆 New best!'); }
}
el.warsel.onchange=()=>{ state.triviaSel=el.warsel.value; if(state.mode==='trivia') resetMode(); };
// trivia keyboard shortcuts: 1-4 or A-D to answer
document.addEventListener('keydown',e=>{
  if(state.mode!=='trivia'||!el.trivia.classList.contains('show')||state.triviaLocked||state.ended) return;
  const item=state.triviaQueue[state.triviaIdx]; if(!item) return;
  let i=-1;
  if(e.key>='1'&&e.key<='9') i=+e.key-1;
  else { const k=e.key.toLowerCase(); if(k>='a'&&k<='d') i='abcd'.indexOf(k); }
  if(i>=0 && i<item.o.length){ e.preventDefault(); answerTrivia(i); }
});

function notFound(raw){ const exact=state.ranked||SET.lenient==='exact';
  setFeedback('“'+raw+'” — '+(exact?LT('정확한 나라 이름을 입력하세요 (약자·오타 불가).','type the exact country name (no codes/typos).'):LT('찾을 수 없어요. 이름이나 약자를 확인해 주세요.','not found. Check the name or code.')),'no','x'); shakeInput(); }
// resolve a typed guess to an entry, honoring the leniency setting (Ranked always = exact)
function nameMode(){ return state.ranked ? 'exact' : (SET.lenient||'normal'); }
function resolveName(raw){
  const mode=nameMode();
  if(mode==='exact') return exactIndex.get(norm(raw))||null;
  const hit=lookup.get(norm(raw)); if(hit) return hit;
  if(mode==='lenient') return looseFind(raw);
  return null;
}

/* ===== lenient / fuzzy country matching (used for voice, which is imperfect) ===== */
function editDist(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); }
    [prev,cur]=[cur,prev]; }
  return prev[n]; }
function looseFind(raw){
  const q=norm(raw); if(!q) return null;
  if(lookup.has(q)) return lookup.get(q);
  let best=null,bestD=1e9;
  for(const e of allEntries){
    const cand=[norm(e.ko),norm(e.en)]; if(e.i2)cand.push(norm(e.i2)); if(e.i3)cand.push(norm(e.i3));
    (e.al||[]).forEach(a=>cand.push(norm(a)));
    for(const c of cand){ if(!c||c.length<2) continue;
      if(c===q) return e;
      if((q.length>=4&&c.includes(q))||(c.length>=4&&q.includes(c))) return e;   // "south korea" ↔ "korea"
      const d=editDist(q,c), tol=Math.max(1,Math.floor(Math.max(q.length,c.length)*0.34));
      if(d<=tol && d<bestD){ bestD=d; best=e; } }
  }
  return best;
}
/* ===== voice input (Web Speech API) — resolves leniently, then answers ===== */
const SpeechRec = window.SpeechRecognition||window.webkitSpeechRecognition;
function voiceSupported(){ return !!SpeechRec; }
let recog=null, recognizing=false;
function toggleVoice(){
  if(!SpeechRec) return;
  if(recognizing && recog){ try{recog.stop();}catch(e){} return; }
  try{
    recog=new SpeechRec(); recog.lang=EN()?'en-US':'ko-KR'; recog.interimResults=false; recog.maxAlternatives=4;
    recog.onstart=()=>{ recognizing=true; el.micbtn.classList.add('rec'); setFeedback(state.mode==='capital'?LT('듣고 있어요… 수도를 말하세요.','Listening… say the capital.'):LT('듣고 있어요… 나라 이름을 말하세요.','Listening… say a country name.'),'info'); };
    recog.onerror=(ev)=>{ if(ev&&ev.error==='not-allowed') setFeedback(LT('마이크 권한이 필요해요.','Microphone permission needed.'),'no','x'); };
    recog.onend=()=>{ recognizing=false; el.micbtn.classList.remove('rec'); };
    recog.onresult=(e)=>{ const alts=[]; for(const r of e.results[0]) alts.push(r.transcript); handleVoiceGuess(alts); };
    recog.start();
  }catch(err){}
}
function handleVoiceGuess(alts){
  if(state.mode==='capital'){
    // for the capital quiz, prefer an alternative that matches the capital, else just submit the top one
    const hit=alts.find(a=>capitalMatch(a,state.target));
    el.q.value=hit||alts[0]||''; submit(); return;
  }
  for(const a of alts){ const e=lookup.get(norm(a))||looseFind(a);
    if(e){ el.q.value=EN()?(e.en||e.ko):e.ko; submit(); return; } }
  el.q.value=alts[0]||'';
  setFeedback(LT('“'+(alts[0]||'')+'” 로 들었어요 — 확인 후 입력해 주세요.','Heard “'+(alts[0]||'')+'” — check and submit.'),'info');
}

function submit(){

  const entry=resolveName(raw); const m=state.mode;
  if(m==='chain'){ chainGuess(raw); return; }

  if(m==='free'){ if(!entry){notFound(raw);return;} revealFree(entry); el.q.value=''; }
  else if(m==='quiz'||m==='review'||m==='daily'){
    if(!entry){notFound(raw);return;}
    if(!state.vs && !state.running){ state.running=true; startTicker(); }   // timer starts on first answer (solo only)
    if(entry.id===state.target.id){
      if(state.vs) vsAward(1); else { state.score++; updateScore(); trackCountry(state.target,true); }
      state.found.add(entry.id); markFound(entry,true); tagCapture(entry); celebrate(true,LT('정답!','Correct!'));
      setFeedback(LT('정답! ','Correct! ')+entry.ko+' · '+entry.en,'ok','check'); el.q.value='';
      if(state.vs) vsAfterAnswer(true); else if(m==='daily') later(nextDailyTarget,700); else later(nextQuizTarget,650);
    } else { shakeInput(); noteMiss(state.target); const msg=EN()?('Not '+NM(entry)+'. Look at the outlined country.'):(entry.ko+' 이(가) 아니에요. 표시된 나라를 보세요.');
      if(state.vs){ vsPenalty(); celebrate(false,LT('−1점','−1')); el.q.value=''; setFeedback(vsWrongMsg(msg),'no','x'); }
      else setFeedback(msg,'no','x'); }
  }
  else if(m==='flag'){
    if(!entry){notFound(raw);return;}
    if(!state.vs && !state.running){ state.running=true; startTicker(); }   // timer starts on first answer (solo only)
    if(entry.id===state.target.id){
      if(state.vs){ vsAward(1); state.found.add(entry.id); markFound(entry,true); tagCapture(entry); } else { state.score++; state.found.add(entry.id); updateScore(); trackCountry(state.target,true); }
      celebrate(true,LT('정답!','Correct!'));
      setFeedback(LT('정답! ','Correct! ')+flagEmoji(entry.i2)+' '+NM(entry),'ok','check'); el.q.value='';
      if(state.vs) vsAfterAnswer(true); else later(nextFlagTarget,650);
    } else { shakeInput(); noteMiss(state.target); const msg=EN()?('Not '+NM(entry)+'.'):(entry.ko+' 이(가) 아니에요.');
      if(state.vs){ vsPenalty(); celebrate(false,LT('−1점','−1')); el.q.value=''; setFeedback(vsWrongMsg(msg),'no','x'); }
      else setFeedback(msg,'no','x'); }
  }
  else if(m==='capital'){
    const t=state.target; if(!t) return;
    if(!state.vs && !state.running){ state.running=true; startTicker(); }

      if(state.vs) vsAward(1); else { state.score++; updateScore(); trackCountry(t,true); }
      celebrate(true,LT('정답!','Correct!'));
      setFeedback(LT('정답! ','Correct! ')+NM(t)+' · '+capitalDisplay(t),'ok','check'); el.q.value='';
      if(state.vs) vsAfterAnswer(true); else later(nextCapitalTarget,650);
    } else { shakeInput(); noteMiss(t); const msg=EN()?('Not the capital of '+NM(t)+'.'):(NM(t)+'의 수도가 아니에요.');
      if(state.vs){ vsPenalty(); celebrate(false,LT('−1점','−1')); el.q.value=''; setFeedback(vsWrongMsg(msg),'no','x'); }
      else setFeedback(msg,'no','x'); }
  }
  else if(m==='landmark'){

      const lm=state.landmarkCur;
      if(state.vs) vsAward(1); else { state.score++; updateScore(); trackCountry(state.target,true); }

      setFeedback(LT('정답! ','Correct! ')+NM(entry)+(lm?(' · '+(EN()?lm.en:lm.ko)):''),'ok','check'); el.q.value='';
      if(state.vs) vsAfterAnswer(true); else later(nextLandmarkTarget,950);
    } else { shakeInput(); noteMiss(state.target); const msg=EN()?('Not '+NM(entry)+'.'):(entry.ko+' 이(가) 아니에요.');
      if(state.vs){ vsPenalty(); celebrate(false,LT('−1점','−1')); el.q.value=''; setFeedback(vsWrongMsg(msg),'no','x'); }
      else setFeedback(msg,'no','x'); }
  }
  else if(m==='silhouette'||m==='capcountry'){
    if(!entry){notFound(raw);return;}
    if(!state.vs && !state.running){ state.running=true; startTicker(); }
    const nextT=m==='silhouette'?nextSilTarget:nextCapCountryTarget;
    if(entry.id===state.target.id){
      if(state.vs) vsAward(1); else { state.score++; updateScore(); trackCountry(state.target,true); }
      celebrate(true,LT('정답!','Correct!'));
      setFeedback(LT('정답! ','Correct! ')+NM(entry)+(m==='capcountry'?(' · '+capitalDisplay(state.target)):''),'ok','check'); el.q.value='';
      if(state.vs) vsAfterAnswer(true); else later(nextT,800);
    } else { shakeInput(); noteMiss(state.target); const msg=EN()?('Not '+NM(entry)+'.'):(entry.ko+' 이(가) 아니에요.');
      if(state.vs){ vsPenalty(); celebrate(false,LT('−1점','−1')); el.q.value=''; setFeedback(vsWrongMsg(msg),'no','x'); }
      else setFeedback(msg,'no','x'); }
  }
  else if(m==='ranked'){
    if(!state.rankedActive) return;
    if(state.rankedItem && state.rankedItem.fun){
      if(funMatch(raw, state.rankedItem.fun)) rankedAnswer(true);
      else { shakeInput(); setFeedback(LT('음… 다른 답을 대보세요!','Hmm — try a different answer!'),'no','x'); el.q.value=''; }
      return; }
    if(!entry){ notFound(raw); return; }
    if(state.target && entry.id===state.target.id){ rankedAnswer(true); }
    else { shakeInput(); setFeedback(EN()?('Not '+NM(entry)+' — keep trying (exact name).'):(NM(entry)+' 이(가) 아니에요 — 정확한 이름으로 계속!'),'no','x'); el.q.value=''; }
  }
  else if(m==='hint'){
    if(!entry){notFound(raw);return;}
    if(entry.id===state.hintTarget.id){
      const gain=hintPotential(), used=state.hintShown+state.feverShown;
      if(state.vs) vsAward(gain); else { state.score+=gain; updateScore(); trackCountry(state.hintTarget,true); }
      revealHintAnswer(entry); tagCapture(entry); celebrate(true,LT('+'+gain+'점','+'+gain+' pts'));
      setFeedback(LT('정답! ','Correct! ')+entry.ko+' · '+entry.en+LT(' · +'+gain+'점 (힌트 '+used+'개)',' · +'+gain+' pts ('+used+' hints)'),'ok','check'); el.q.value='';
      if(state.vs){ vsAfterAnswer(true); } else later(nextHintTarget,1300);
    } else { shakeInput(); el.q.value='';   // wrong: do NOT auto-reveal another hint (no stacking)
      const msg=EN()?('Not '+NM(entry)+'. Try again — or reveal a hint.'):(entry.ko+' 이(가) 아니에요. 다시 도전하거나 힌트를 눌러 보세요.');
      if(state.vs){ vsPenalty(); celebrate(false,LT('−1점','−1')); setFeedback(vsWrongMsg(msg),'no','x'); }
      else setFeedback(msg,'no','x'); }
  }
  else if(m==='clue'){
    if(!entry){notFound(raw);return;}
    if(entry.id===state.clueTarget.id){
      const gain=cluePotential(); state.score+=gain; updateScore(); trackCountry(state.clueTarget,true);
      revealHintAnswer(entry); celebrate(true,LT('+'+gain+'점','+'+gain+' pts'));
      setFeedback(LT('정답! ','Correct! ')+entry.ko+' · '+entry.en+LT(' · +'+gain+'점',' · +'+gain+' pts'),'ok','check'); el.q.value='';
      later(nextClueTarget,1300);
    } else { shakeInput(); el.q.value='';
      setFeedback(EN()?('Not '+NM(entry)+'. Buy another clue or guess again.'):(entry.ko+' 이(가) 아니에요. 힌트를 더 열거나 다시 맞혀 보세요.'),'no','x'); }
  }
  else if(m==='region'){
    if(!entry){notFound(raw);return;}
    if(!state.regionIds.has(entry.id)){ setFeedback(EN()?(NM(entry)+' is not in '+regionName(state.region)+'.'):(entry.ko+' 은(는) '+regionName(state.region)+' 나라가 아니에요.'),'no','x'); shakeInput(); el.q.value=''; return; }
    if(state.found.has(entry.id)){ setFeedback(LT('이미 찾음: ','Already found: ')+NM(entry),'info'); el.q.value=''; return; }
    if(!state.running){ state.running=true; startTicker(); }
    state.found.add(entry.id); markFound(entry,true); updateScore();
    setFeedback(entry.ko+' · '+entry.en,'ok','check'); el.q.value='';
    if(regionFoundCount()>=state.regionTotal) endGame();
  }
  else {
    if(!entry){notFound(raw);return;}
    if(!state.running){ state.running=true; startTicker(); }
    if(state.found.has(entry.id)){ setFeedback(LT('이미 찾은 나라예요: ','Already found: ')+NM(entry),'info'); el.q.value=''; return; }
    state.found.add(entry.id); markFound(entry,true); updateScore();
    setFeedback(entry.ko+' · '+entry.en+(entry.sov?'':LT(' (지역/자치령)',' (territory)')),'ok','check'); el.q.value='';
  }
}

  else if(m==='landmark'){ const t=state.target, lm=state.landmarkCur; if(!state.vs) trackCountry(t,false); setFeedback(EN()?('It was '+NM(t)+(lm?(' · '+lm.en):'')+'.'):('정답은 '+NM(t)+(lm?(' · '+lm.ko):'')+' 였어요.'),'info'); el.q.value=''; if(state.vs) vsAfterAnswer(false); else later(nextLandmarkTarget,900); }
  else if(m==='silhouette'){ const t=state.target; if(!state.vs) trackCountry(t,false); setFeedback(ans(NM(t)),'info'); el.q.value=''; if(state.vs) vsAfterAnswer(false); else later(nextSilTarget,800); }
  else if(m==='capcountry'){ const t=state.target; if(!state.vs) trackCountry(t,false); setFeedback(EN()?('It was '+NM(t)+' ('+capitalDisplay(t)+').'):('정답은 '+NM(t)+' ('+capitalDisplay(t)+') 였어요.'),'info'); el.q.value=''; if(state.vs) vsAfterAnswer(false); else later(nextCapCountryTarget,800); }

const overlay=$('overlay');
function endGame(){
  if(state.ended) return;
  if(state.mode==='ranked'){ endRanked(); return; }
  state.ended=true; state.running=false; stopTicker(); el.q.disabled=true;
  const m=state.mode;
  const TIMEUP=LT('시간 종료!','Time’s up!');
  if(m==='quiz') showOverlay(TIMEUP,state.score,EN()?('You named '+state.score+' countries.'):('나라 이름 '+state.score+'개를 맞혔어요.'));
  else if(m==='findmap') showOverlay(TIMEUP,state.score,EN()?('You found '+state.score+' on the map.'):('지도에서 '+state.score+'개를 찾았어요.'));
  else if(m==='flag') showOverlay(TIMEUP,state.score,EN()?('You named '+state.score+' flags.'):('국기 '+state.score+'개를 맞혔어요.'));
  else if(m==='capital') showOverlay(TIMEUP,state.score,EN()?('You named '+state.score+' capitals.'):('수도 '+state.score+'개를 맞혔어요.'));
  else if(m==='landmark') showOverlay(TIMEUP,state.score,EN()?('You named '+state.score+' from landmarks.'):('명소로 '+state.score+'개를 맞혔어요.'));
  else if(m==='silhouette') showOverlay(TIMEUP,state.score,EN()?('You named '+state.score+' from their outlines.'):('윤곽으로 '+state.score+'개를 맞혔어요.'));
  else if(m==='capcountry') showOverlay(TIMEUP,state.score,EN()?('You named '+state.score+' from their capitals.'):('수도로 '+state.score+'개를 맞혔어요.'));
  else if(m==='compare') showOverlay(TIMEUP,state.score,EN()?('You got '+state.score+' comparisons right.'):('비교 '+state.score+'개를 맞혔어요.'));
  else if(m==='oddone') showOverlay(TIMEUP,state.score,EN()?('You solved '+state.score+' puzzles.'):('퍼즐 '+state.score+'개를 풀었어요.'));
  else if(m==='region'){ const n=regionFoundCount(),tot=state.regionTotal,done=n>=tot;
    showOverlay(done?LT('완성! 🎉','Complete! 🎉'):LT('종료','Done'),n+' / '+tot, done? (EN()?('Cleared all of '+regionName(state.region)+' in '+fmtTime(state.elapsed)+'!'):(regionName(state.region)+' 전체를 '+fmtTime(state.elapsed)+' 만에 완성!')) : (EN()?(n+' of '+tot+' in '+regionName(state.region)+'.'):(regionName(state.region)+' '+tot+'개 중 '+n+'개.'))); }
  else if(m==='place'){ showOverlay(LT('완성! 🎉','Complete! 🎉'),state.placeTotal+LT('개',''), EN()?('Placed every label in '+regionName(state.region)+' in '+fmtTime(state.elapsed)+'!'):(regionName(state.region)+'의 모든 이름표를 '+fmtTime(state.elapsed)+' 만에 붙였어요!')); }
  else if(m==='locate'){ showOverlay(LT('다 익혔어요! 🎉','All learned! 🎉'),state.locTotal+' / '+state.locTotal, EN()?('You located every country in '+regionName(state.region)+'!'):(regionName(state.region)+'의 모든 나라 위치를 익혔어요!')); }
  else if(m==='conquer'){ const done=state.conquerDone>=state.conquerTotal;
    showOverlay(done?(EN()?('🏆 '+regionName(state.region)+' conquered!'):('🏆 '+regionName(state.region)+' 정복!')):TIMEUP, state.conquerDone+' / '+state.conquerTotal,
      done? (EN()?('Painted every country in '+regionName(state.region)+' in '+fmtTime(state.elapsed)+'!'):(regionName(state.region)+'의 모든 나라를 '+fmtTime(state.elapsed)+' 만에 칠했어요!')) : (EN()?('Almost! '+state.conquerDone+' of '+state.conquerTotal+' painted.'):('조금만 더! '+state.conquerTotal+'개 중 '+state.conquerDone+'개 칠했어요.'))); }
  else { const sov=sovFoundCount(); showOverlay(TIMEUP,sov+' / '+TOTAL_SOV,EN()?('You found '+sov+' of '+TOTAL_SOV+' sovereign states!'):('주권국 '+TOTAL_SOV+'개 중 '+sov+'개를 찾았어요!')); }
  // save the result for the logged-in profile & flag a new best
  const scoreMap={quiz:state.score,flag:state.score,capital:state.score,findmap:state.score,compare:state.score,oddone:state.score,landmark:state.score,silhouette:state.score,capcountry:state.score,
    countdown:sovFoundCount(),region:regionFoundCount(),conquer:state.conquerDone,place:state.placeTotal,locate:state.locTotal};
  if(scoreMap[m]!==undefined){ const r=recordResult(m,scoreMap[m]); const sfx=resultSuffix(r,scoreMap[m]); if(sfx){ const s=$('ovsub'); s.textContent=s.textContent+sfx; }
    renderOverlayExtras(m,scoreMap[m]); if(r&&r.tierUp) playTierCutscene('game', modeName(m), r.tierUp); }
  else renderOverlayExtras(m,state.score);
}

let csT=null;
const CS_COLORS=['#f5c542','#ff6a3a','#4ade80','#38a8ff','#c084fc','#ff8fb0'];
function csConfetti(){ let h=''; for(let i=0;i<26;i++){ const l=Math.round(i/26*100)+Math.floor(Math.random()*4);
    const c=CS_COLORS[i%CS_COLORS.length], dur=(1.6+Math.random()*1.4).toFixed(2), del=(Math.random()*0.9).toFixed(2);
    h+='<span class="cs-conf" style="left:'+l+'%;background:'+c+';animation-duration:'+dur+'s;animation-delay:'+del+'s"></span>'; }

function playTierCutscene(kind, title, detail, extra){
  if(SET&&SET.effects===false) return;   // respect "effects off"
  const cs=$('cutscene'); if(!cs) return;
  let head, name, note, badge;
  if(kind==='rank'){ head=LT('등급 상승','RANK UP'); name=title; note=detail||''; badge='<div class="cs-badge">'+(extra||'🏅')+'</div>'; }
  else { head=LT('티어 상승','TIER UP'); name=esc(title)+' · Tier '+(TIER_ROMAN[detail]||''); note=LT('새 등급 달성!','New tier reached!'); badge='<div class="cs-badge"><div class="cs-medal">'+(TIER_ROMAN[detail]||'★')+'</div></div>'; }
  cs.innerHTML='<div class="cs-rays"></div><div class="cs-core">'+badge+'<div class="cs-head">'+head+'</div><div class="cs-name">'+name+'</div><div class="cs-note">'+esc(note)+'</div></div>'+csConfetti();
  cs.classList.remove('show'); void cs.offsetWidth; cs.classList.add('show');

/* ================= local 1v1 (pass-the-device, turn-based) ================= */
function vsRoundsFor(m){ return m==='hint'?6:10; }
function vsInit(){ state.turn=0; state.p=[0,0]; state.vsDone=0; state.vsRounds=vsRoundsFor(state.mode); updateVsBar(); }
function vsScoreChip(){ return '<span class="'+(state.turn===0?'p1cur':'')+'">P1 '+state.p[0]+'</span> : <span class="'+(state.turn===1?'p2cur':'')+'">'+state.p[1]+' P2</span>'; }
function updateVsBar(){
  if(!state.vs){ el.vsbar.classList.add('hidden'); return; }
  el.vsbar.classList.remove('hidden');
  const rd=Math.min(state.vsDone+1,state.vsRounds);
  el.vsbar.innerHTML='<span class="vsp p1'+(state.turn===0?' on':'')+'">P1 · '+state.p[0]+'</span>'
    +'<span class="vsturn">'+LT('P'+(state.turn+1)+' 차례 · '+rd+'/'+state.vsRounds,'P'+(state.turn+1)+'’s turn · '+rd+'/'+state.vsRounds)+'</span>'
    +'<span class="vsp p2'+(state.turn===1?' on':'')+'">P2 · '+state.p[1]+'</span>';
}
function vsAward(points){ state.p[state.turn]+=(points||1); updateScore(); }
// wrong guess in 1v1: lose a point (never below 0) but KEEP the turn and the same question
function vsPenalty(){ state.p[state.turn]=Math.max(0,state.p[state.turn]-1); updateScore(); updateVsBar(); }
function vsWrongMsg(base){ return base+LT(' · −1점, 계속 도전!',' · −1 pt, keep trying!'); }
function vsAfterAnswer(correct){
  state.vsDone++; const g=state.gen;
  setTimeout(()=>{ if(state.gen!==g||state.ended||!state.vs) return;
    if(state.vsDone>=state.vsRounds){ endVs(); return; }
    state.turn^=1; updateVsBar();
    const m=state.mode;
    if(m==='quiz') nextQuizTarget(); else if(m==='flag') nextFlagTarget(); else if(m==='findmap') nextFindTarget(); else if(m==='hint') nextHintTarget(); else if(m==='capital') nextCapitalTarget(); else if(m==='landmark') nextLandmarkTarget(); else if(m==='silhouette') nextSilTarget(); else if(m==='capcountry') nextCapCountryTarget();
    if(m!=='findmap') el.q.focus();
  }, correct?900:1150);
}
function endVs(){
  state.ended=true; stopTicker(); if(el.q) el.q.disabled=true;
  const a=state.p[0], b=state.p[1];
  const title=a===b?LT('무승부!','Draw!'):(a>b?LT('🏆 P1 승리!','🏆 P1 wins!'):LT('🏆 P2 승리!','🏆 P2 wins!'));
  showOverlay(title,'P1 '+a+' : '+b+' P2',LT('1 대 1 · '+state.vsRounds+'문항','1v1 · '+state.vsRounds+' rounds'));
}

/* ---- per-game tiers (I–X) + account XP / levels ---- */
const TIER_ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
// score to reach Tier X (elite ceiling per mode). High tiers are meant to be a hard grind; low tiers stay reachable.
const TIER_MAX={quiz:60,countdown:145,region:54,daily:10,ladder:40,chain:40,compare:46,estimate:1000,oddone:40,sym:16,fall:65,
  place:50,locate:50,conquer:46,flag:60,capital:55,findmap:60,silhouette:48,capcountry:52,landmark:45};

function tierThreshold(mode,i){ const tx=TIER_MAX[mode]||50; if(i>=10) return tx; return Math.max(i, Math.round(tx*Math.pow(i/10,1.2))); }
function categoryTier(mode,best){ let t=0; for(let i=1;i<=10;i++){ if((best||0)>=tierThreshold(mode,i)) t=i; } return t; }
function tierXCount(u){ const b=(u&&u.stats&&u.stats.best)||{}; let n=0; Object.keys(b).forEach(k=>{ if(categoryTier(k,b[k])>=10) n++; }); return n; }
function xpForLevel(L){ return 50*L*L; }
function levelForXp(xp){ return Math.max(0,Math.floor(Math.sqrt((xp||0)/50))); }

  Object.keys(b).forEach(k=>{ const t=categoryTier(k,b[k]); for(let i=1;i<=t;i++) g+=i*20; });   // each tier i is worth 20·i XP
  if(u.stats&&u.stats.elo!=null) g+=Math.max(0,Math.round((u.stats.elo-1000)/2));                 // ELO above the 1000 base
  g+=(u.stats&&u.stats.games||0)*3;                                                                // a little per game played
  return g; }

  const rec=cc[entry.i2]||(cc[entry.i2]={r:0,w:0,box:0,t:0});
  if(correct){ rec.r++; rec.box=Math.min(5,rec.box+1); }
  else { rec.w++; rec.box=Math.max(0,rec.box-1); }
  rec.t=Date.now();
  accSave();
}
// mastery level from a record: 0 unseen · 1 struggling · 2 learning · 3 mastered
function masteryLevel(i2){
  const u=curUser(); if(!u||!u.stats||!u.stats.cc) return 0;
  const r=u.stats.cc[i2]; if(!r||(r.r+r.w)===0) return 0;
  if(r.box>=4) return 3;   // mastered
  if(r.box>=1) return 2;   // learning (answered right at least once, net)
  return 1;                // struggling (box back to 0)
}

/* ---- data transfer between devices (export/import a backup code) ---- */
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(b64.trim()))); }
function exportCode(u){ return b64enc(JSON.stringify({v:1,user:{name:u.name,salt:u.salt,hash:u.hash,stats:u.stats||{games:0,best:{},plays:{},points:0}}})); }
function importCode(code){
  let o; try{ o=JSON.parse(b64dec(code)); }catch(e){ return {err:'bad'}; }
  const u=o&&o.user;
  if(!u||!u.name||!u.hash||!u.salt) return {err:'bad'};
  const key=String(u.name).toLowerCase();
  ACC.users[key]={name:u.name,salt:u.salt,hash:u.hash,stats:u.stats||{games:0,best:{},plays:{},points:0}};
  ACC.current=key; accSave(); return {name:u.name};
}
function downloadText(filename,text){
  try{ const blob=new Blob([text],{type:'text/plain'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  }catch(e){}
}

async function onAuthSubmit(e){

  if(SUPA_ON){

    authMsg(LT('처리 중…','Working…'),'');
    try{
      const j=authTab==='signup' ? await sbFn('signup',{username:name,password:pw,email:email||undefined})
                                  : await sbFn('login',{username:name,password:pw});
      SB.saveTok(j.session);
      const p=await sbLoadProfile(); applyCloudProfile(p||{username:name,stats:{}});
      closeAuth(); renderProfile();
    }catch(err){ if(btn) btn.disabled=false; authMsg(cloudAuthError(err),'err'); }
    return;
  }
  if(name.length<1){ authMsg(LT('이름을 입력하세요.','Enter a name.'),'err'); return; }
  if(pw.length<4){ authMsg(LT('비밀번호는 4자 이상이어야 해요.','Password must be at least 4 characters.'),'err'); return; }
  const key=name.toLowerCase();
  if(authTab==='signup'){
    if(ACC.users[key]){ authMsg(LT('이미 있는 이름이에요 — 로그인하세요.','That name already exists — log in instead.'),'err'); return; }
    const salt=randSalt(), hash=await hashPass(pw,salt);
    ACC.users[key]={name,salt,hash,stats:{games:0,best:{},plays:{},points:0}};
    ACC.current=key; accSave(); closeAuth(); renderProfile();
  } else {
    const u=ACC.users[key];
    if(!u){ authMsg(LT('그런 이름이 없어요 — 회원가입하세요.','No such name — sign up instead.'),'err'); return; }

    if(hash!==u.hash){ authMsg(LT('비밀번호가 틀렸어요.','Wrong password.'),'err'); return; }
    ACC.current=key; accSave(); closeAuth(); renderProfile();
  }
}
