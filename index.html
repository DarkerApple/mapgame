<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 지도 하이라이트 — 나라 찾기 게임</title>
<meta name="description" content="나라 이름이나 약자를 입력하면 세계 지도에서 해당 나라가 하이라이트됩니다. 학습 카드, 타이머, 여러 게임 모드 포함.">
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --ocean1:#141519; --ocean2:#0a0a0c;
  --surface:#141519; --surface2:#1c1e24; --surface3:#24262d;
  --border:#2b2e36; --border2:#3a3e48;
  --land:#3a3d45; --land-stroke:#5a5f6a; --hover:#565b66;
  --found:#f2f4f7; --found-stroke:#b3b9c4;
  --target:#ffffff;
  --text:#f3f5f8; --muted:#9ba2af; --faint:#6a707b;
  --accent:#ffffff; --accent-ink:#0b0b0d;
  --shadow:0 16px 48px rgba(0,0,0,.6);
  --font:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Segoe UI,Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font-family:var(--font); font-size:14px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.ic{width:1.05em;height:1.05em;flex:0 0 auto;display:inline-block;vertical-align:-.16em}
#app{display:flex;flex-direction:column;height:100%}
.hidden{display:none!important}

/* ---------- header (two rows) ---------- */
header{background:var(--surface);position:relative;z-index:30;border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:10px;padding:7px 14px}
.bar-top{border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:-.01em}
.brand .ic{width:19px;height:19px;opacity:.92}
.modes{display:flex;gap:4px;flex-wrap:wrap;margin-left:6px}
.mode{
  background:transparent;border:1px solid transparent;color:var(--muted);
  padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;
  transition:color .16s,background .16s,transform .12s;white-space:nowrap;
}
.mode:hover{color:var(--text);background:var(--surface2)}
.mode:active{transform:translateY(1px)}
.mode.active{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tools-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{
  display:flex;align-items:baseline;gap:7px;background:var(--surface2);border:1px solid var(--border);
  padding:6px 13px;border-radius:10px;font-variant-numeric:tabular-nums;
}
.chip .lbl{font-size:11px;color:var(--muted)}
.chip .val{font-size:15px;font-weight:700;letter-spacing:.01em;transition:color .2s}
#timer.low .val{animation:lowPulse 1s ease-in-out infinite}
@keyframes lowPulse{0%,100%{opacity:1}50%{opacity:.35}}
select#region{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;padding:7px 11px;border-radius:10px;cursor:pointer;max-width:46vw;
}
select#region:focus{outline:none;border-color:var(--border2)}
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:8px 13px;border-radius:10px;cursor:pointer;font:inherit;font-size:13px;
  transition:background .16s,border-color .16s,transform .12s;
}
.btn:hover{background:var(--surface3);border-color:var(--border2)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.solid:hover{filter:brightness(.94)}

/* ---------- prompt + input ---------- */
#promptbar{
  padding:10px 16px 2px;font-size:13.5px;color:var(--muted);text-align:center;
  min-height:24px;animation:fadeSlide .3s ease;
}
#promptbar b{color:var(--text);font-weight:700}
#promptbar .flag{display:block;font-size:34px;line-height:1;margin:0 0 5px;animation:cardIn .3s ease}
#promptbar .cname{font-size:16px;color:var(--text);font-weight:700}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(5px) scale(.94)}to{opacity:1;transform:none}}
#inputrow{display:flex;gap:8px;padding:8px 16px 4px;max-width:680px;margin:0 auto;width:100%;justify-content:center}
#q{
  flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);
  font:inherit;font-size:16px;padding:12px 15px;outline:none;transition:border-color .16s,box-shadow .16s;
}
#q::placeholder{color:var(--faint)}
#q:focus{border-color:#666d7a;box-shadow:0 0 0 3px rgba(255,255,255,.07)}
#q.shake{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#inputrow .btn{padding:0 16px;font-size:14px}
#go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#go:hover{filter:brightness(.94)}
.step{min-width:74px}
#feedback{
  text-align:center;min-height:22px;padding:4px 16px 8px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
#feedback .ic{width:16px;height:16px}
#feedback.bump{animation:bump .28s ease}
@keyframes bump{from{opacity:.2;transform:translateY(2px)}to{opacity:1;transform:none}}
#feedback.ok{color:var(--found)}
#feedback.no{color:#cfd3da}
#feedback.info{color:var(--muted);font-weight:500}

/* ---------- stage: map + study list panel ---------- */
#stage{display:flex;flex:1;min-height:0}
#studypanel{flex:0 0 340px;width:340px;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--border)}
.sp-title{font-size:13.5px;font-weight:700}
.sp-toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.sp-toggle input{accent-color:#fff;width:16px;height:16px;cursor:pointer;margin:0}
#sp-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:9px;display:flex;flex-direction:column;gap:6px}
#sp-list::-webkit-scrollbar{width:10px}
#sp-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid var(--surface)}
.sp-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:var(--text);
  background:var(--surface2);border:1px solid transparent;border-radius:11px;padding:10px 12px;cursor:pointer;
  font:inherit;transition:background .14s,border-color .14s,transform .1s}
.sp-item:hover{background:var(--surface3)}
.sp-item:active{transform:scale(.99)}
.sp-item.active{border-color:var(--accent);background:#22262e}
.sp-flag{font-size:22px;line-height:1;width:28px;text-align:center;flex:0 0 auto}
.sp-name{font-size:14.5px;font-weight:700}
.sp-meta{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
#sp-list.hide .sp-name,#sp-list.hide .sp-meta{opacity:0}
#sp-list.hide .sp-item.active .sp-name{opacity:1}
/* place mode: draggable label chips */
.sp-item.chip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.sp-item.chip:active{cursor:grabbing}
.sp-item.chip.dragging{opacity:.35}
.sp-item.chip.shake{animation:shake .34s}
#dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-150%);
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;
  padding:8px 13px;border-radius:11px;box-shadow:var(--shadow);white-space:nowrap;
  display:flex;align-items:center;gap:7px}
#map .dragover{stroke:#fff!important;stroke-width:1.1!important;filter:drop-shadow(0 0 6px rgba(255,255,255,.95))}
/* hint list (revealed clues) */
.sp-hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);
  border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.45;animation:cardIn .25s ease}
.sp-hint .hn{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--surface3);color:var(--muted);
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sp-hint b{color:var(--text);font-weight:700}
/* rank list rows */
.sp-item .sp-rank{flex:0 0 auto;width:26px;text-align:right;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.sp-item .sp-val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
select#metric{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;padding:7px 11px;border-radius:10px;cursor:pointer;max-width:40vw}
select#metric:focus{outline:none;border-color:var(--border2)}

/* ---------- map ---------- */
#mapwrap{position:relative;flex:1;min-height:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,var(--ocean1),var(--ocean2) 72%,#060608 100%);}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.grabbing{cursor:grabbing}
#map path,#map circle{
  fill:var(--land);stroke:var(--land-stroke);stroke-width:.18;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;transition:fill .28s ease,stroke .2s ease;
}
#map path:hover,#map circle:hover{fill:var(--hover)}
#map circle{stroke-width:.4;fill:#4a4e58}
#map .sset{fill:#797e89;stroke:#9aa0ab}
#map circle.sset{fill:#797e89}
#map .found{fill:var(--found);stroke:var(--found-stroke)}
#map circle.found{fill:var(--found)}
#map .target{stroke:var(--target);stroke-width:.9;animation:pulseTarget 1.3s ease-in-out infinite}
@keyframes pulseTarget{0%,100%{filter:drop-shadow(0 0 .5px rgba(255,255,255,.4))}50%{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}}
.pop{transform-box:fill-box;transform-origin:center;animation:popIn .5s ease}
@keyframes popIn{0%{transform:scale(.35);opacity:.3}55%{transform:scale(1.14)}100%{transform:scale(1)}}
#map .wrong{stroke:#fff!important;stroke-width:1!important;animation:wrongPulse .5s}
@keyframes wrongPulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}}
#map text.clabel{fill:#0b0b0d;paint-order:stroke;stroke:rgba(255,255,255,.92);
  font-weight:700;pointer-events:none;dominant-baseline:middle;font-family:inherit;letter-spacing:-.04em}
#map text.clabel.cur{fill:#000;stroke:#fff}

#tooltip{
  position:absolute;pointer-events:none;background:rgba(10,11,14,.96);border:1px solid var(--border2);
  color:var(--text);padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600;
  transform:translate(-50%,-145%);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:8}
#mapctrl{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:6}
#mapctrl .btn{width:38px;height:38px;padding:0;border-radius:10px;background:rgba(20,21,25,.86);backdrop-filter:blur(6px)}
#mapctrl .btn .ic{width:18px;height:18px}
#legend{
  position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:13px;flex-wrap:wrap;
  background:rgba(20,21,25,.86);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:10px;
  padding:7px 12px;font-size:11.5px;color:var(--muted);z-index:6}
#legend .sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
#legend .sw.tgt{background:transparent;border:2px solid var(--target);width:10px;height:10px}

footer{
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted);text-align:center;
  border-top:1px solid var(--border);background:var(--surface)}
footer kbd{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:10.5px;font-family:ui-monospace,monospace}

/* ---------- result overlay ---------- */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
  background:rgba(6,6,8,.72);backdrop-filter:blur(4px);animation:fade .25s ease}
#overlay.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:26px 30px;
  text-align:center;max-width:min(420px,92vw);box-shadow:var(--shadow);animation:cardPop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardPop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.card h2{font-size:17px;margin-bottom:3px;font-weight:700}
.card .big{font-size:42px;font-weight:800;margin:10px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card p{color:var(--muted);font-size:13px;margin-bottom:16px}
.card .btn{padding:11px 24px;font-size:14px}
#durrow{display:flex;gap:5px;flex-wrap:wrap}
#durrow button{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;
  padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer;transition:all .14s}
#durrow button:hover{color:var(--text)}
#durrow button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- mobile ---------- */
@media(max-width:720px){
  .bar{padding:7px 12px;gap:8px}
  .bar-top{flex-wrap:wrap}
  .brand{width:100%}
  .modes{width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:1px}
  .modes::-webkit-scrollbar{display:none}
  .mode{padding:8px 14px;font-size:13px}
  .bar-tools{flex-wrap:wrap}
  .chip{flex:1;justify-content:center}
  .tools-right{width:100%;margin-left:0}
  .tools-right .btn{flex:1}
  select#region{max-width:none;flex:1}
  #legend{display:none}
  #q{font-size:16px;padding:12px 14px}
  #promptbar .flag{font-size:32px}
  #mapctrl .btn{width:44px;height:44px}
  #stage{flex-direction:column}
  #studypanel{flex:0 0 46%;width:auto;border-left:none;border-top:1px solid var(--border)}
  .sp-flag{font-size:20px;width:26px}
  .sp-name{font-size:14px}
}
@media(max-width:430px){
  #inputrow .btn span.t{display:none}
  .tools-right .btn span.t{display:none}
  .step{min-width:46px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="bar bar-top">
      <div class="brand"><span data-icon="globe"></span> 세계 지도 하이라이트</div>
      <nav class="modes">
        <button class="mode active" data-mode="free">자유 탐색</button>
        <button class="mode" data-mode="study">학습 카드</button>
        <button class="mode" data-mode="place">이름표 놓기</button>
        <button class="mode" data-mode="quiz">이름 맞히기</button>
        <button class="mode" data-mode="findmap">지도에서 찾기</button>
        <button class="mode" data-mode="flag">국기 퀴즈</button>
        <button class="mode" data-mode="hint">힌트 퀴즈</button>
        <button class="mode" data-mode="region">지역별 도전</button>
        <button class="mode" data-mode="countdown">전세계 도전</button>
        <button class="mode" data-mode="rank">순위표</button>
      </nav>
    </div>
    <div class="bar bar-tools">
      <div class="chip" id="timer"><span class="lbl">시간</span><span class="val" id="timerval">0:00</span></div>
      <div class="chip" id="scorechip"><span class="lbl" id="scorelbl">찾은 나라</span><span class="val" id="scoreval">0</span></div>
      <div class="tools-right">
        <select id="metric" class="hidden" title="지표 선택"></select>
        <button class="btn hidden" id="orderbtn" data-icon="sort"><span class="t">내림차순</span></button>
        <select id="region" class="hidden" title="지역 선택"></select>
        <div id="durrow" class="hidden"></div>
        <button class="btn" id="regquiz" data-icon="search"><span class="t">이 지역 시험</span></button>
        <button class="btn" id="reset" data-icon="reset"><span class="t">초기화</span></button>
      </div>
    </div>
  </header>

  <div id="promptbar"></div>

  <div id="inputrow">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="나라 이름이나 약자 입력…  (예: 대한민국, 미국, JP)">
    <button class="btn" id="go" data-icon="check"><span class="t">확인</span></button>
    <button class="btn hidden" id="hintbtn" data-icon="bulb"><span class="t">다음 힌트</span></button>
    <button class="btn hidden" id="skip" data-icon="skip"><span class="t">넘기기</span></button>
    <button class="btn hidden step" id="prev" data-icon="prev"><span class="t">이전</span></button>
    <button class="btn hidden step" id="shuffle" data-icon="shuffle"><span class="t">섞기</span></button>
    <button class="btn hidden step" id="next" data-icon="next"><span class="t">다음</span></button>
  </div>
  <div id="feedback"></div>

  <div id="stage">
    <div id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="tooltip"></div>
      <div id="legend">
        <span><span class="sw" style="background:var(--land)"></span>기본</span>
        <span><span class="sw" style="background:var(--found)"></span>찾음</span>
        <span><span class="sw tgt"></span>문제</span>
      </div>
      <div id="mapctrl">
        <button class="btn" id="zin" data-icon="plus" title="확대"></button>
        <button class="btn" id="zout" data-icon="minus" title="축소"></button>
        <button class="btn" id="zfit" data-icon="fit" title="전체 보기"></button>
      </div>
    </div>
    <aside id="studypanel" class="hidden">
      <div class="sp-head">
        <span class="sp-title" id="sp-title">지역</span>
        <label class="sp-toggle" id="sp-toggle"><input type="checkbox" id="hideNames"> 이름 가리기</label>
      </div>
      <div id="sp-list"></div>
    </aside>
  </div>
  <div id="dragghost" class="hidden"></div>

  <footer>
    한글·영문 이름 또는 약자(<kbd>KR</kbd> <kbd>US</kbd> <kbd>JP</kbd> <kbd>UK</kbd>) 입력 ·
    휠/손가락 오므리기로 확대 · 드래그로 이동 · 자유 탐색에선 지도를 눌러도 됩니다
  </footer>
</div>

<div id="overlay">
  <div class="card">
    <h2 id="ovtitle">결과</h2>
    <div class="big" id="ovbig">0</div>
    <p id="ovsub"></p>
    <button class="btn solid" id="ovbtn">다시 하기</button>
  </div>

let view=[VBX,VBY,VBW,VBH];
function applyView(){ map.setAttribute('viewBox',view.map(n=>Math.round(n*100)/100).join(' ')); }
applyView();
let anim=null;
function animateView(target,ms){
  if(anim) cancelAnimationFrame(anim);
  const start=view.slice(), t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function step(now){ let t=Math.min(1,(now-t0)/ms), e=ease(t);
    for(let i=0;i<4;i++) view[i]=start[i]+(target[i]-start[i])*e; applyView();
    if(t<1) anim=requestAnimationFrame(step); }
  anim=requestAnimationFrame(step);
}
function clampView(){
  view[2]=Math.max(6,Math.min(VBW,view[2])); view[3]=view[2]*(VBH/VBW);
  view[0]=Math.max(VBX-view[2]*0.15,Math.min(VBX+VBW-view[2]*0.85,view[0]));
  view[1]=Math.max(VBY-view[3]*0.15,Math.min(VBY+VBH-view[3]*0.85,view[1]));
}
function focusEntry(entry,pad){
  const b=entry.b; pad=pad||1.2;
  let w=Math.max(b[2],b[3]*(VBW/VBH))*pad; w=Math.max(w,14); w=Math.min(w,VBW);
  let h=w*(VBH/VBW); const cx=b[0]+b[2]/2, cy=b[1]+b[3]/2;
  const t=[cx-w/2,cy-h/2,w,h];
  t[0]=Math.max(VBX-w*0.15,Math.min(VBX+VBW-w*0.85,t[0]));
  t[1]=Math.max(VBY-h*0.15,Math.min(VBY+VBH-h*0.85,t[1]));
  animateView(t,480);
}
function fitRegion(pool){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pool.forEach(e=>{ const b=e.b||[e.x,e.y,0,0]; x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[0]+b[2]);y1=Math.max(y1,b[1]+b[3]); });
  const ar=VBW/VBH; let w=(x1-x0)*1.3, h=(y1-y0)*1.3;
  if(w/h<ar) w=h*ar; h=w/ar; w=Math.min(w,VBW); h=w/ar;
  let cx=(x0+x1)/2, cy=(y0+y1)/2, vx=cx-w/2, vy=cy-h/2;
  vx=Math.max(VBX-w*0.1,Math.min(VBX+VBW-w*0.9,vx));
  vy=Math.max(VBY-h*0.1,Math.min(VBY+VBH-h*0.9,vy));
  animateView([vx,vy,w,h],520); return w;
}
function resetView(){ animateView([VBX,VBY,VBW,VBH],480); }

  view[2]*=e.deltaY<0?0.82:1.22; clampView();
  view[0]=px-(e.clientX-r.left)/r.width*view[2];

  if(pointers.size>=2){
    const [a,b]=pts(); const dist=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(!pinch){ pinch={dist,view:view.slice(),mx,my}; return; }
    gestureMoved=true;
    const wx=pinch.view[0]+(pinch.mx-r.left)/r.width*pinch.view[2];
    const wy=pinch.view[1]+(pinch.my-r.top)/r.height*pinch.view[3];
    view[2]=pinch.view[2]*(pinch.dist/Math.max(1,dist)); clampView();
    view[0]=wx-(mx-r.left)/r.width*view[2];
    view[1]=wy-(my-r.top)/r.height*view[3];
    clampView(); applyView();
  } else if(drag){
    const dx=(e.clientX-drag.x)/r.width*view[2], dy=(e.clientY-drag.y)/r.height*view[3];
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4) gestureMoved=true;
    view[0]=drag.v[0]-dx; view[1]=drag.v[1]-dy; clampView(); applyView();
  }
});
function upPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(pointers.size===0){ drag=null; map.classList.remove('grabbing'); }
  else if(pointers.size===1){ const p=pts()[0]; drag={x:p.x,y:p.y,v:view.slice()}; }
}
map.addEventListener('pointerup',upPointer);
map.addEventListener('pointercancel',upPointer);

document.getElementById('zin').onclick=()=>{view[2]*=0.7;clampView();applyView();};
document.getElementById('zout').onclick=()=>{view[2]*=1.43;clampView();applyView();};
document.getElementById('zfit').onclick=resetView;

/* ================= tooltip + click ================= */
const tooltip=document.getElementById('tooltip');
map.addEventListener('pointermove',e=>{
  if(state.mode!=='free'||drag||pointers.size){ tooltip.style.opacity=0; return; }
  const entry=byEl.get(e.target);
  if(entry){ tooltip.textContent=entry.ko;
    const r=map.getBoundingClientRect();
    tooltip.style.left=(e.clientX-r.left)+'px'; tooltip.style.top=(e.clientY-r.top)+'px'; tooltip.style.opacity=1;
  } else tooltip.style.opacity=0;
});
map.addEventListener('pointerleave',()=>tooltip.style.opacity=0);
map.addEventListener('click',e=>{
  if(gestureMoved) return;
  const entry=byEl.get(e.target); if(!entry) return;
  if(state.mode==='free') revealFree(entry);
  else if(state.mode==='findmap') handleFindClick(entry);
  else if(state.mode==='study'){ const i=state.cards.indexOf(entry); if(i>=0) showCard(i); }
  else if(state.mode==='rank'){ const i=state.rankList?state.rankList.indexOf(entry):-1; if(i>=0) focusRank(i); }

function clearLabels(){ while(gLabels.firstChild) gLabels.removeChild(gLabels.firstChild); }

/* ================= state ================= */
const state={mode:'free',running:false,found:new Set(),score:0,target:null,pool:[],

  regionIds:null,regionTotal:0,cards:[],cardIdx:0,gen:0,
  metric:'pop',rankAsc:false,rankList:null,hintQueue:[],hintTarget:null,hints:[],hintShown:0};
let ticker=null;
// run fn after ms, but skip if the round/mode changed meanwhile (avoids stale-target crashes)
function later(fn,ms){ const g=state.gen; setTimeout(()=>{ if(!state.ended && state.gen===g) fn(); },ms); }
const el={
  timerval:$('timerval'),timer:$('timer'),scoreval:$('scoreval'),scorelbl:$('scorelbl'),
  prompt:$('promptbar'),feedback:$('feedback'),q:$('q'),go:$('go'),skip:$('skip'),
  prev:$('prev'),next:$('next'),shuffle:$('shuffle'),region:$('region'),regquiz:$('regquiz'),durrow:$('durrow'),
  studypanel:$('studypanel'),spList:$('sp-list'),spTitle:$('sp-title'),spToggle:$('sp-toggle'),hideNames:$('hideNames'),

};
function $(id){ return document.getElementById(id); }

let dragEntry=null, dragChip=null, dragHover=null, dragStartX=0, dragStartY=0;

function fmtTime(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateTimerDisplay(){

}
function startTicker(){

function setFeedback(msg,cls,icon){

function shuffleArr(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================= score ================= */
function sovFoundCount(){ let n=0; state.found.forEach(id=>{const e=idMap.get(id); if(e&&e.sov)n++;}); return n; }
function regionFoundCount(){ let n=0; if(state.regionIds) state.found.forEach(id=>{ if(state.regionIds.has(id)) n++; }); return n; }
function updateScore(){

/* ================= input layout ================= */
function setInputMode(kind){ // text | quiz | flag | click | study | place | hint | rank

/* ================= modes ================= */
function setMode(mode){
  state.mode=mode;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  const scoped=['study','place','region','quiz','findmap','flag','hint','rank'].includes(mode);

  el.durrow.classList.toggle('hidden',mode!=='countdown');
  if(scoped){
    if((mode==='study'||mode==='place'||mode==='region'||mode==='hint') && state.region==='전세계') state.region='동아시아';
    el.region.value=state.region;
  }
  if(mode==='free'){ state.countUp=true; setInputMode('text'); el.scorelbl.textContent='찾은 나라'; }
  else if(mode==='study'){ state.countUp=true; setInputMode('study'); el.scorelbl.textContent='카드'; }
  else if(mode==='place'){ state.countUp=true; setInputMode('place'); el.scorelbl.textContent='놓음'; }
  else if(mode==='quiz'){ state.countUp=false; state.duration=90; setInputMode('quiz'); el.scorelbl.textContent='점수'; }
  else if(mode==='findmap'){ state.countUp=false; state.duration=90; setInputMode('click'); el.scorelbl.textContent='점수'; }
  else if(mode==='flag'){ state.countUp=false; state.duration=90; setInputMode('flag'); el.scorelbl.textContent='점수'; }
  else if(mode==='hint'){ state.countUp=true; setInputMode('hint'); el.scorelbl.textContent='맞힘'; }
  else if(mode==='region'){ state.countUp=true; setInputMode('text'); el.scorelbl.textContent='진행'; }
  else if(mode==='countdown'){ state.countUp=false; state.duration=[60,180,300].includes(state.duration)?state.duration:180; buildDurRow(state.duration); setInputMode('text'); el.scorelbl.textContent='찾은 나라'; }
  else if(mode==='rank'){ state.countUp=true; setInputMode('rank'); el.scorelbl.textContent='나라'; }
  resetMode();
}

function resetMode(){
  stopTicker(); hideOverlay(); clearLabels(); state.gen++; cancelDrag();
  state.running=false; state.ended=false; state.found=new Set(); state.score=0;
  state.elapsed=0; state.target=null; state.queue=[]; state.pool=[]; state.regionIds=null; state.regionTotal=0;
  clearMap(); el.studypanel.classList.add('hidden');
  el.q.disabled=false; el.q.value='';
  const m=state.mode, region=state.region;

  if(m==='study'){ startStudy(); updateTimerDisplay(); return; }
  if(m==='place'){ startPlace(); updateTimerDisplay(); return; }
  if(m==='hint'){ startHint(); updateTimerDisplay(); return; }
  if(m==='rank'){ startRank(); updateTimerDisplay(); return; }

  resetView(); updateScore(); updateTimerDisplay();

  if(m==='free'){
    el.prompt.innerHTML='나라 이름을 입력하면 지도에서 <b>하이라이트</b>됩니다. 마음껏 탐색해 보세요!';
    setFeedback('전 세계 '+allEntries.length+'개 나라·지역을 찾을 수 있어요.','info'); el.q.focus();
  } else if(m==='quiz'){
    state.pool=regionEntries(region).filter(e=>!e.isMarker); if(!state.pool.length) state.pool=allEntries.filter(e=>e.sov&&!e.isMarker);
    setFeedback(regionName(region)+' · 90초 안에 최대한 많이 맞혀 보세요!','info');
    nextQuizTarget(); startTicker(); state.running=true; el.q.focus();
  } else if(m==='findmap'){
    state.pool=regionEntries(region).filter(e=>!e.isMarker); if(!state.pool.length) state.pool=allEntries.filter(e=>e.sov&&!e.isMarker);
    setFeedback(regionName(region)+' · 90초! 이름을 보고 지도에서 누르세요.','info');
    nextFindTarget(); startTicker(); state.running=true;
  } else if(m==='flag'){
    state.pool=regionEntries(region).filter(e=>e.i2); if(!state.pool.length) state.pool=allEntries.filter(e=>e.sov&&e.i2);
    setFeedback(regionName(region)+' · 90초 안에 국기를 보고 맞혀 보세요!','info');
    nextFlagTarget(); startTicker(); state.running=true; el.q.focus();
  } else if(m==='region'){
    const pool=regionEntries(region); state.regionIds=new Set(pool.map(e=>e.id)); state.regionTotal=pool.length;
    updateScore();
    el.prompt.innerHTML='<b>'+regionName(region)+'</b>의 모든 나라를 입력하세요. (총 '+state.regionTotal+'개국)';
    setFeedback('첫 나라를 입력하면 시간이 시작됩니다. 위에서 지역을 바꿀 수 있어요.','info'); el.q.focus();
  } else {
    el.prompt.innerHTML='제한 시간 안에 최대한 많은 나라를 입력하세요. 목표: <b>'+TOTAL_SOV+'</b>개 주권국.';
    setFeedback('첫 나라를 입력하면 시간이 시작됩니다.','info'); el.q.focus();
  }
}

/* ================= study (map spotlight + readable list panel) ================= */
function startStudy(){

  setFeedback('오른쪽 목록·지도를 눌러 이동, “섞기”로 순서 바꾸기, “이름 가리기”로 자가 테스트, 준비되면 “이 지역 시험”.','info');

}
function buildStudyList(pool){

function showCard(i){
  if(!state.cards.length) return;

  for(let k=0;k<items.length;k++) items[k].classList.toggle('active',k===state.cardIdx);

}
el.prev.onclick=()=>{ if(state.mode==='study') showCard(state.cardIdx-1); };
el.next.onclick=()=>{ if(state.mode==='study') showCard(state.cardIdx+1); };
el.shuffle.onclick=()=>{ if(state.mode==='study'){ shuffleArr(state.cards); buildStudyList(state.cards); showCard(0); } };
el.regquiz.onclick=()=>{ if(state.mode==='study') setMode('quiz'); };
el.hideNames.onchange=()=>{ el.spList.classList.toggle('hide',el.hideNames.checked); };

/* ================= place mode (drag labels onto the land) ================= */
function startPlace(){
  let pool=regionEntries(state.region).filter(e=>!e.isMarker);
  if(!pool.length) pool=allEntries.filter(e=>e.sov&&!e.isMarker);
  state.cards=shuffleArr(pool.slice()); state.placeTotal=pool.length;
  clearMap(); clearLabels();
  pool.forEach(e=>{ e.el.classList.add('sset'); e.el.parentNode.appendChild(e.el); }); // the play area
  state.studyW=fitRegion(pool);
  buildTray();
  el.studypanel.classList.remove('hidden');
  el.prompt.innerHTML='<b>'+regionName(state.region)+'</b> · 이름표를 알맞은 나라 땅 위로 끌어다 놓으세요.';
  setFeedback('맞는 나라에 놓으면 붙고, 틀리면 돌아옵니다. 다 붙이면 완성!','info');
  updateScore();
}
function buildTray(){
  el.spTitle.textContent='남은 이름표 · '+state.cards.length+'개';
  el.spList.classList.remove('hide'); el.spList.innerHTML='';
  state.cards.forEach(e=>{
    const c=document.createElement('div'); c.className='sp-item chip'; c.dataset.id=e.id;
    c.innerHTML='<span class="sp-flag">'+flagEmoji(e.i2)+'</span><span class="sp-name"></span>';
    c.querySelector('.sp-name').textContent=e.ko;
    c.addEventListener('pointerdown',ev=>beginDrag(ev,e,c));
    el.spList.appendChild(c);
  });
}
function moveGhost(x,y){ ghost.style.left=x+'px'; ghost.style.top=y+'px'; }
function entryAtPoint(x,y){ const t=document.elementFromPoint(x,y); return t?byEl.get(t):null; }
function beginDrag(ev,e,chip){
  if(state.ended||dragEntry) return;
  ev.preventDefault();
  dragEntry=e; dragChip=chip; dragStartX=ev.clientX; dragStartY=ev.clientY; chip.classList.add('dragging');
  ghost.innerHTML='<span class="sp-flag">'+flagEmoji(e.i2)+'</span><span></span>';
  ghost.lastChild.textContent=e.ko;
  ghost.classList.remove('hidden'); moveGhost(ev.clientX,ev.clientY);
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragUp);
  window.addEventListener('pointercancel',cancelDrag);
}
function onDragMove(ev){
  if(!dragEntry) return;
  moveGhost(ev.clientX,ev.clientY);
  const e=entryAtPoint(ev.clientX,ev.clientY);
  if(e!==dragHover){
    if(dragHover) dragHover.el.classList.remove('dragover');
    dragHover=e||null;
    if(dragHover && dragHover.el.classList.contains('sset')) dragHover.el.classList.add('dragover');
    else dragHover=null;
  }
}
function endDragListeners(){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragUp);
  window.removeEventListener('pointercancel',cancelDrag);
}
function cancelDrag(){
  endDragListeners(); ghost.classList.add('hidden');
  if(dragHover){ dragHover.el.classList.remove('dragover'); dragHover=null; }
  if(dragChip) dragChip.classList.remove('dragging');
  dragEntry=null; dragChip=null;
}
function onDragUp(ev){
  const e=dragEntry, chip=dragChip;
  const moved=Math.abs(ev.clientX-dragStartX)+Math.abs(ev.clientY-dragStartY)>6;
  const target=entryAtPoint(ev.clientX,ev.clientY);
  cancelDrag();
  if(!e||!moved) return;   // a tap without dragging isn't a drop
  if(target && target.id===e.id) placeLabel(e,chip);
  else failDrop(e,chip,target);
}
function placeLabel(e,chip){
  e.el.classList.remove('sset','dragover'); e.el.classList.add('found');
  e.el.classList.remove('pop'); void e.el.offsetWidth; e.el.classList.add('pop');
  e.el.parentNode.appendChild(e.el);
  addPlacedLabel(e);
  state.cards=state.cards.filter(x=>x.id!==e.id);
  if(chip&&chip.parentNode) chip.parentNode.removeChild(chip);
  el.spTitle.textContent='남은 이름표 · '+state.cards.length+'개';
  if(!state.running){ state.running=true; startTicker(); }
  updateScore();
  setFeedback('붙었어요! '+e.ko,'ok','check');
  if(state.cards.length===0) endGame();
}
function failDrop(e,chip,target){
  if(target){ target.el.classList.remove('wrong'); void target.el.offsetWidth; target.el.classList.add('wrong'); setTimeout(()=>target.el.classList.remove('wrong'),500); }
  if(chip){ chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake'); }
  setFeedback(target?(e.ko+' 은(는) 여기가 아니에요. 다시 놓아 보세요.'):('나라 땅 위에 놓아 주세요.'),'no','x');
}
function addPlacedLabel(e){
  const b=e.b||[e.x,e.y,0,0];
  const w=e.isMarker?0:(b[2]||1);
  const fs=Math.max((state.studyW||120)*0.006,Math.min((state.studyW||120)*0.02,w*0.3));
  const t=document.createElementNS(SVGNS,'text');
  t.setAttribute('x',b[0]+b[2]/2); t.setAttribute('y',b[1]+b[3]/2);
  t.setAttribute('font-size',fs.toFixed(3)); t.setAttribute('stroke-width',(fs*0.16).toFixed(3));
  t.setAttribute('text-anchor','middle'); t.setAttribute('class','clabel');
  t.textContent=e.ko; gLabels.appendChild(t);
}

/* ================= hint quiz (guess by clues) ================= */
function hintPool(){ return regionEntries(state.region).filter(e=>e.st); }
function sizeBucket(a){
  if(a>=2500000) return '세계에서 손꼽히게 큰';
  if(a>=1000000) return '아주 큰';
  if(a>=300000) return '큰 편인';
  if(a>=100000) return '중간 크기의';
  if(a>=30000) return '작은 편인';
  return '아주 작은';
}
function buildHints(e){
  const s=e.st||{}, hs=[];
  hs.push('이 나라는 <b>'+regionOf(e)+'</b>에 있어요.');
  if(s.area) hs.push('면적으로 보면 <b>'+sizeBucket(s.area)+'</b> 나라예요.');
  const loc=[]; if(s.lat!=null) loc.push(s.lat>=0?'북반구':'남반구'); if(s.land!=null) loc.push(s.land?'내륙국(바다에 접하지 않음)':'바다에 접한 나라');
  if(loc.length) hs.push('위치: <b>'+loc.join('</b>, <b>')+'</b>.'+(s.temp!=null?(' 연평균 기온 약 '+s.temp+'℃.'):''));
  if(s.pop) hs.push('인구는 약 <b>'+fmtPop(s.pop)+'</b>이에요.');
  if(s.gov) hs.push('정부 형태는 <b>'+s.gov+'</b>이에요.');
  if(s.gdp||s.gpc){ const t=[]; if(s.gdp)t.push('GDP 약 '+fmtUSD(s.gdp)); if(s.gpc)t.push('1인당 GDP 약 $'+fmtInt(s.gpc)); hs.push('경제: <b>'+t.join('</b>, <b>')+'</b>.'); }
  if(s.nb&&s.nb.length) hs.push('<b>'+s.nb.join('·')+'</b> 와(과) 국경을 맞대고 있어요.');
  else if(s.land===0) hs.push('육지 국경이 없는 <b>섬나라</b>예요.');
  if(s.cap) hs.push('수도는 <b>'+s.cap+'</b>이에요.');
  return hs;
}
function startHint(){
  state.score=0;
  const pool=hintPool();
  el.spToggle.classList.add('hidden');
  if(!pool.length){ el.studypanel.classList.add('hidden'); el.prompt.innerHTML='이 지역은 힌트 자료가 부족해요. 다른 지역을 골라 주세요.'; setFeedback('','info'); updateScore(); return; }
  el.studypanel.classList.remove('hidden'); el.spList.classList.remove('hide');
  state.hintQueue=shuffleArr(pool.slice());
  updateScore(); nextHintTarget();
}
function nextHintTarget(){
  clearMap(); clearLabels();
  const pool=hintPool();
  if(!state.hintQueue.length) state.hintQueue=shuffleArr(pool.slice());
  state.hintTarget=state.hintQueue.pop();
  state.studyW=fitRegion(pool);
  state.hints=buildHints(state.hintTarget); state.hintShown=0;
  el.spTitle.textContent='힌트'; el.spList.innerHTML='';
  el.prompt.innerHTML='이 나라는 어디일까요? <b>힌트</b>를 보고 이름을 입력하세요.';
  setFeedback('“다음 힌트”로 단서를 더 볼 수 있어요 (총 '+state.hints.length+'개).','info');
  revealHint(); revealHint();
  el.q.value=''; el.q.focus();
}
function revealHint(){
  if(state.mode!=='hint'||state.ended||!state.hints) return;
  if(state.hintShown>=state.hints.length){ setFeedback('더 이상 힌트가 없어요. 정답을 입력하거나 넘겨 보세요.','info'); return; }
  const i=state.hintShown++;
  const d=document.createElement('div'); d.className='sp-hint';
  d.innerHTML='<span class="hn">'+(i+1)+'</span><span>'+state.hints[i]+'</span>';
  el.spList.appendChild(d); d.scrollIntoView({block:'nearest'});
  if(!state.running){ state.running=true; startTicker(); }
}
function revealHintAnswer(t){ clearMap(); t.el.classList.add('found'); t.el.parentNode.appendChild(t.el); showStudyLabel(t); focusEntry(t,2); }
el.hintbtn.onclick=()=>{ if(state.mode==='hint') revealHint(); };

/* ================= rankings board ================= */
function buildMetricSelect(){
  if(el.metric.children.length) return;
  METRICS.forEach(m=>{ const o=document.createElement('option'); o.value=m.k; o.textContent=m.t; el.metric.appendChild(o); });
  el.metric.value=state.metric;
}
function rankShade(t){ const lo=72,hi=238,v=Math.round(lo+(hi-lo)*t); return 'rgb('+v+','+(v+4)+','+(v+10)+')'; }
function startRank(){
  el.spToggle.classList.add('hidden'); el.studypanel.classList.remove('hidden'); el.spList.classList.remove('hide');
  buildMetricSelect(); el.metric.value=state.metric; renderRank();
}
function renderRank(){
  const mk=state.metric, mdef=METRICS.find(m=>m.k===mk), region=state.region, asc=state.rankAsc;
  const list=regionEntries(region).filter(e=>e.st && e.st[mk]!=null);
  list.sort((a,b)=> asc ? a.st[mk]-b.st[mk] : b.st[mk]-a.st[mk]);
  state.rankList=list;
  clearMap(); clearLabels();
  const n=list.length;
  list.forEach((e,i)=>{ e.el.style.fill=rankShade(n>1?1-(i/(n-1)):1); });
  state.studyW = region==='전세계' ? (resetView(),VBW) : fitRegion(regionEntries(region));
  el.spTitle.textContent=mdef.t+' · '+regionName(region)+' ('+n+')';
  el.spList.innerHTML='';
  list.forEach((e,i)=>{
    const b=document.createElement('button'); b.className='sp-item'; b.dataset.i=i;
    b.innerHTML='<span class="sp-rank">'+(i+1)+'</span><span class="sp-flag">'+flagEmoji(e.i2)+'</span><span class="sp-name"></span><span class="sp-val"></span>';
    b.querySelector('.sp-name').textContent=e.ko;
    b.querySelector('.sp-val').textContent=mdef.fmt(e.st[mk]);
    b.onclick=()=>focusRank(i);
    el.spList.appendChild(b);
  });
  updateScore();
  el.prompt.innerHTML='<b>'+mdef.t+'</b> 순위 · 지도 색이 <b>밝을수록 상위</b>. 목록이나 지도를 눌러 값을 확인하세요.';
  setFeedback(regionName(region)+' · '+n+'개국 · '+(asc?'오름차순':'내림차순'),'info');
}
function focusRank(i){
  const e=state.rankList&&state.rankList[i]; if(!e) return;
  allEntries.forEach(x=>x.el.classList.remove('target'));
  e.el.classList.add('target'); e.el.parentNode.appendChild(e.el); showStudyLabel(e);
  const mdef=METRICS.find(m=>m.k===state.metric);
  setFeedback((i+1)+'위 · '+e.ko+' — '+mdef.t+' '+mdef.fmt(e.st[state.metric]),'ok','check');
  const items=el.spList.children; for(let k=0;k<items.length;k++) items[k].classList.toggle('active',k===i);
  if(items[i]) items[i].scrollIntoView({block:'nearest'});
}
el.metric.onchange=()=>{ state.metric=el.metric.value; state.rankAsc=false; const t=el.orderbtn.querySelector('.t'); if(t)t.textContent='내림차순'; if(state.mode==='rank') renderRank(); };
el.orderbtn.onclick=()=>{ state.rankAsc=!state.rankAsc; const t=el.orderbtn.querySelector('.t'); if(t)t.textContent=state.rankAsc?'오름차순':'내림차순'; if(state.mode==='rank') renderRank(); };

/* ================= answering ================= */
function notFound(raw){ setFeedback('“'+raw+'” — 찾을 수 없어요. 이름이나 약자를 확인해 주세요.','no','x'); shakeInput(); }
function revealFree(entry){
  if(!state.running){ state.running=true; startTicker(); }
  const already=state.found.has(entry.id); state.found.add(entry.id);
  markFound(entry,!already); focusEntry(entry,1.5); updateScore();
  setFeedback((already?'다시 표시: ':'')+entry.ko+' · '+entry.en,'ok','check');
}
function flashWrong(entry){ entry.el.classList.remove('wrong'); void entry.el.offsetWidth; entry.el.classList.add('wrong'); setTimeout(()=>entry.el.classList.remove('wrong'),500); }
function handleFindClick(entry){
  if(state.ended) return;
  if(entry.id===state.target.id){
    state.score++; state.found.add(entry.id); updateScore(); markFound(entry,true);
    setFeedback('정답! '+entry.ko,'ok','check');
    later(nextFindTarget,550);
  } else { flashWrong(entry); setFeedback('여기는 '+entry.ko+' 예요. 다시 찾아보세요.','no','x'); }
}
function submit(){
  if(state.ended) return;
  const raw=el.q.value.trim(); if(!raw) return;
  const entry=lookup.get(norm(raw)); const m=state.mode;
  if(m==='free'){ if(!entry){notFound(raw);return;} revealFree(entry); el.q.value=''; }
  else if(m==='quiz'){
    if(!entry){notFound(raw);return;}
    if(entry.id===state.target.id){
      state.score++; state.found.add(entry.id); updateScore(); markFound(entry,true);
      setFeedback('정답! '+entry.ko+' · '+entry.en,'ok','check'); el.q.value='';
      later(nextQuizTarget,500);
    } else { setFeedback(entry.ko+' 이(가) 아니에요. 표시된 나라를 보세요.','no','x'); shakeInput(); }
  }
  else if(m==='flag'){
    if(!entry){notFound(raw);return;}
    if(entry.id===state.target.id){
      state.score++; state.found.add(entry.id); updateScore();
      setFeedback('정답! '+flagEmoji(entry.i2)+' '+entry.ko,'ok','check'); el.q.value='';
      later(nextFlagTarget,450);
    } else { setFeedback(entry.ko+' 이(가) 아니에요.','no','x'); shakeInput(); }
  }
  else if(m==='hint'){
    if(!entry){notFound(raw);return;}
    if(entry.id===state.hintTarget.id){
      state.score++; updateScore(); revealHintAnswer(entry);
      setFeedback('정답! '+entry.ko+' · '+entry.en+' (힌트 '+state.hintShown+'개)','ok','check'); el.q.value='';
      later(nextHintTarget,1200);
    } else { setFeedback(entry.ko+' 이(가) 아니에요. 힌트를 더 보세요.','no','x'); shakeInput(); revealHint(); el.q.value=''; }
  }
  else if(m==='region'){
    if(!entry){notFound(raw);return;}
    if(!state.regionIds.has(entry.id)){ setFeedback(entry.ko+' 은(는) '+regionName(state.region)+' 나라가 아니에요.','no','x'); shakeInput(); el.q.value=''; return; }
    if(state.found.has(entry.id)){ setFeedback('이미 찾음: '+entry.ko,'info'); el.q.value=''; return; }
    if(!state.running){ state.running=true; startTicker(); }
    state.found.add(entry.id); markFound(entry,true); updateScore();
    setFeedback(entry.ko+' · '+entry.en,'ok','check'); el.q.value='';
    if(regionFoundCount()>=state.regionTotal) endGame();
  }
  else {
    if(!entry){notFound(raw);return;}
    if(!state.running){ state.running=true; startTicker(); }
    if(state.found.has(entry.id)){ setFeedback('이미 찾은 나라예요: '+entry.ko,'info'); el.q.value=''; return; }
    state.found.add(entry.id); markFound(entry,true); updateScore();
    setFeedback(entry.ko+' · '+entry.en+(entry.sov?'':' (지역/자치령)'),'ok','check'); el.q.value='';
  }
}
el.skip.onclick=()=>{
  if(state.ended) return; const m=state.mode;
  if(m==='quiz'){ setFeedback('정답은 '+state.target.ko+' 였어요.','info'); el.q.value=''; later(nextQuizTarget,700); }
  else if(m==='findmap'){ const t=state.target; setFeedback('정답은 '+t.ko+' 였어요.','info');
    if(!t.el.classList.contains('found')){ t.el.classList.add('target'); focusEntry(t,2); }
    later(()=>{ t.el.classList.remove('target'); resetView(); nextFindTarget(); },1100); }
  else if(m==='flag'){ setFeedback('정답은 '+flagEmoji(state.target.i2)+' '+state.target.ko+' 였어요.','info'); el.q.value=''; later(nextFlagTarget,700); }
  else if(m==='hint'){ const t=state.hintTarget; setFeedback('정답은 '+t.ko+' 였어요.','info'); revealHintAnswer(t); el.q.value=''; later(nextHintTarget,1400); }
};

/* ================= end / overlay ================= */
const overlay=$('overlay');
function endGame(){
  if(state.ended) return;
  state.ended=true; state.running=false; stopTicker(); el.q.disabled=true;
  const m=state.mode;
  if(m==='quiz') showOverlay('시간 종료!',state.score,'나라 이름 '+state.score+'개를 맞혔어요.');
  else if(m==='findmap') showOverlay('시간 종료!',state.score,'지도에서 '+state.score+'개를 찾았어요.');
  else if(m==='flag') showOverlay('시간 종료!',state.score,'국기 '+state.score+'개를 맞혔어요.');
  else if(m==='region'){ const n=regionFoundCount(),tot=state.regionTotal,done=n>=tot;
    showOverlay(done?'완성! 🎉':'종료',n+' / '+tot, done? regionName(state.region)+' 전체를 '+fmtTime(state.elapsed)+' 만에 완성!' : regionName(state.region)+' '+tot+'개 중 '+n+'개.'); }
  else if(m==='place'){ showOverlay('완성! 🎉',state.placeTotal+'개', regionName(state.region)+'의 모든 이름표를 '+fmtTime(state.elapsed)+' 만에 붙였어요!'); }
  else { const sov=sovFoundCount(); showOverlay('시간 종료!',sov+' / '+TOTAL_SOV,'주권국 '+TOTAL_SOV+'개 중 '+sov+'개를 찾았어요!'); }
}
function showOverlay(title,big,sub){ $('ovtitle').textContent=title; $('ovbig').textContent=big; $('ovsub').textContent=sub; overlay.classList.add('show'); }
function hideOverlay(){ overlay.classList.remove('show'); }
overlay.addEventListener('click',e=>{ if(e.target===overlay) hideOverlay(); });
$('ovbtn').onclick=()=>resetMode();

/* ================= wiring (IME-safe) ================= */
let composing=false;
el.q.addEventListener('compositionstart',()=>composing=true);
el.q.addEventListener('compositionend',()=>{ composing=false; });
el.q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(composing||e.isComposing||e.keyCode===229) return; e.preventDefault(); submit(); } });
el.go.onclick=submit;
$('reset').onclick=resetMode;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

setMode('free');
</script>
